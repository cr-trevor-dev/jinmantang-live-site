.row{
  display:flex;
  justify-content:space-between;
  gap:14px;

.row:last-child{

.row span{

  display:grid;
  grid-template-columns:

button{

  border:0;
  border-radius:13px;
  padding:13px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  background:
  linear-gradient(
    180deg,
    #f1d784,
    #b47d20
  );
  color:#171109;
}

button.secondary{
  background:#1b1717;
  color:#d9a7a2;

  1px solid

  opacity:.45;

}

.empty{
  text-align:center;
  color:#7f786b;

.msg{

<div class="wrap">

    <div class="en">

    </div>

  </div>


  <a

    ← 返回管理中心

  <div

    <div class="title">

    </div>

  </div>


  <main
    id="mainBox"
    class="hidden">


    <section class="card">

      <div class="title">
        退款核对概况
      </div>


      <div class="summary">

        <div class="summaryBox">
          <small>待人工核对</small>
          <strong id="pendingCount">0</strong>
        </div>

        <div class="summaryBox">
          <small>已人工退款</small>
          <strong id="refundedCount">0</strong>
        </div>

        <div class="summaryBox">
          <small>确认无需退款</small>
          <strong id="cancelledCount">0</strong>
        </div>

      </div>


      <div
        class="notice"
        style="margin-top:13px">

        这里的“待人工核对”不代表平台已经收到款，也不代表已经退款。
        只有确认现实中的 KPay / 银行款项确实到账后，
        才人工退款并点击“已完成实际退款”；
        如果核对后确认没有实际到账，则点击“确认无需退款”。

      </div>

    <section class="card">

      <div class="title">
        待人工核对

        <div class="empty">
          正在读取...
        </div>

      </div>

    </section>


    <section class="card">

      <div class="title">
        处理记录
      </div>

      <div id="historyList">

        <div class="empty">
          正在读取...
        </div>

      </div>

    </section>


    <div
      id="pageMsg"
      class="msg">
    </div>

  </main>


  <div class="foot">
    © JIN MANTANG · ADMIN REFUND REVIEW
  </div>

</div>


<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let refreshPromise =
null;


let rows =
[];


/* =========================================================
   SESSION
========================================================= */

function saveSession(data){

  if(data?.access_token){

    token =
    data.access_token;


    localStorage.setItem(
      'jmt_access_token',
      token
    );


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

  }


  if(data?.refresh_token){

    refreshToken =
    data.refresh_token;


    localStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );


    sessionStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

  }

}


function getJwtPayload(){

  try{

    let part =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');


    while(
      part.length
      %
      4
    ){

      part += '=';

    }


    return JSON.parse(

      decodeURIComponent(

        atob(part)
        .split('')
        .map(

          c =>
          '%'
          +
          (
            '00'
            +
            c.charCodeAt(0)
            .toString(16)
          )
          .slice(-2)

        )
        .join('')

      )

    );

  }
  catch{

    return {};

  }

}


async function refreshAdminSession(){

  if(!refreshToken){

    return false;

  }


  if(refreshPromise){

    return refreshPromise;

  }


  refreshPromise =
  (
    async()=>{

      try{

        const res =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:'POST',

            headers:{

              apikey:
              KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(!res.ok){

          return false;

        }


        const data =
        await res.json();


        if(!data.access_token){

          return false;

        }


        saveSession(
          data
        );


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:
        KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let res =
  await request();


  if(
    res.status
    !==
    401
  ){

    return res;

  }


  const refreshed =
  await refreshAdminSession();


  if(!refreshed){

    return res;

  }


  return request();

}


/* =========================================================
   ADMIN VERIFY
========================================================= */

async function verifyAdmin(){

  if(!token){

    return false;

  }


  const payload =
  getJwtPayload();


  if(
    payload.aal
    !==
    'aal2'
  ){

    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){

      return false;

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(!adminRes.ok){

      return false;

    }


    const data =
    await adminRes.json();


    return (
      Array.isArray(
        data
      )
      &&
      data.length > 0
    );

  }
  catch{

    return false;

  }

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function money(value){

  return new Intl.NumberFormat(

    'en-US',

    {
      maximumFractionDigits:0
    }

  )
  .format(
    Number(
      value
      ||
      0
    )
  );

}


function roundName(row){

  if(!row.round_date){

    return '—';

  }


  let label =
  row.round_code
  ||
  '';


  if(
    row.round_code
    ===
    '1030'
  ){

    label =
    '上午 11:45';

  }


  if(
    row.round_code
    ===
    '1530'
  ){

    label =
    '下午 3:45';

  }


  return (
    row.round_date
    +
    ' · '
    +
    label
  );

}


function statusText(status){

  const map = {

    pending:
    '待人工核对',

    partial:
    '部分退款',

    refunded:
    '已完成退款',

    cancelled:
    '无需退款'

  };


  return (
    map[status]
    ||
    status
    ||
    '—'
  );

}


function recipientText(row){

  return (
    row.recipient_type
    ===
    'customer'
    ?
    '客户'
    :
    '代理'
  );

}


/* =========================================================
   LOAD
========================================================= */

async function loadAll(){

  setPageMessage(
    '正在刷新...'
  );


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_list_finance_refunds',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        '{}'

      }

    );


    const data =
    await parseAdminResponse(
      res
    );


    rows =
    Array.isArray(
      data?.rows
    )
    ?
    data.rows
    :
    [];


    render();


    setPageMessage(
      '资料已更新',
      'ok'
    );

  }
  catch(err){

    console.error(
      err
    );


    setPageMessage(
      translateError(
        err.message
      ),
      'err'
    );

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const pending =
  rows.filter(

    row =>
    row.status
    ===
    'pending'
    ||
    row.status
    ===
    'partial'

  );


  const history =
  rows.filter(

    row =>
    row.status
    ===
    'refunded'
    ||
    row.status
    ===
    'cancelled'

  );


  document
  .getElementById(
    'pendingCount'
  )
  .textContent =
  pending.length;


  document
  .getElementById(
    'refundedCount'
  )
  .textContent =
  rows.filter(

    row =>
    row.status
    ===
    'refunded'

  )
  .length;


  document
  .getElementById(
    'cancelledCount'
  )
  .textContent =
  rows.filter(

    row =>
    row.status
    ===
    'cancelled'

  )
  .length;


  document
  .getElementById(
    'pendingList'
  )
  .innerHTML =
  pending.length
  ?
  pending
  .map(
    refundHtml
  )
  .join('')
  :
  `
    <div class="empty">
      当前没有待人工核对退款
    </div>
  `;


  document
  .getElementById(
    'historyList'
  )
  .innerHTML =
  history.length
  ?
  history
  .map(
    refundHtml
  )
  .join('')
  :
  `
    <div class="empty">
      暂无处理记录
    </div>
  `;

}


function refundHtml(row){

  const isOpen =
  row.status
  ===
  'pending'
  ||
  row.status
  ===
  'partial';


  return `

    <div class="refund">

      <div class="head">

        <div>

          <div class="name">
            ${esc(row.recipient_name || '未知对象')}
          </div>

          <div class="meta">

            ${esc(recipientText(row))}

            ${
              row.customer_code
              ?
              ' · '
              +
              esc(row.customer_code)
              :
              ''
            }

            ${
              row.customer_username
              ?
              ' · @'
              +
              esc(row.customer_username)
              :
              ''
            }

            ${
              row.customer_phone
              ?
              ' · '
              +
              esc(row.customer_phone)
              :
              ''
            }

          </div>

        </div>


        <div
          class="badge ${esc(row.status)}">

          ${esc(statusText(row.status))}

        </div>

      </div>


      <div class="row">
        <span>对应期数</span>
        <strong>${esc(roundName(row))}</strong>
      </div>


            <div class="row">
        <span>客户 / 代理申报金额</span>
        <strong class="amount">${money(row.amount)}</strong>
      </div>

      <div class="row">
        <span>实际到账状态</span>
        <strong>待人工核实</strong>
      </div>

      <div class="row">
        <span>付款方式</span>
        <strong>${esc(row.method_name || row.method_type || '—')}</strong>
      </div>


      ${
        row.platform_bank_name
        ?
        `
          <div class="row">
            <span>银行 / 钱包</span>
            <strong>${esc(row.platform_bank_name)}</strong>
          </div>
        `
        :
        ''
      }


      <div class="row">
        <span>平台收款户名</span>
        <strong>${esc(row.platform_account_name || '—')}</strong>
      </div>


      <div class="row">
        <span>平台收款账号</span>
        <strong>${esc(row.platform_account_number || '—')}</strong>
      </div>


      <div class="row">
        <span>创建时间</span>
        <strong>
          ${esc(
            new Date(
              row.created_at
            )
            .toLocaleString(
              'zh-CN'
            )
          )}
        </strong>
      </div>


      ${
        row.completed_at
        ?
        `
          <div class="row">
            <span>处理时间</span>
            <strong>
              ${esc(
                new Date(
                  row.completed_at
                )
                .toLocaleString(
                  'zh-CN'
                )
              )}
            </strong>
          </div>
        `
        :
        ''
      }


      <div class="reason">

        原因：开奖前付款仍未完成管理员确认。
        请先核对现实中的收款账户是否真正到账，
        再决定退款或无需退款。

      </div>


      ${
        isOpen
        ?
        `

          <div class="actions">

            <button
              type="button"
              onclick="resolveRefund(
                '${esc(row.id)}',
                'refunded'
              )">

              已完成实际退款

            </button>


            <button
              class="secondary"
              type="button"
              onclick="resolveRefund(
                '${esc(row.id)}',
                'cancelled'
              )">

              确认无需退款

            </button>

          </div>

        `
        :
        ''
      }

    </div>

  `;

}


/* =========================================================
   RESOLVE
========================================================= */

async function resolveRefund(
  refundId,
  action
){

  const message =
  action
  ===
  'refunded'
  ?
  '只有你已经在现实中完成 KPay / 银行退款后才能确认。确定已经实际退款吗？'
  :
  '请先核对平台收款账户。只有确认这笔钱现实中没有到账时，才选择无需退款。确定吗？';


  const confirmed =
  window.confirm(
    message
  );


  if(!confirmed){

    return;

  }


  setPageMessage(
    '正在处理...'
  );


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_resolve_finance_refund',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_refund_id:
          refundId,

          p_action:
          action

        })

      }

    );


    await parseAdminResponse(
      res
    );


    await loadAll();


    setPageMessage(

      action
      ===
      'refunded'
      ?
      '已记录为实际退款完成。'
      :
      '已记录为确认无需退款。',

      'ok'

    );

  }
  catch(err){

    console.error(
      err
    );


    setPageMessage(
      translateError(
        err.message
      ),
      'err'
    );

  }

}


/* =========================================================
   RESPONSE
========================================================= */

async function parseAdminResponse(res){

  const text =
  await res.text();


  let data =
  null;


  try{

    data =
    text
    ?
    JSON.parse(
      text
    )
    :
    null;

  }
  catch{

    data =
    text;

  }


  if(!res.ok){

    throw new Error(

      data?.message
      ||
      data?.error
      ||
      data?.hint
      ||
      text
      ||
      'REQUEST_FAILED'

    );

  }


  return data;

}


function setPageMessage(
  text,
  type=''
){

  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.textContent =
  text;


  msg.className =
  'msg'
  +
  (
    type
    ?
    ' '
    +
    type
    :
    ''
  );

}


/* =========================================================
   ERRORS
========================================================= */

function translateError(message){

  const text =
  String(
    message
    ||
    ''
  );


  if(
    text.includes(
      'ADMIN_AAL2_REQUIRED'
    )
  ){

    return '管理员二次验证已经失效，请返回管理中心重新验证。';

  }


  if(
    text.includes(
      'REFUND_NOT_FOUND'
    )
  ){

    return '没有找到这条退款记录。';

  }


  if(
    text.includes(
      'REFUND_ALREADY_RESOLVED'
    )
  ){

    return '这条退款记录已经处理，请刷新页面。';

  }


  if(
    text.includes(
      'INVALID_REFUND_ACTION'
    )
  ){

    return '退款处理方式不正确。';

  }


  return (
    text
    ||
    '操作失败，请重新尝试。'
  );

}

   START
========================================================= */

(async function start(){

  const isAdmin =
  await verifyAdmin();


  if(!isAdmin){

    document
    .getElementById(
      'authError'
    )
    .classList
    .remove(
      'hidden'
    );


    return;

  }


  document
  .getElementById(
    'mainBox'
  )
  .classList
  .remove(
    'hidden'
  );


  await loadAll();

})();

</script>
