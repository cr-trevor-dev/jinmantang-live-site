body{

.brand{

.mark{

.card{

.summaryBox small{
  display:block;

.summaryBox strong{

.notice{

  font-size:12px;

}

.refund{

  background:#0e0e0f;

.head{

  justify-content:space-between;

.meta{

.badge.pending,

.badge.refunded{
  background:#153124;
  color:#79d6a2;
}

.badge.cancelled{
  background:#311919;
  color:#dda09a;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:8px 0;
  border-bottom:
  1px solid

  font-size:12px;
}

.row:last-child{

}

.row span{

.row strong{

  margin-top:11px;

  border-radius:11px;

  color:#a99a74;
  font-size:11px;
  line-height:1.65;
}

.actions{
  display:grid;
  grid-template-columns:
  1fr 1fr;
  gap:8px;
  margin-top:13px;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  background:
  linear-gradient(
    180deg,
    #f1d784,
    #b47d20
  );
  color:#171109;
}

button.secondary{
  background:#1b1717;
  color:#d9a7a2;
  border:
  1px solid
  rgba(180,80,80,.24);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  color:#7f786b;
  padding:24px 10px;
  font-size:12px;
}

.msg{
  text-align:center;
  min-height:18px;
  margin-top:10px;
  color:#aaa18d;
  font-size:12px;

.msg.ok{

}

.msg.err{

  .summary{
    grid-template-columns:1fr;

<body>

<div class="wrap">

  <div class="brand">

    <div class="mark">
      金
    </div>

    <div class="cn">
      金满堂
    </div>

    <div class="en">
      REFUND REVIEW
    </div>

  </div>


  <a
    class="back"
    href="/admin/">
    ← 返回管理中心
  </a>


  <div
    id="authError"
    class="card hidden">

    <div class="title">
      无法进入退款核对
    </div>

    <div class="msg err">
      请先登录管理员账号并完成二次验证。
    </div>

  </div>


  <main
    id="mainBox"
    class="hidden">


    <section class="card">

      <div class="title">
        退款核对概况
      </div>


      <div class="summary">

        <div class="summaryBox">
          <small>待人工核对</small>
          <strong id="pendingCount">0</strong>
        </div>

        <div class="summaryBox">
          <small>已人工退款</small>
          <strong id="refundedCount">0</strong>
        </div>

        <div class="summaryBox">
          <small>核对后结案</small>
          <strong id="cancelledCount">0</strong>
        </div>

      </div>


      <div
        class="notice"
        style="margin-top:13px">

        这里的“待人工核对”不代表平台已经收到款，也不代表已经退款。
        只有确认现实中的 KPay / 银行款项确实到账后，
        才人工退款并点击“已完成实际退款”；
        如果核对后确认没有实际到账，则点击“确认无需退款”。

      </div>

    </section>


    <section class="card">

      <div class="title">
        待人工核对
      </div>

      <div id="pendingList">

        <div class="empty">
          正在读取...
        </div>

      </div>

    </section>


    <section class="card">

      <div class="title">
        处理记录
      </div>

      <div id="historyList">

        <div class="empty">
          正在读取...
        </div>

      </div>

    </section>


    <div
      id="pageMsg"
      class="msg">
    </div>

  </main>


  <div class="foot">
    © JIN MANTANG · ADMIN REFUND REVIEW
  </div>

</div>


<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let refreshPromise =
null;


let rows =
[];


/* =========================================================
   SESSION
========================================================= */

function saveSession(data){

  if(data?.access_token){

    token =
    data.access_token;


    localStorage.setItem(
      'jmt_access_token',
      token
    );


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

  }


  if(data?.refresh_token){

    refreshToken =
    data.refresh_token;


    localStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );


    sessionStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

  }

}


function getJwtPayload(){

  try{

    let part =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');


    while(
      part.length
      %
      4
    ){

      part += '=';

    }


    return JSON.parse(

      decodeURIComponent(

        atob(part)
        .split('')
        .map(

          c =>
          '%'
          +
          (
            '00'
            +
            c.charCodeAt(0)
            .toString(16)
          )
          .slice(-2)

        )
        .join('')

      )

    );

  }
  catch{

    return {};

  }

}


async function refreshAdminSession(){

  if(!refreshToken){

    return false;

  }


  if(refreshPromise){

    return refreshPromise;

  }


  refreshPromise =
  (
    async()=>{

      try{

        const res =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:'POST',

            headers:{

              apikey:
              KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(!res.ok){

          return false;

        }


        const data =
        await res.json();


        if(!data.access_token){

          return false;

        }


        saveSession(
          data
        );


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:
        KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let res =
  await request();


  if(
    res.status
    !==
    401
  ){

    return res;

  }


  const refreshed =
  await refreshAdminSession();


  if(!refreshed){

    return res;

  }


  return request();

}


/* =========================================================
   ADMIN VERIFY
========================================================= */

async function verifyAdmin(){

  if(!token){

    return false;

  }


  const payload =
  getJwtPayload();


  if(
    payload.aal
    !==
    'aal2'
  ){

    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){

      return false;

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(!adminRes.ok){

      return false;

    }


    const data =
    await adminRes.json();


    return (
      Array.isArray(
        data
      )
      &&
      data.length > 0
    );

  }
  catch{

    return false;

  }

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function money(value){

  return new Intl.NumberFormat(

    'en-US',

    {
      maximumFractionDigits:0
    }

  )
  .format(
    Number(
      value
      ||
      0
    )
  );

}


function roundName(row){

  if(!row.round_date){

    return '—';

  }


  let label =
  row.round_code
  ||
  '';


  if(
    row.round_code
    ===
    '1030'
  ){

    label =
    '上午 11:45';

  }


  if(
    row.round_code
    ===
    '1530'
  ){

    label =
    '下午 3:45';

  }


  return (
    row.round_date
    +
    ' · '
    +
    label
  );

}


function statusText(status){

  const map = {

    pending:
    '待人工核对',

    partial:
    '部分退款',

    refunded:
    '已完成退款',

    cancelled:
    '核对后结案'

  };


  return (
    map[status]
    ||
    status
    ||
    '—'
  );

}


function recipientText(row){

  return (
    row.recipient_type
    ===
    'customer'
    ?
    '客户'
    :
    '代理'
  );

}


/* =========================================================
   LOAD
========================================================= */

async function loadAll(){

  setPageMessage(
    '正在刷新...'
  );


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_list_finance_refunds',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        '{}'

      }

    );


    const data =
    await parseAdminResponse(
      res
    );


    rows =
    Array.isArray(
      data?.rows
    )
    ?
    data.rows
    :
    [];


    render();


    setPageMessage(
      '资料已更新',
      'ok'
    );

  }
  catch(err){

    console.error(
      err
    );


    setPageMessage(
      translateError(
        err.message
      ),
      'err'
    );

  }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const pending =
  rows.filter(

    row =>
    row.status
    ===
    'pending'
    ||
    row.status
    ===
    'partial'

  );


  const history =
  rows.filter(

    row =>
    row.status
    ===
    'refunded'
    ||
    row.status
    ===
    'cancelled'

  );


  document
  .getElementById(
    'pendingCount'
  )
  .textContent =
  pending.length;


  document
  .getElementById(
    'refundedCount'
  )
  .textContent =
  rows.filter(

    row =>
    row.status
    ===
    'refunded'

  )
  .length;


  document
  .getElementById(
    'cancelledCount'
  )
  .textContent =
  rows.filter(

    row =>
    row.status
    ===
    'cancelled'

  )
  .length;


  document
  .getElementById(
    'pendingList'
  )
  .innerHTML =
  pending.length
  ?
  pending
  .map(
    refundHtml
  )
  .join('')
  :
  `
    <div class="empty">
      当前没有待人工核对退款
    </div>
  `;


  document
  .getElementById(
    'historyList'
  )
  .innerHTML =
  history.length
  ?
  history
  .map(
    refundHtml
  )
  .join('')
  :
  `
    <div class="empty">
      暂无处理记录
    </div>
  `;

}


function refundEventsHtml(row){

  const events =
  Array.isArray(
    row.events
  )
  ?
  row.events
  :
  [];


  if(!events.length){

    return '';

  }


  return `

    <div class="reason">

      <strong>
        退款处理记录
      </strong>

      <br><br>

      ${
        events
        .map(
          event => {

            const time =
            event.created_at
            ?
            new Date(
              event.created_at
            )
            .toLocaleString(
              'zh-CN'
            )
            :
            '—';


            if(
              event.action
              ===
              'refund'
            ){

              return `

                <div
                  style="
                    padding:9px 0;
                    border-bottom:1px solid rgba(255,255,255,.06)
                  ">

                  本次退款：
                  <strong>
                    ${money(event.amount)}
                  </strong>

                  <br>

                  备注：
                  ${esc(event.note || '—')}

                  <br>

                  时间：
                  ${esc(time)}

                  ${
                    event.proof_storage_path
                    ?
                    `

                      <div
                        style="margin-top:8px">

                        <button
                          class="secondary"
                          type="button"
                          onclick="viewRefundProof(
                            '${esc(
                              event.proof_storage_path
                            )}'
                          )">

                          查看退款凭证

                        </button>

                      </div>

                    `
                    :
                    ''
                  }

                </div>

              `;

            }


            return `

              <div
                style="
                  padding:9px 0;
                  border-bottom:1px solid rgba(255,255,255,.06)
                ">

                结案处理

                <br>

                备注：
                ${esc(event.note || '—')}

                <br>

                时间：
                ${esc(time)}

              </div>

            `;

          }
        )
        .join('')
      }

    </div>

  `;

}


function refundHtml(row){

  const isOpen =
  row.status
  ===
  'pending'
  ||
  row.status
  ===
  'partial';


  const total =
  Number(
    row.amount
    ||
    0
  );


  const refunded =
  Number(
    row.refunded_amount
    ||
    0
  );


  const remaining =
  Math.max(
    0,
    total-refunded
  );


  let resultText =
  '待人工核实实际到账';


  if(
    row.status
    ===
    'partial'
  ){

    resultText =
    '已部分退款，剩余待处理';

  }


  if(
    row.status
    ===
    'refunded'
  ){

    resultText =
    '已确认到账并完成全部退款';

  }


  if(
    row.status
    ===
    'cancelled'
  ){

    resultText =
    refunded > 0
    ?
    '已部分退款，剩余核对后结案'
    :
    '核对后确认未实际到账';

  }


  return `

    <div class="refund">

      <div class="head">

        <div>

          <div class="name">
            ${esc(row.recipient_name || '未知对象')}
          </div>

          <div class="meta">

            ${esc(recipientText(row))}

            ${
              row.customer_code
              ?
              ' · '
              +
              esc(row.customer_code)
              :
              ''
            }

            ${
              row.customer_username
              ?
              ' · @'
              +
              esc(row.customer_username)
              :
              ''
            }

            ${
              row.customer_phone
              ?
              ' · '
              +
              esc(row.customer_phone)
              :
              ''
            }

          </div>

        </div>


        <div
          class="badge ${esc(row.status)}">

          ${esc(statusText(row.status))}

        </div>

      </div>


      <div class="row">

        <span>
          对应期数
        </span>

        <strong>
          ${esc(roundName(row))}
        </strong>

      </div>


      <div class="row">

        <span>
          客户 / 代理申报金额
        </span>

        <strong class="amount">
          ${money(total)}
        </strong>

      </div>


      <div class="row">

        <span>
          已实际退款
        </span>

        <strong>
          ${money(refunded)}
        </strong>

      </div>


      <div class="row">

        <span>
          剩余待处理
        </span>

        <strong>
          ${money(remaining)}
        </strong>

      </div>


      <div class="row">

        <span>
          资金处理结果
        </span>

        <strong>
          ${esc(resultText)}
        </strong>

      </div>


      <div class="row">

        <span>
          付款方式
        </span>

        <strong>
          ${esc(
            row.method_name
            ||
            row.method_type
            ||
            '—'
          )}
        </strong>

      </div>


      ${
        row.platform_bank_name
        ?
        `

          <div class="row">

            <span>
              银行 / 钱包
            </span>

            <strong>
              ${esc(row.platform_bank_name)}
            </strong>

          </div>

        `
        :
        ''
      }


      <div class="row">

        <span>
          平台收款户名
        </span>

        <strong>
          ${esc(
            row.platform_account_name
            ||
            '—'
          )}
        </strong>

      </div>


      <div class="row">

        <span>
          平台收款账号
        </span>

        <strong>
          ${esc(
            row.platform_account_number
            ||
            '—'
          )}
        </strong>

      </div>


      <div class="row">

        <span>
          创建时间
        </span>

        <strong>

          ${esc(
            new Date(
              row.created_at
            )
            .toLocaleString(
              'zh-CN'
            )
          )}

        </strong>

      </div>


      ${
        row.completed_at
        ?
        `

          <div class="row">

            <span>
              处理时间
            </span>

            <strong>

              ${esc(
                new Date(
                  row.completed_at
                )
                .toLocaleString(
                  'zh-CN'
                )
              )}

            </strong>

          </div>

        `
        :
        ''
      }


      <div class="reason">

        原因：开奖前付款仍未完成管理员确认。

        <br>

        请先核对现实中的收款账户是否真正到账。

        <br>

        实际退多少就记录多少，
        系统会自动计算剩余金额。

      </div>


      ${refundEventsHtml(row)}


      ${
        isOpen
        ?
        `

          <div class="actions">

            <button
              type="button"
              onclick="recordRefund(
                '${esc(row.id)}'
              )">

            <button
              class="secondary"
              type="button"
              onclick="closeRefund(
                '${esc(row.id)}'

              ${
                refunded > 0
                ?
                '确认剩余无需退款'
                :
                '确认无需退款'
              }

            </button>

          </div>

        `
        :
        ''
      }

    </div>

  `;

}


/* =========================================================
   REFUND PROOF
========================================================= */

function pickRefundProof(){

  return new Promise(
    resolve => {

      const input =
      document.createElement(
        'input'
      );


      input.type =
      'file';


      input.accept =
      'image/jpeg,image/png,image/webp,image/heic,image/heif';


      input.onchange =
      ()=>{

        resolve(
          input.files?.[0]
          ||
          null
        );

      };


      input.click();

    }
  );

}


async function uploadRefundProof(
  refundId,
  file
){

  if(!file){

    return null;

  }


  const allowed =
  [
    'image/jpeg',
    'image/png',
    'image/webp',
    'image/heic',
    'image/heif'
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      'REFUND_PROOF_TYPE_INVALID'
    );

  }


  if(
    file.size
    >
    10*1024*1024
  ){

    throw new Error(
      'REFUND_PROOF_TOO_LARGE'
    );

  }


  const safeName =
  String(
    file.name
    ||
    'refund-proof'
  )
  .replace(
    /[^a-zA-Z0-9._-]/g,
    '_'
  );


  const uniqueId =
  (
    crypto.randomUUID
    ?
    crypto.randomUUID()
    :
    String(
      Date.now()
    )
  );


  const storagePath =
  refundId
  +
  '/'
  +
  uniqueId
  +
  '-'
  +
  safeName;


  const encoded =
  storagePath
  .split('/')
  .map(
    encodeURIComponent
  )
  .join('/');


  const res =
  await api(

    '/storage/v1/object/finance-refund-proofs/'
    +
    encoded,

    {

      method:'POST',

      headers:{

        'Content-Type':
        file.type,

        'x-upsert':
        'false'

      },

      body:
      file

    }

  );


  if(!res.ok){

    throw new Error(
      'REFUND_PROOF_UPLOAD_FAILED'
    );

  }


  return {

    storage_path:
    storagePath,

    original_name:
    file.name,

    mime_type:
    file.type,

    file_size:
    file.size

  };

}


async function deleteRefundProof(
  storagePath
){

  if(!storagePath){

    return;

  }


  try{

    const encoded =
    storagePath
    .split('/')
    .map(
      encodeURIComponent
    )
    .join('/');


    await api(

      '/storage/v1/object/finance-refund-proofs/'
      +
      encoded,

      {
        method:'DELETE'
      }

    );

  }
  catch{

  }

}


async function viewRefundProof(
  storagePath
){

  const newWindow =
  window.open(
    '',
    '_blank'
  );


  try{

    const encoded =
    storagePath
    .split('/')
    .map(
      encodeURIComponent
    )
    .join('/');


    const res =
    await api(

      '/storage/v1/object/authenticated/finance-refund-proofs/'
      +
      encoded

    );


    if(!res.ok){

      throw new Error();

    }


    const blob =
    await res.blob();


    const url =
    URL.createObjectURL(
      blob
    );


    if(newWindow){

      newWindow.location =
      url;

    }
    else{

      location.href =
      url;

    }


    setTimeout(
      ()=>{

        URL.revokeObjectURL(
          url
        );

      },
      60000
    );

  }
  catch{

    if(newWindow){

      newWindow.close();

    }


    setPageMessage(
      '退款凭证读取失败。',
      'err'
    );

  }

}


/* =========================================================
   RECORD REFUND
========================================================= */

async function recordRefund(
  refundId
){

  const row =
  rows.find(
    item =>
    item.id
    ===
    refundId
  );


  if(!row){

    setPageMessage(
      '没有找到这条退款记录。',
      'err'
    );

    return;

  }


  const remaining =
  Math.max(
    0,
    Number(
      row.amount
      ||
      0
    )
    -
    Number(
      row.refunded_amount
      ||
      0
    )
  );


  if(
    remaining
    <=
    0
  ){

    setPageMessage(
      '这条退款已经没有剩余金额。',
      'err'
    );

    return;

  }


  let inputAmount =
  window.prompt(

    '请输入这一次现实中已经实际退回的金额：',

    String(
      remaining
    )

  );


  if(
    inputAmount
    ===
    null
  ){

    return;

  }


  inputAmount =
  inputAmount
  .replace(
    /,/g,
    ''
  )
  .trim();


  const amount =
  Number(
    inputAmount
  );


  if(
    !Number.isFinite(
      amount
    )
    ||
    amount <= 0
    ||
    amount > remaining
  ){

    setPageMessage(
      '退款金额不正确，不能超过剩余待处理金额。',
      'err'
    );

    return;

  }


  let note =
  window.prompt(

    '请输入退款备注，例如：KPay 已退回 / 银行转账退款 / 交易编号：',

    '已核对实际到账并完成退款'

  );


  if(
    note
    ===
    null
  ){

    return;

  }


  note =
  note.trim();


  if(!note){

    setPageMessage(
      '必须填写退款备注。',
      'err'
    );

    return;

  }


  const confirmed =
  window.confirm(

    '请再次确认：现实中已经实际退款 '
    +
    money(amount)
    +
    '。\n\n确认后才可以写入系统。'

  );


  if(!confirmed){

    return;

  }


  let proofInfo =
  null;


  const wantProof =
  window.confirm(

    '是否上传这次退款凭证截图？\n\n'
    +
    '建议有截图时选择“确定”；'
    +
    '没有截图可以选择“取消”继续。'

  );


  setPageMessage(
    '正在记录退款...'
  );


  try{

    if(wantProof){

      const file =
      await pickRefundProof();


      if(file){

        proofInfo =
        await uploadRefundProof(
          refundId,
          file
        );

      }

    }


    const res =
    await api(

      '/rest/v1/rpc/admin_record_finance_refund',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_refund_id:
          refundId,

          p_amount:
          amount,

          p_note:
          note,

          p_proof_storage_path:
          proofInfo?.storage_path
          ||
          null,

          p_proof_original_name:
          proofInfo?.original_name
          ||
          null,

          p_proof_mime_type:
          proofInfo?.mime_type
          ||
          null,

          p_proof_file_size:
          proofInfo?.file_size
          ||
          null

        })

      }

    );


    await parseAdminResponse(
      res
    );


    await loadAll();


    setPageMessage(
      '退款记录已经保存。',
      'ok'
    );

  }
  catch(err){

    if(
      proofInfo?.storage_path
    ){

      await deleteRefundProof(
        proofInfo.storage_path
      );

    }


    console.error(
      err
    );


    const text =
    String(
      err.message
      ||
      ''
    );


    if(
      text.includes(
        'REFUND_AMOUNT_EXCEEDS_REMAINING'
      )
    ){

      setPageMessage(
        '退款金额超过剩余待处理金额，请刷新后重新操作。',
        'err'
      );

      return;

    }


    if(
      text.includes(
        'REFUND_NOTE_REQUIRED'
      )
    ){

      setPageMessage(
        '必须填写退款备注。',
        'err'
      );

      return;

    }


    if(
      text.includes(
        'REFUND_PROOF_TOO_LARGE'
      )
    ){

      setPageMessage(
        '退款凭证不能超过 10MB。',
        'err'
      );

      return;

    }


    if(
      text.includes(
        'REFUND_PROOF_TYPE_INVALID'
      )
    ){

      setPageMessage(
        '退款凭证只支持图片。',
        'err'
      );

      return;

    }


    setPageMessage(
      translateError(
        err.message
      ),
      'err'
    );

  }

}


/* =========================================================
   CLOSE REFUND
========================================================= */

async function closeRefund(
  refundId
){

  const row =
  rows.find(
    item =>
    item.id
    ===
    refundId
  );


  if(!row){

    setPageMessage(
      '没有找到这条退款记录。',
      'err'
    );

    return;

  }


  const alreadyRefunded =
  Number(
    row.refunded_amount
    ||
    0
  );


  let note =
  window.prompt(

    alreadyRefunded > 0
    ?
    '请填写为什么剩余金额无需继续退款：'
    :
    '请填写为什么确认无需退款：',

    alreadyRefunded > 0
    ?
    '已核对实际到账金额，剩余部分未实际到账'
    :
    '已核对平台收款账户，确认没有实际到账'

  );


  if(
    note
    ===
    null
  ){

    return;

  }


  note =
  note.trim();


  if(!note){

    setPageMessage(
      '必须填写结案备注。',
      'err'
    );

    return;

  }


  const message =
  alreadyRefunded > 0
  ?
  '当前已经实际退款 '
  +
  money(
    alreadyRefunded
  )
  +
  '。\n\n'
  +
  '请确认剩余金额现实中无需继续退款。'
  :
  '请确认已经核对平台收款账户，现实中没有收到这笔款项。';


  if(
    !window.confirm(
      message
    )
  ){

    return;

  }


  setPageMessage(
    '正在结案...'
  );


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_close_finance_refund',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_refund_id:
          refundId,

          p_note:
          note

        })

      }

    );


    await parseAdminResponse(
      res
    );


    await loadAll();


    setPageMessage(
      '这条退款核对已经结案。',
      'ok'
    );

  }
  catch(err){

    console.error(
      err
    );


    setPageMessage(
      translateError(
        err.message
      ),
      'err'
    );

  }

}


/* =========================================================
   RESPONSE
========================================================= */

async function parseAdminResponse(res){

  const text =
  await res.text();


  let data =
  null;


  try{

    data =
    text
    ?
    JSON.parse(
      text
    )
    :
    null;

  }
  catch{

    data =
    text;

  }


  if(!res.ok){

    throw new Error(

      data?.message
      ||
      data?.error
      ||
      data?.hint
      ||
      text
      ||
      'REQUEST_FAILED'

    );

  }


  return data;

}


function setPageMessage(
  text,
  type=''
){

  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.textContent =
  text;


  msg.className =
  'msg'
  +
  (
    type
    ?
    ' '
    +
    type
    :
    ''
  );

}


/* =========================================================
   ERRORS
========================================================= */

function translateError(message){

  const text =
  String(
    message
    ||
    ''
  );


  if(
    text.includes(
      'ADMIN_AAL2_REQUIRED'
    )
  ){

    return '管理员二次验证已经失效，请返回管理中心重新验证。';

  }


  if(
    text.includes(
      'REFUND_NOT_FOUND'
    )
  ){

    return '没有找到这条退款记录。';

  }


  if(
    text.includes(
      'REFUND_ALREADY_RESOLVED'
    )
  ){

    return '这条退款记录已经处理，请刷新页面。';

  }


  if(
    text.includes(
      'INVALID_REFUND_ACTION'
    )
  ){

    return '退款处理方式不正确。';

  }


  return (
    text
    ||
    '操作失败，请重新尝试。'
  );

}
