<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">

<title>金满堂 · 管理中心</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:
  radial-gradient(
    circle at top,
    #251907 0,
    #0d0c0a 38%,
    #070708 100%
  );
  color:#f7f0df;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Tahoma,
  Arial,
  sans-serif;
}

.wrap{
  max-width:560px;
  margin:auto;
  min-height:100vh;
  padding:24px 15px 55px;
}


/* ===== LOGO ===== */

.brand{
  text-align:center;
  margin-bottom:22px;
}

.mark{
  width:72px;
  height:72px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  overflow:hidden;

  font-size:24px;
  font-weight:900;

  color:#f6da86;

  border:1px solid #b98a2c;

  background:
  linear-gradient(
    145deg,
    #382506,
    #100d08
  );

  box-shadow:
  0 0 28px rgba(235,185,62,.22);
}

.mark img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.cn{
  font-weight:900;
  font-size:25px;
  letter-spacing:4px;
  color:#f3d889;
}

.en{
  font-size:10px;
  letter-spacing:3px;
  color:#9f916d;
  margin-top:5px;
}


/* ===== CARD ===== */

.card{
  background:
  linear-gradient(
    180deg,
    rgba(22,22,22,.98),
    rgba(11,11,12,.98)
  );

  border:
  1px solid rgba(214,168,63,.30);

  border-radius:24px;

  padding:21px;

  margin-bottom:16px;

  box-shadow:
  0 22px 60px rgba(0,0,0,.38);
}

.title{
  font-size:15px;
  font-weight:900;
  color:#dfc575;
  margin-bottom:16px;
  letter-spacing:.8px;
}


/* ===== INPUT ===== */

input,
textarea{
  width:100%;

  border:
  1px solid rgba(214,168,63,.24);

  background:#101011;

  color:#fff;

  border-radius:13px;

  padding:14px;

  font-size:15px;

  outline:none;

  margin-bottom:12px;
}

textarea{
  resize:vertical;
  min-height:105px;
  line-height:1.6;
}

input:focus,
textarea:focus{
  border-color:#d8ad4e;

  box-shadow:
  0 0 0 2px rgba(216,173,78,.08);
}

input[type="file"]{
  padding:12px;
  color:#c9bea2;
}


/* ===== BUTTON ===== */

button{
  width:100%;

  border:0;

  border-radius:13px;

  padding:14px;

  font-size:15px;

  font-weight:900;

  cursor:pointer;

  background:
  linear-gradient(
    180deg,
    #f1d784,
    #b47d20
  );

  color:#171109;
}

button.secondary{
  margin-top:10px;

  background:#171718;

  color:#d9c37c;

  border:
  1px solid rgba(214,168,63,.22);
}

button.danger{
  margin-top:9px;

  background:#1b1717;

  color:#cfa7a7;

  border:
  1px solid rgba(180,100,100,.20);
}


/* ===== LOGIN ===== */

.hidden{
  display:none !important;
}

.msg{
  text-align:center;
  min-height:20px;
  margin-top:12px;
  color:#aaa18d;
  font-size:12px;
}

.success{
  color:#79d4a0;
}

.error{
  color:#df9393;
}


/* ===== DASHBOARD ===== */

.menuGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.menu{
  display:block;

  text-decoration:none;

  background:#101011;

  border:
  1px solid rgba(214,168,63,.20);

  border-radius:15px;

  padding:17px 14px;

  min-height:105px;

  transition:.2s;
}

.menu:active{
  transform:scale(.98);
}

.menuIcon{
  font-size:25px;
  margin-bottom:9px;
}

.menuTitle{
  color:#ecd176;
  font-weight:900;
  font-size:14px;
}

.menuSub{
  color:#777166;
  font-size:10px;
  line-height:1.5;
  margin-top:5px;
}


/* ===== RESULT ===== */

.current{
  text-align:center;

  padding:17px;

  margin-bottom:16px;

  background:#101011;

  border:
  1px solid rgba(255,255,255,.06);

  border-radius:15px;
}

.current small{
  display:block;
  color:#8d887c;
  margin-bottom:5px;
}

.current strong{
  font-size:48px;
  color:#ebca68;
}


/* ===== SETTINGS ===== */

.settingLabel{
  display:block;
  color:#9c9588;
  font-size:12px;
  margin:4px 2px 7px;
}

.note{
  color:#777268;
  font-size:11px;
  line-height:1.55;
  margin:-3px 2px 12px;
}


/* ===== LOGO PREVIEW ===== */

.logoPreviewWrap{
  display:flex;
  align-items:center;
  gap:15px;

  background:#101011;

  border:
  1px solid rgba(255,255,255,.06);

  border-radius:15px;

  padding:14px;

  margin-bottom:12px;
}

.logoPreview{
  width:82px;
  height:82px;

  border-radius:50%;

  overflow:hidden;

  flex:none;

  border:
  1px solid rgba(214,168,63,.35);

  background:#17130c;

  display:grid;
  place-items:center;

  color:#d7ba63;
  font-weight:900;
}

.logoPreview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logoInfo{
  color:#928b7e;
  font-size:12px;
  line-height:1.6;
}


/* ===== SWITCH ===== */

.switchRow{
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#101011;

  border:
  1px solid rgba(255,255,255,.06);

  border-radius:13px;

  padding:13px 14px;

  margin-bottom:13px;
}

.switchText{
  font-size:13px;
  color:#e7ddc6;
}

.switch{
  position:relative;
  width:48px;
  height:27px;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
  margin:0;
}

.slider{
  position:absolute;
  inset:0;

  background:#343436;

  border-radius:99px;

  transition:.25s;
}

.slider:before{
  content:"";

  position:absolute;

  width:21px;
  height:21px;

  left:3px;
  top:3px;

  border-radius:50%;

  background:#aaa;

  transition:.25s;
}

.switch input:checked + .slider{
  background:#b9872f;
}

.switch input:checked + .slider:before{
  transform:translateX(21px);
  background:#fff0bd;
}


/* ===== FOOTER ===== */

.foot{
  text-align:center;
  color:#706b62;
  font-size:10px;
  margin-top:25px;
}

@media(max-width:380px){

  .menuGrid{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>

<div class="wrap">


  <!-- ===== LOGO ===== -->

  <div class="brand">

    <div
      class="mark"
      id="topMark"
    >
      金
    </div>

    <div class="cn">
      金满堂
    </div>

    <div class="en">
      JIN MANTANG · MANAGEMENT
    </div>

  </div>



  <!-- ===== LOGIN ===== -->

  <div
    class="card"
    id="loginBox"
  >

    <div class="title">
      管理员登录
    </div>

    <input
      id="email"
      type="email"
      placeholder="管理员邮箱"
    >

    <input
      id="password"
      type="password"
      placeholder="管理员密码"
    >

    <button onclick="signIn()">
      登录管理中心
    </button>

    <div
      class="msg"
      id="loginMsg"
    ></div>

  </div>



  <!-- ===== ADMIN ===== -->

  <div
    id="adminBox"
    class="hidden"
  >


    <!-- ===== 总后台入口 ===== -->

    <div class="card">

      <div class="title">
        管理中心
      </div>

      <div class="menuGrid">


        <a
          class="menu"
          href="/admin/agents/"
        >

          <div class="menuIcon">
            👥
          </div>

          <div class="menuTitle">
            代理管理
          </div>

          <div class="menuSub">
            创建代理、搜索、比例、暂停、限制
          </div>

        </a>


        <a
          class="menu"
          href="/admin/simulator.html"
        >

          <div class="menuIcon">
            📊
          </div>

          <div class="menuTitle">
            期数模拟
          </div>

          <div class="menuSub">
            00–99积分与结算模拟
          </div>

        </a>


        <a
          class="menu"
          href="#resultManagement"
        >

          <div class="menuIcon">
            🎯
          </div>

          <div class="menuTitle">
            数字发布
          </div>

          <div class="menuSub">
            发布最新结果
          </div>

        </a>


        <a
          class="menu"
          href="#siteSettings"
        >

          <div class="menuIcon">
            ⚙️
          </div>

          <div class="menuTitle">
            网站设置
          </div>

          <div class="menuSub">
            Logo、Telegram、公告
          </div>

        </a>


      </div>

    </div>



    <!-- ===== 数字发布 ===== -->

    <div
      class="card"
      id="resultManagement"
    >

      <div class="title">
        数字发布管理
      </div>

      <div class="current">

        <small>
          当前最新数字
        </small>

        <strong id="currentResult">
          --
        </strong>

      </div>


      <input
        id="resultInput"
        inputmode="numeric"
        maxlength="2"
        placeholder="输入 00 - 99"
      >


      <button onclick="publishResult()">
        发布最新数字
      </button>


      <div
        class="msg"
        id="publishMsg"
      ></div>

    </div>



    <!-- ===== LOGO ===== -->

    <div class="card">

      <div class="title">
        网站 Logo 管理
      </div>


      <div class="logoPreviewWrap">


        <div
          class="logoPreview"
          id="logoPreview"
        >
          金
        </div>


        <div class="logoInfo">

          选择你的 Logo 图片。

          <br>

          系统会自动压缩并保存。

        </div>

      </div>


      <label class="settingLabel">
        选择 Logo 图片
      </label>


      <input
        id="logoFile"
        type="file"
        accept="image/*"
        onchange="handleLogoFile(this)"
      >


      <div class="note">
        建议使用正方形图片。
      </div>


      <button onclick="saveLogo()">
        更新网站 Logo
      </button>


      <button
        class="danger"
        onclick="removeLogo()"
      >
        恢复文字「金」
      </button>


      <div
        class="msg"
        id="logoMsg"
      ></div>

    </div>



    <!-- ===== 网站设置 ===== -->

    <div
      class="card"
      id="siteSettings"
    >

      <div class="title">
        网站内容管理
      </div>


      <label class="settingLabel">
        Telegram 频道链接
      </label>


      <input
        id="telegramUrl"
        type="url"
        placeholder="例如：https://t.me/yourchannel"
      >


      <div class="note">
        留空后客户页面不会显示 Telegram 入口。
      </div>



      <label class="settingLabel">
        网站公告
      </label>


      <textarea
        id="announcementText"
        placeholder="输入网站公告"
      ></textarea>



      <div class="switchRow">


        <div class="switchText">
          显示滚动公告
        </div>


        <label class="switch">

          <input
            id="announcementEnabled"
            type="checkbox"
          >

          <span class="slider"></span>

        </label>


      </div>


      <button onclick="saveSettings()">
        更新网站设置
      </button>


      <div
        class="msg"
        id="settingsMsg"
      ></div>

    </div>



    <!-- ===== LOGOUT ===== -->

    <div class="card">

      <button
        class="secondary"
        onclick="logout()"
      >
        退出管理员账号
      </button>

    </div>


  </div>



  <div class="foot">

    © 2022 JIN MANTANG · ADMIN SYSTEM

  </div>


</div>



<script>


const BASE =
'https://veserwfjxglxieehfggy.supabase.co';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';



/* =============================
   登录状态
============================= */


let token =

localStorage.getItem(
  'jmt_access_token'
)

||

sessionStorage.getItem(
  'jmt_access_token'
)

||

'';



let pendingLogo = '';



/* =============================
   登录
============================= */


async function signIn(){

  const email =
  document.getElementById(
    'email'
  ).value.trim();


  const password =
  document.getElementById(
    'password'
  ).value;


  const msg =
  document.getElementById(
    'loginMsg'
  );


  if(!email || !password){

    msg.textContent =
    '请输入管理员邮箱和密码';

    return;

  }


  msg.textContent =
  '正在登录...';


  try{


    const r =
    await fetch(

      BASE +
      '/auth/v1/token?grant_type=password',

      {

        method:'POST',

        headers:{

          apikey:KEY,

          'Content-Type':
          'application/json'

        },

        body:JSON.stringify({

          email,
          password

        })

      }

    );


    const d =
    await r.json();


    if(
      !r.ok
      ||
      !d.access_token
    ){

      throw new Error();

    }


    token =
    d.access_token;



    /* 持久登录 */

    localStorage.setItem(
      'jmt_access_token',
      token
    );


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );


    showAdmin();


    await loadCurrent();

    await loadSettings();


  }catch(e){


    msg.textContent =
    '登录失败，请检查邮箱和密码';


  }

}



/* =============================
   验证现有登录
============================= */


async function verifySession(){


  if(!token){

    return;

  }


  try{


    const r =
    await fetch(

      BASE +
      '/auth/v1/user',

      {

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer ' + token

        }

      }

    );


    if(!r.ok){

      throw new Error();

    }


    showAdmin();


    await loadCurrent();

    await loadSettings();


  }catch(e){


    clearSession();


  }

}



/* =============================
   显示后台
============================= */


function showAdmin(){


  document.getElementById(
    'loginBox'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'adminBox'
  ).classList.remove(
    'hidden'
  );


}



/* =============================
   当前号码
============================= */


async function loadCurrent(){


  try{


    const r =
    await fetch(

      BASE +
      '/rest/v1/results?select=result_number,published_at&order=published_at.desc&limit=1',

      {

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer ' + KEY

        }

      }

    );


    if(!r.ok){

      throw new Error();

    }


    const rows =
    await r.json();


    document.getElementById(
      'currentResult'
    ).textContent =

    rows.length

    ? rows[0].result_number

    : '--';


  }catch(e){


    document.getElementById(
      'currentResult'
    ).textContent =
    '--';


  }

}



/* =============================
   发布号码
============================= */


async function publishResult(){


  const input =
  document.getElementById(
    'resultInput'
  );


  const msg =
  document.getElementById(
    'publishMsg'
  );


  let n =
  input.value.trim();


  if(
    !/^\d{1,2}$/.test(n)
  ){


    msg.textContent =
    '请输入 00 到 99';


    return;

  }


  n =
  n.padStart(
    2,
    '0'
  );


  msg.textContent =
  '正在发布...';


  try{


    const r =
    await fetch(

      BASE +
      '/rest/v1/results',

      {

        method:'POST',

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer ' + token,

          'Content-Type':
          'application/json',

          Prefer:
          'return=representation'

        },


        body:JSON.stringify({

          result_number:n

        })

      }

    );


    if(
      r.status===401
      ||
      r.status===403
    ){


      clearSession();

      throw new Error();

    }


    if(!r.ok){

      throw new Error();

    }


    document.getElementById(
      'currentResult'
    ).textContent =
    n;


    input.value =
    '';


    msg.textContent =
    '✓ 发布成功：' + n;


  }catch(e){


    msg.textContent =
    '发布失败，请重新登录';


  }

}



/* =============================
   读取设置
============================= */


async function loadSettings(){


  try{


    const r =
    await fetch(

      BASE +
      '/rest/v1/site_settings?id=eq.1&select=telegram_url,announcement_text,announcement_enabled,logo_data_url',

      {

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer ' + KEY

        }

      }

    );


    if(!r.ok){

      throw new Error();

    }


    const rows =
    await r.json();


    if(!rows.length){

      return;

    }


    const s =
    rows[0];



    document.getElementById(
      'telegramUrl'
    ).value =
    s.telegram_url || '';



    document.getElementById(
      'announcementText'
    ).value =
    s.announcement_text || '';



    document.getElementById(
      'announcementEnabled'
    ).checked =
    !!s.announcement_enabled;



    if(s.logo_data_url){


      pendingLogo =
      s.logo_data_url;


      showLogoPreview(
        s.logo_data_url
      );


    }


  }catch(e){


    document.getElementById(
      'settingsMsg'
    ).textContent =
    '暂时无法读取网站设置';


  }

}



/* =============================
   Logo 选择
============================= */


function handleLogoFile(input){


  const file =
  input.files
  &&
  input.files[0];


  const msg =
  document.getElementById(
    'logoMsg'
  );


  if(!file){

    return;

  }


  if(
    !file.type.startsWith(
      'image/'
    )
  ){


    msg.textContent =
    '请选择图片文件';


    return;

  }


  msg.textContent =
  '正在处理 Logo...';



  const reader =
  new FileReader();



  reader.onload =
  function(e){


    const img =
    new Image();



    img.onload =
    function(){


      const maxSize =
      420;


      let w =
      img.width;


      let h =
      img.height;



      if(w > h){


        if(w > maxSize){


          h =
          Math.round(
            h * maxSize / w
          );


          w =
          maxSize;


        }


      }else{


        if(h > maxSize){


          w =
          Math.round(
            w * maxSize / h
          );


          h =
          maxSize;


        }


      }



      const canvas =
      document.createElement(
        'canvas'
      );


      canvas.width =
      w;


      canvas.height =
      h;



      const ctx =
      canvas.getContext(
        '2d'
      );



      ctx.drawImage(
        img,
        0,
        0,
        w,
        h
      );



      pendingLogo =
      canvas.toDataURL(
        'image/jpeg',
        .84
      );



      showLogoPreview(
        pendingLogo
      );



      msg.textContent =
      '✓ Logo 已准备好';


    };


    img.src =
    e.target.result;


  };


  reader.readAsDataURL(
    file
  );

}



/* =============================
   Logo 预览
============================= */


function showLogoPreview(src){


  const preview =
  document.getElementById(
    'logoPreview'
  );


  const top =
  document.getElementById(
    'topMark'
  );


  preview.innerHTML =
  '';


  top.innerHTML =
  '';


  const img1 =
  document.createElement(
    'img'
  );


  img1.src =
  src;


  preview.appendChild(
    img1
  );


  const img2 =
  document.createElement(
    'img'
  );


  img2.src =
  src;


  top.appendChild(
    img2
  );

}



/* =============================
   保存 Logo
============================= */


async function saveLogo(){


  const msg =
  document.getElementById(
    'logoMsg'
  );


  if(!pendingLogo){


    msg.textContent =
    '请先选择 Logo 图片';


    return;

  }


  msg.textContent =
  '正在更新 Logo...';


  try{


    const r =
    await fetch(

      BASE +
      '/rest/v1/site_settings?id=eq.1',

      {

        method:'PATCH',

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer ' + token,

          'Content-Type':
          'application/json',

          Prefer:
          'return=representation'

        },


        body:JSON.stringify({

          logo_data_url:
          pendingLogo,

          updated_at:
          new Date().toISOString()

        })

      }

    );


    if(!r.ok){

      throw new Error();

    }


    msg.textContent =
    '✓ 网站 Logo 更新成功';


  }catch(e){


    msg.textContent =
    'Logo 更新失败';


  }

}



/* =============================
   恢复文字 Logo
============================= */


async function removeLogo(){


  const msg =
  document.getElementById(
    'logoMsg'
  );


  msg.textContent =
  '正在恢复...';


  try{


    const r =
    await fetch(

      BASE +
      '/rest/v1/site_settings?id=eq.1',

      {

        method:'PATCH',

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer ' + token,

          'Content-Type':
          'application/json'

        },


        body:JSON.stringify({

          logo_data_url:'',

          updated_at:
          new Date().toISOString()

        })

      }

    );


    if(!r.ok){

      throw new Error();

    }


    pendingLogo =
    '';


    document.getElementById(
      'logoPreview'
    ).innerHTML =

    document.getElementById(
      'topMark'
    ).innerHTML =

    document.getElementById(
      'logoFile'
    ).value =

  }catch(e){

  }

}



/* =============================
   保存网站设置
============================= */


async function saveSettings(){


  const msg =
  document.getElementById(
    'settingsMsg'
  );


  const telegram =
  document.getElementById(
    'telegramUrl'
  ).value.trim();


  const announcement =
  document.getElementById(
    'announcementText'
  ).value.trim();


  const enabled =
  document.getElementById(
    'announcementEnabled'
  ).checked;



  if(telegram){


    try{


      const u =
      new URL(
        telegram
      );


      if(
        u.protocol!=='https:'
        &&
        u.protocol!=='http:'
      ){


        throw new Error();


      }


    }catch(e){


      msg.textContent =
      'Telegram 链接格式不正确';


      return;


    }


  }



  msg.textContent =
  '正在更新网站...';



  try{


    const r =
    await fetch(

      BASE +
      '/rest/v1/site_settings?id=eq.1',

      {

        method:'PATCH',

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer ' + token,

          'Content-Type':
          'application/json',

          Prefer:
          'return=representation'

        },


        body:JSON.stringify({

          telegram_url:
          telegram,

          announcement_text:
          announcement,

          announcement_enabled:
          enabled,

          updated_at:
          new Date().toISOString()

        })

      }

    );


    if(!r.ok){

      throw new Error();

    }


    msg.textContent =
    '✓ 网站设置更新成功';


  }catch(e){


    msg.textContent =
    '更新失败，请重新登录';


  }

}



/* =============================
   清除登录
============================= */


function clearSession(){


  localStorage.removeItem(
    'jmt_access_token'
  );


  sessionStorage.removeItem(
    'jmt_access_token'
  );


  token =
  '';


}



/* =============================
   退出
============================= */


function logout(){


  clearSession();


  location.reload();


}

   页面启动
============================= */


verifySession();
