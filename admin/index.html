<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">
<title>金满堂 · 管理中心</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#251907 0,#0d0c0a 38%,#070708 100%);
  color:#f7f0df;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif
}

.wrap{
  max-width:540px;
  margin:auto;
  min-height:100vh;
  padding:24px 15px 50px
}

.brand{
  text-align:center;
  margin-bottom:22px
}

.mark{
  width:62px;
  height:62px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  font-size:23px;
  font-weight:900;
  color:#f6da86;
  border:1px solid #b98a2c;
  background:linear-gradient(145deg,#382506,#100d08);
  box-shadow:0 0 25px rgba(235,185,62,.20),inset 0 0 15px rgba(255,215,110,.06)
}

.cn{
  font-weight:900;
  font-size:23px;
  letter-spacing:4px;
  color:#f3d889
}

.en{
  font-size:10px;
  letter-spacing:2.5px;
  color:#9f916d;
  margin-top:4px
}

.card{
  background:linear-gradient(180deg,rgba(22,22,22,.98),rgba(11,11,12,.98));
  border:1px solid rgba(214,168,63,.30);
  border-radius:24px;
  padding:21px;
  margin-bottom:16px;
  box-shadow:0 22px 60px rgba(0,0,0,.38)
}

.title{
  font-size:14px;
  font-weight:900;
  color:#dfc575;
  margin-bottom:16px;
  letter-spacing:.8px
}

input,textarea{
  width:100%;
  border:1px solid rgba(214,168,63,.24);
  background:#101011;
  color:#fff;
  border-radius:13px;
  padding:14px;
  font-size:15px;
  outline:none;
  margin-bottom:12px
}

textarea{
  resize:vertical;
  min-height:105px;
  line-height:1.6
}

input:focus,textarea:focus{
  border-color:#d8ad4e;
  box-shadow:0 0 0 2px rgba(216,173,78,.08)
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(180deg,#f1d784,#b47d20);
  color:#171109
}

button.secondary{
  margin-top:10px;
  background:#171718;
  color:#d9c37c;
  border:1px solid rgba(214,168,63,.22)
}

.msg{
  text-align:center;
  min-height:20px;
  margin-top:12px;
  color:#aaa18d;
  font-size:12px
}

.hidden{display:none}

.current{
  text-align:center;
  padding:17px;
  margin-bottom:16px;
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:15px
}

.current small{
  display:block;
  color:#8d887c;
  margin-bottom:5px
}

.current strong{
  font-size:48px;
  color:#ebca68
}

.settingLabel{
  display:block;
  color:#9c9588;
  font-size:12px;
  margin:4px 2px 7px
}

.switchRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
  padding:13px 14px;
  margin-bottom:13px
}

.switchText{
  font-size:13px;
  color:#e7ddc6
}

.switch{
  position:relative;
  width:48px;
  height:27px
}

.switch input{
  opacity:0;
  width:0;
  height:0;
  margin:0
}

.slider{
  position:absolute;
  inset:0;
  background:#343436;
  border-radius:99px;
  transition:.25s
}

.slider:before{
  content:"";
  position:absolute;
  width:21px;
  height:21px;
  left:3px;
  top:3px;
  border-radius:50%;
  background:#aaa;
  transition:.25s
}

.switch input:checked + .slider{
  background:#b9872f
}

.switch input:checked + .slider:before{
  transform:translateX(21px);
  background:#fff0bd
}

.note{
  color:#777268;
  font-size:11px;
  line-height:1.55;
  margin:-3px 2px 12px
}

.foot{
  text-align:center;
  color:#706b62;
  font-size:10px;
  margin-top:25px
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="mark">金</div>
    <div class="cn">金满堂</div>
    <div class="en">JIN MANTANG · MANAGEMENT</div>
  </div>


  <div class="card" id="loginBox">

    <div class="title">管理员登录</div>

    <input
      id="email"
      type="email"
      placeholder="管理员邮箱"
    >

    <input
      id="password"
      type="password"
      placeholder="管理员密码"
    >

    <button onclick="signIn()">
      登录管理中心
    </button>

    <div class="msg" id="loginMsg"></div>

  </div>


  <div id="adminBox" class="hidden">


    <div class="card">

      <div class="title">
        数字发布管理
      </div>

      <div class="current">
        <small>当前最新数字</small>
        <strong id="currentResult">--</strong>
      </div>

      <input
        id="resultInput"
        inputmode="numeric"
        maxlength="2"
        placeholder="输入 00 - 99"
      >

      <button onclick="publishResult()">
        发布最新数字
      </button>

      <div class="msg" id="publishMsg"></div>

    </div>


    <div class="card">

      <div class="title">
        网站内容管理
      </div>


      <label class="settingLabel">
        Telegram 频道链接
      </label>

      <input
        id="telegramUrl"
        type="url"
        placeholder="例如：https://t.me/yourchannel"
      >

      <div class="note">
        留空以后，客户页面不会显示 Telegram 频道入口。
      </div>


      <label class="settingLabel">
        网站公告
      </label>

      <textarea
        id="announcementText"
        placeholder="例如：欢迎来到金满堂，最新公告将在这里显示。"
      ></textarea>


      <div class="switchRow">

        <div class="switchText">
          显示滚动公告
        </div>

        <label class="switch">
          <input
            id="announcementEnabled"
            type="checkbox"
          >
          <span class="slider"></span>
        </label>

      </div>


      <button onclick="saveSettings()">
        更新网站设置
      </button>

      <div class="msg" id="settingsMsg"></div>

    </div>


    <div class="card">

      <button
        class="secondary"
        onclick="logout()"
      >
        退出管理员账号
      </button>

    </div>

  </div>


  <div class="foot">
    © 2022 JIN MANTANG · ADMIN SYSTEM
  </div>

</div>


<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';

const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';

let token =
sessionStorage.getItem('jmt_access_token') || '';


async function signIn(){

  const email =
  document.getElementById('email').value.trim();

  const password =
  document.getElementById('password').value;

  const msg =
  document.getElementById('loginMsg');


  if(!email || !password){

    msg.textContent =
    '请输入管理员邮箱和密码';

    return;

  }


  msg.textContent =
  '正在登录...';


  try{

    const r =
    await fetch(
      BASE + '/auth/v1/token?grant_type=password',
      {
        method:'POST',

        headers:{
          apikey:KEY,
          'Content-Type':'application/json'
        },

        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );


    const d =
    await r.json();


    if(!r.ok || !d.access_token){

      throw new Error('登录失败');

    }


    token =
    d.access_token;


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );


    showAdmin();

    loadCurrent();

    loadSettings();


  }catch(e){

    msg.textContent =
    '登录失败，请检查邮箱和密码';

  }

}



function showAdmin(){

  document.getElementById(
    'loginBox'
  ).classList.add('hidden');


  document.getElementById(
    'adminBox'
  ).classList.remove('hidden');

}



async function loadCurrent(){

  try{

    const url =
    BASE +
    '/rest/v1/results?select=result_number,published_at&order=published_at.desc&limit=1';


    const r =
    await fetch(
      url,
      {
        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + KEY
        }
      }
    );


    if(!r.ok){
      throw new Error();
    }


    const rows =
    await r.json();


    document.getElementById(
      'currentResult'
    ).textContent =
    rows.length
    ? rows[0].result_number
    : '--';


  }catch(e){

    document.getElementById(
      'currentResult'
    ).textContent =
    '--';

  }

}



async function publishResult(){

  const input =
  document.getElementById(
    'resultInput'
  );

  const msg =
  document.getElementById(
    'publishMsg'
  );

  let n =
  input.value.trim();


  if(!/^\d{1,2}$/.test(n)){

    msg.textContent =
    '请输入 00 到 99 的数字';

    return;

  }


  n =
  n.padStart(2,'0');


  msg.textContent =
  '正在发布...';


  try{

    const r =
    await fetch(
      BASE + '/rest/v1/results',
      {
        method:'POST',

        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + token,
          'Content-Type':'application/json',
          Prefer:'return=representation'
        },

        body:JSON.stringify({
          result_number:n
        })
      }
    );


    if(r.status === 401 ||
       r.status === 403){

      sessionStorage.removeItem(
        'jmt_access_token'
      );

      throw new Error();

    }


    if(!r.ok){
      throw new Error();
    }


    document.getElementById(
      'currentResult'
    ).textContent =
    n;


    input.value =
    '';


    msg.textContent =
    '✓ 发布成功：' + n;


  }catch(e){

    msg.textContent =
    '发布失败，请重新登录后再试';

  }

}



async function loadSettings(){

  const msg =
  document.getElementById(
    'settingsMsg'
  );


  try{

    const url =
    BASE +
    '/rest/v1/site_settings?id=eq.1&select=telegram_url,announcement_text,announcement_enabled';


    const r =
    await fetch(
      url,
      {
        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + KEY
        }
      }
    );


    if(!r.ok){
      throw new Error();
    }


    const rows =
    await r.json();


    if(!rows.length){
      return;
    }


    const s =
    rows[0];


    document.getElementById(
      'telegramUrl'
    ).value =
    s.telegram_url || '';


    document.getElementById(
      'announcementText'
    ).value =
    s.announcement_text || '';


    document.getElementById(
      'announcementEnabled'
    ).checked =
    !!s.announcement_enabled;


  }catch(e){

    msg.textContent =
    '暂时无法读取网站设置';

  }

}



async function saveSettings(){

  const msg =
  document.getElementById(
    'settingsMsg'
  );


  const telegram =
  document.getElementById(
    'telegramUrl'
  ).value.trim();


  const announcement =
  document.getElementById(
    'announcementText'
  ).value.trim();


  const enabled =
  document.getElementById(
    'announcementEnabled'
  ).checked;


  if(telegram){

    try{

      const u =
      new URL(telegram);


      if(
        u.protocol !== 'https:' &&
        u.protocol !== 'http:'
      ){
        throw new Error();
      }


    }catch(e){

      msg.textContent =
      'Telegram 链接格式不正确';

      return;

    }

  }


  msg.textContent =
  '正在更新网站...';


  try{

    const r =
    await fetch(
      BASE +
      '/rest/v1/site_settings?id=eq.1',
      {
        method:'PATCH',

        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + token,
          'Content-Type':'application/json',
          Prefer:'return=representation'
        },

        body:JSON.stringify({

          telegram_url:
          telegram,

          announcement_text:
          announcement,

          announcement_enabled:
          enabled,

          updated_at:
          new Date().toISOString()

        })
      }
    );


    if(r.status === 401 ||
       r.status === 403){

      sessionStorage.removeItem(
        'jmt_access_token'
      );

      throw new Error();

    }


    if(!r.ok){
      throw new Error();
    }


    msg.textContent =
    '✓ 网站设置更新成功';


  }catch(e){

    msg.textContent =
    '更新失败，请重新登录后再试';

  }

}



function logout(){

  sessionStorage.removeItem(
    'jmt_access_token'
  );

  location.reload();

}



if(token){

  showAdmin();

  loadCurrent();

  loadSettings();

}

</script>

</body>
</html>
