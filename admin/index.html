<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1">

<meta
  name="theme-color"
  content="#09090a">

<title>金满堂 · 代理管理</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;

  background:
  radial-gradient(
    circle at top,
    #251907 0,
    #0d0c0a 40%,
    #070708 100%
  );

  color:#f5edd9;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Arial,
  sans-serif;
}


.wrap{
  max-width:780px;
  margin:auto;
  padding:22px 14px 60px;
}


.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}


.logo{
  color:#efd477;
  font-size:22px;
  font-weight:900;
}


.sub{
  color:#827966;
  font-size:10px;
  letter-spacing:2px;
  margin-top:4px;
}


.card{
  background:
  linear-gradient(
    180deg,
    #151515,
    #0d0d0e
  );

  border:
  1px solid
  rgba(214,168,63,.28);

  border-radius:20px;

  padding:17px;

  margin-bottom:14px;
}


.title{
  color:#dfc575;
  font-size:15px;
  font-weight:900;
  margin-bottom:14px;
}


button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  font-weight:900;
  cursor:pointer;
}


button:disabled{
  opacity:.45;
  cursor:not-allowed;
}


.dark{
  background:#181819;
  color:#dbc67d;

  border:
  1px solid
  rgba(214,168,63,.22);
}


.gold{
  background:
  linear-gradient(
    180deg,
    #efd47c,
    #b87e1e
  );

  color:#161008;
}


.red{
  background:#251616;
  color:#e4a0a0;

  border:
  1px solid
  rgba(210,90,90,.22);
}


input,
select{
  width:100%;
  border-radius:11px;
  border:
  1px solid
  rgba(214,168,63,.24);

  background:#101011;
  color:#fff;

  padding:12px;

  font-size:14px;

  outline:none;
}


.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}


.full{
  grid-column:1/-1;
}


.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}


.stat{
  background:#101011;

  border:
  1px solid
  rgba(255,255,255,.06);

  border-radius:13px;

  padding:13px;
}


.stat small{
  display:block;
  color:#817a6d;
  font-size:10px;
  margin-bottom:6px;
}


.stat strong{
  color:#ebcd72;
  font-size:20px;
}


.searchRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}


.agent{
  background:#101011;

  border:
  1px solid
  rgba(255,255,255,.06);

  border-radius:14px;

  padding:14px;

  margin-bottom:9px;
}


.agentTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}


.name{
  color:#efd278;
  font-size:16px;
  font-weight:900;
}


.meta{
  color:#817b70;
  font-size:10px;
  line-height:1.6;
  margin-top:5px;
}


.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  white-space:nowrap;
}


.badge.active{
  background:#153124;
  color:#77d69e;
}


.badge.suspended{
  background:#342c17;
  color:#e4c879;
}


.badge.blocked{
  background:#371b1b;
  color:#e89b9b;
}


.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:12px;
}


.actions button{
  width:100%;
  padding:10px 6px;
  font-size:11px;
}


.rateRow{
  display:grid;
  grid-template-columns:1.3fr 1fr auto;
  gap:8px;
}


.msg{
  min-height:18px;
  text-align:center;
  color:#9d9586;
  font-size:12px;
  margin-top:10px;
  line-height:1.5;
}


.success{
  color:#71d49d!important;
}


.error{
  color:#e58e8e!important;
}


.empty{
  text-align:center;
  color:#777166;
  font-size:13px;
  padding:25px 10px;
}


.note{
  color:#766f62;
  font-size:10px;
  line-height:1.6;
  margin-top:10px;
}


@media(max-width:560px){

  .formGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .rateRow{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>

<div class="wrap">


<div class="header">

  <div>

    <div class="logo">
      金满堂 · 代理管理
    </div>

    <div class="sub">
      ADMIN / AGENTS
    </div>

  </div>

  <button
    class="dark"
    onclick="location.href='/admin/'">
    返回总后台
  </button>

</div>


<div class="card">

  <div class="title">
    ＋ 创建新代理
  </div>

  <div class="formGrid">

    <input
      id="newName"
      placeholder="代理名称，例如：小林代理">

    <input
      id="newEmail"
      type="email"
      placeholder="代理登录邮箱">

    <input
      id="newPassword"
      type="password"
      placeholder="初始密码，至少8位">

    <input
      id="newRate"
      type="number"
      min="0"
      max="40"
      step="0.01"
      value="20"
      placeholder="代理比例 %">

    <button
      id="createBtn"
      class="gold full"
      onclick="createAgent()">

      创建代理账号

    </button>

  </div>

  <div
    class="msg"
    id="createMsg">
  </div>

  <div class="note">
    创建成功后，代理可以直接使用设置的邮箱和密码登录代理中心。
  </div>

</div>


<div class="card">

  <div class="title">
    代理概况
  </div>

  <div class="stats">

    <div class="stat">

      <small>
        代理总数
      </small>

      <strong id="totalAgents">
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        正常代理
      </small>

      <strong id="activeAgents">
        0
      </strong>

    </div>


    <div class="stat">

      <small>
        暂停 / 限制
      </small>

      <strong id="inactiveAgents">
        0
      </strong>

    </div>

  </div>

</div>


<div class="card">

  <div class="title">
    调整代理比例
  </div>

  <div class="rateRow">

    <select id="agentSelect">

      <option value="">
        选择代理
      </option>

    </select>

    <input
      id="rateInput"
      type="number"
      min="0"
      max="40"
      step="0.01"
      placeholder="新比例 %">

    <button
      class="gold"
      onclick="updateRate()">

      保存比例

    </button>

  </div>

  <div
    class="msg"
    id="rateMsg">
  </div>

</div>


<div class="card">

  <div class="title">
    代理列表
  </div>

  <div class="searchRow">

    <input
      id="searchInput"
      placeholder="搜索代理名称"
      oninput="renderAgents()">

    <button
      class="dark"
      onclick="loadAgents()">

      刷新

    </button>

  </div>

  <div style="height:13px"></div>

  <div id="agentList">

    <div class="empty">
      正在读取...
    </div>

  </div>

  <div
    class="msg"
    id="listMsg">
  </div>

</div>


<div class="card">

  <button
    class="dark"
    style="width:100%"
    onclick="location.href='/admin/'">

    ← 返回 Admin 总后台

  </button>

</div>


</div>


<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


/*
  这里是这次最重要的修复。

  Admin 总后台可能把 token
  保存在 localStorage
  或 sessionStorage。

  代理管理页面现在四种位置都会检查，
  不会再因为读取不到 token
  自动把管理员踢出去。
*/

let token =

localStorage.getItem(
  'jmt_access_token'
)

||

sessionStorage.getItem(
  'jmt_access_token'
)

||

localStorage.getItem(
  'jmt_token'
)

||

sessionStorage.getItem(
  'jmt_token'
)

||

'';


let adminUser = null;

let agents = [];


/* =========================
   API
========================= */

async function api(
  path,
  options={}
){

  const headers = {

    apikey:KEY,

    Authorization:
    'Bearer '+token,

    ...(options.headers || {})

  };


  return fetch(
    BASE+path,
    {
      ...options,
      headers
    }
  );

}


/* =========================
   VERIFY ADMIN
========================= */

async function verifyAdmin(){

  if(!token){

    return false;

  }


  try{

    /*
      第一步：
      确认 token 还是有效登录状态。
    */

    const ur =
    await api(
      '/auth/v1/user'
    );


    if(!ur.ok){

      throw new Error(
        'session'
      );

    }


    const user =
    await ur.json();


    /*
      第二步：
      不只是确认“有人登录”，
      还必须确认这个用户真的在 admin_users 表里。
    */

    const ar =
    await api(

      '/rest/v1/admin_users'+
      '?auth_user_id=eq.'+
      encodeURIComponent(
        user.id
      )+
      '&select=auth_user_id'+
      '&limit=1'

    );


    if(!ar.ok){

      throw new Error(
        'admin'
      );

    }


    const rows =
    await ar.json();


    if(!rows.length){

      throw new Error(
        'admin'
      );

    }


    adminUser =
    user;


    return true;


  }catch(e){

    /*
      只有真的无效时才清除登录状态。
    */

    localStorage.removeItem(
      'jmt_access_token'
    );

    sessionStorage.removeItem(
      'jmt_access_token'
    );

    localStorage.removeItem(
      'jmt_token'
    );

    sessionStorage.removeItem(
      'jmt_token'
    );


    token = '';


    return false;

  }

}


/* =========================
   CREATE AGENT
========================= */

async function createAgent(){

  const name =
  document.getElementById(
    'newName'
  ).value.trim();


  const email =
  document.getElementById(
    'newEmail'
  ).value.trim();


  const password =
  document.getElementById(
    'newPassword'
  ).value;


  const rate =
  Number(
    document.getElementById(
      'newRate'
    ).value
  );


  const msg =
  document.getElementById(
    'createMsg'
  );


  const btn =
  document.getElementById(
    'createBtn'
  );


  msg.className =
  'msg';


  if(!name){

    msg.textContent =
    '请输入代理名称';

    msg.classList.add(
      'error'
    );

    return;

  }


  if(
    !email
    ||
    !email.includes('@')
  ){

    msg.textContent =
    '请输入正确的登录邮箱';

    msg.classList.add(
      'error'
    );

    return;

  }


  if(
    password.length < 8
  ){

    msg.textContent =
    '初始密码至少需要8位';

    msg.classList.add(
      'error'
    );

    return;

  }


  if(
    !Number.isFinite(rate)
    ||
    rate < 0
    ||
    rate > 40
  ){

    msg.textContent =
    '代理比例必须在0%–40%之间';

    msg.classList.add(
      'error'
    );

    return;

  }


  btn.disabled =
  true;


  msg.textContent =
  '正在创建代理账号...';


  try{

    const r =
    await fetch(

      BASE+
      '/functions/v1/create-agent',

      {

        method:'POST',

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer '+token,

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          display_name:
          name,

          email:
          email,

          password:
          password,

          commission_rate:
          rate

        })

      }

    );


    let d = {};


    try{

      d =
      await r.json();

    }catch(e){

      d = {};

    }


    if(!r.ok){

      throw new Error(
        d.error
        ||
        '创建失败'
      );

    }


    msg.className =
    'msg success';


    msg.textContent =

    '✓ 代理「'+
    name+
    '」创建成功';


    document.getElementById(
      'newName'
    ).value =
    '';


    document.getElementById(
      'newEmail'
    ).value =
    '';


    document.getElementById(
      'newPassword'
    ).value =
    '';


    document.getElementById(
      'newRate'
    ).value =
    '20';


    await loadAgents();


  }catch(e){

    msg.className =
    'msg error';


    msg.textContent =
    e.message
    ||
    '创建代理失败';


  }finally{

    btn.disabled =
    false;

  }

}


/* =========================
   LOAD AGENTS
========================= */

async function loadAgents(){

  const msg =
  document.getElementById(
    'listMsg'
  );


  msg.className =
  'msg';


  if(!token){

    msg.className =
    'msg error';


    msg.textContent =
    '管理员登录状态已失效';


    return;

  }


  try{

    const r =
    await api(

      '/rest/v1/agents'+
      '?select=id,display_name,commission_rate,status,created_at'+
      '&order=created_at.desc'

    );


    if(!r.ok){

      throw new Error();

    }


    agents =
    await r.json();


    renderAgents();

    updateStats();

    buildSelect();


    msg.textContent =
    '';


  }catch(e){

    msg.className =
    'msg error';


    msg.textContent =
    '无法读取代理资料，请返回 Admin 重新登录';

  }

}


/* =========================
   RENDER AGENTS
========================= */

function renderAgents(){

  const box =
  document.getElementById(
    'agentList'
  );


  const keyword =
  document.getElementById(
    'searchInput'
  )
  .value
  .trim()
  .toLowerCase();


  const list =
  agents.filter(
    a=>

    String(
      a.display_name || ''
    )
    .toLowerCase()
    .includes(
      keyword
    )

  );


  if(!list.length){

    box.innerHTML =
    '<div class="empty">'+
    '没有找到代理'+
    '</div>';


    return;

  }


  box.innerHTML =

  list.map(
    a=>{

      const statusText =

      a.status === 'active'

      ?

      '正常'

      :

      a.status === 'suspended'

      ?

      '已暂停'

      :

      '已限制';


      return `

      <div class="agent">

        <div class="agentTop">

          <div>

            <div class="name">

              ${escapeHtml(
                a.display_name
                ||
                '未命名代理'
              )}

            </div>

            <div class="meta">

              当前比例：
              ${formatRate(
                a.commission_rate
              )}%

              <br>

              创建时间：
              ${formatDate(
                a.created_at
              )}

            </div>

          </div>

          <div class="badge ${a.status}">

            ${statusText}

          </div>

        </div>


        <div class="actions">

          <button
            class="dark"
            onclick="chooseAgent('${a.id}')">

            修改比例

          </button>


          <button
            class="dark"
            onclick="setStatus(
              '${a.id}',
              '${
                a.status === 'suspended'
                ?
                'active'
                :
                'suspended'
              }'
            )">

            ${
              a.status === 'suspended'
              ?
              '恢复代理'
              :
              '暂停代理'
            }

          </button>


          <button
            class="red"
            onclick="setStatus(
              '${a.id}',
              '${
                a.status === 'blocked'
                ?
                'active'
                :
                'blocked'
              }'
            )">

            ${
              a.status === 'blocked'
              ?
              '解除限制'
              :
              '限制代理'
            }

          </button>

        </div>

      </div>

      `;

    }

  ).join('');

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
  agents.length;


  const active =
  agents.filter(
    a=>
    a.status ===
    'active'
  ).length;


  document.getElementById(
    'totalAgents'
  ).textContent =
  total;


  document.getElementById(
    'activeAgents'
  ).textContent =
  active;


  document.getElementById(
    'inactiveAgents'
  ).textContent =
  total-active;

}


/* =========================
   AGENT SELECT
========================= */

function buildSelect(){

  const select =
  document.getElementById(
    'agentSelect'
  );


  const currentValue =
  select.value;


  select.innerHTML =
  '<option value="">'+
  '选择代理'+
  '</option>';


  agents.forEach(
    a=>{

      const option =
      document.createElement(
        'option'
      );


      option.value =
      a.id;


      option.textContent =

      (
        a.display_name
        ||
        '未命名代理'
      )

      +

      ' · '

      +

      formatRate(
        a.commission_rate
      )

      +

      '%';


      select.appendChild(
        option
      );

    }

  );


  if(
    agents.some(
      a=>
      a.id ===
      currentValue
    )
  ){

    select.value =
    currentValue;

  }

}


function chooseAgent(id){

  const a =
  agents.find(
    x=>
    x.id === id
  );


  if(!a){

    return;

  }


  document.getElementById(
    'agentSelect'
  ).value =
  a.id;


  document.getElementById(
    'rateInput'
  ).value =
  Number(
    a.commission_rate
    ||
    0
  );


  document.getElementById(
    'rateInput'
  ).scrollIntoView({
    behavior:'smooth',
    block:'center'
  });

}


/* =========================
   UPDATE RATE
========================= */

async function updateRate(){

  const id =
  document.getElementById(
    'agentSelect'
  ).value;


  const rate =
  Number(
    document.getElementById(
      'rateInput'
    ).value
  );


  const msg =
  document.getElementById(
    'rateMsg'
  );


  msg.className =
  'msg';


  if(!id){

    msg.textContent =
    '请先选择代理';


    msg.classList.add(
      'error'
    );


    return;

  }


  if(
    !Number.isFinite(rate)
    ||
    rate < 0
    ||
    rate > 40
  ){

    msg.textContent =
    '请输入0%–40%';


    msg.classList.add(
      'error'
    );


    return;

  }


  msg.textContent =
  '正在保存...';


  try{

    const r =
    await api(

      '/rest/v1/agents'+
      '?id=eq.'+
      encodeURIComponent(
        id
      ),

      {

        method:'PATCH',

        headers:{

          'Content-Type':
          'application/json',

          Prefer:
          'return=minimal'

        },

        body:
        JSON.stringify({
          commission_rate:
          rate
        })

      }

    );


    if(!r.ok){

      throw new Error();

    }


    msg.className =
    'msg success';


    msg.textContent =
    '✓ 比例已保存';


    await loadAgents();


  }catch(e){

    msg.className =
    'msg error';


    msg.textContent =
    '保存失败';

  }

}


/* =========================
   STATUS
========================= */

async function setStatus(
  id,
  status
){

  const text =

  status === 'blocked'

  ?

  '确定限制这个代理吗？限制后该代理将不能正常提交。'

  :

  status === 'suspended'

  ?

  '确定暂停这个代理吗？'

  :

  '确定恢复这个代理吗？';


  if(!confirm(text)){

    return;

  }


  try{

    const r =
    await api(

      '/rest/v1/agents'+
      '?id=eq.'+
      encodeURIComponent(
        id
      ),

      {

        method:'PATCH',

        headers:{

          'Content-Type':
          'application/json',

          Prefer:
          'return=minimal'

        },

        body:
        JSON.stringify({
          status:
          status
        })

      }

    );


    if(!r.ok){

      throw new Error();

    }


    await loadAgents();


  }catch(e){

    alert(
      '操作失败'
    );

  }

}


/* =========================
   FORMAT
========================= */

function formatDate(value){

  if(!value){

    return '—';

  }


  return new Intl
  .DateTimeFormat(
    'zh-CN',
    {

      timeZone:
      'Asia/Yangon',

      year:'numeric',

      month:'2-digit',

      day:'2-digit',

      hour:'2-digit',

      minute:'2-digit',

      hour12:false

    }
  )
  .format(
    new Date(value)
  );

}


function formatRate(value){

  return Number(
    value || 0
  ).toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


function escapeHtml(text){

  return String(text)

  .replaceAll(
    '&',
    '&amp;'
  )

  .replaceAll(
    '<',
    '&lt;'
  )

  .replaceAll(
    '>',
    '&gt;'
  )

  .replaceAll(
    '"',
    '&quot;'
  )

  .replaceAll(
    "'",
    '&#039;'
  );

}

async function startPage(){

  const msg =
  document.getElementById(
    'listMsg'
  );


  msg.textContent =
  '正在验证管理员身份...';


  const ok =
  await verifyAdmin();


  if(!ok){

    /*

      才回 Admin 登录页。

    location.href =
    '/admin/';


    return;

  }


  await loadAgents();

}


startPage();
