<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">
<title>金满堂 · 管理员</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#1b1409 0,#0b0b0c 40%,#070708 100%);
  color:#f7f0df;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif
}
.wrap{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:24px 15px 44px
}
.brand{
  text-align:center;
  margin-bottom:22px
}
.mark{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  font-size:22px;
  font-weight:900;
  color:#f0d486;
  border:1px solid #aa7a23;
  background:linear-gradient(145deg,#2b1d08,#0e0d0a);
  box-shadow:0 0 20px rgba(214,168,63,.15)
}
.cn{
  font-weight:900;
  font-size:22px;
  letter-spacing:3px;
  color:#f3d889
}
.en{
  font-size:11px;
  letter-spacing:2px;
  color:#9b8d68;
  margin-top:3px
}
.card{
  background:linear-gradient(180deg,rgba(21,21,21,.98),rgba(12,12,13,.98));
  border:1px solid rgba(214,168,63,.3);
  border-radius:24px;
  padding:22px;
  box-shadow:0 24px 65px rgba(0,0,0,.4)
}
.title{
  text-align:center;
  color:#d7bf7b;
  font-size:15px;
  font-weight:800;
  margin-bottom:20px
}
input{
  width:100%;
  padding:14px 15px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid rgba(214,168,63,.25);
  background:#111112;
  color:white;
  font-size:16px;
  outline:none
}
input:focus{
  border-color:#d6a83f
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(180deg,#f0d486,#b98223);
  color:#17120a;
  margin-top:5px
}
button.secondary{
  margin-top:12px;
  background:#1b1b1d;
  color:#d7bf7b;
  border:1px solid rgba(214,168,63,.25)
}
.msg{
  min-height:22px;
  text-align:center;
  font-size:13px;
  margin-top:13px;
  color:#bcb3a0
}
.current{
  text-align:center;
  margin-bottom:20px;
  padding:15px;
  border-radius:14px;
  background:#101011;
  border:1px solid rgba(255,255,255,.06)
}
.current small{
  display:block;
  color:#8e897f;
  margin-bottom:5px
}
.current strong{
  font-size:46px;
  color:#e8c86e
}
.hidden{display:none}
.foot{
  text-align:center;
  color:#77736b;
  font-size:11px;
  margin-top:22px
}
</style>
</head>

<body>
<div class="wrap">

  <div class="brand">
    <div class="mark">金</div>
    <div class="cn">金满堂</div>
    <div class="en">JIN MANTANG · ADMIN</div>
  </div>

  <div class="card">

    <div id="loginBox">
      <div class="title">管理员登录</div>

      <input id="email" type="email" placeholder="管理员邮箱">

      <input id="password" type="password" placeholder="密码">

      <button onclick="signIn()">登录</button>

      <div class="msg" id="loginMsg"></div>
    </div>


    <div id="adminBox" class="hidden">

      <div class="title">数字发布管理</div>

      <div class="current">
        <small>当前最新数字</small>
        <strong id="currentResult">--</strong>
      </div>

      <input
        id="resultInput"
        inputmode="numeric"
        maxlength="2"
        placeholder="输入 00 - 99"
      >

      <button onclick="publishResult()">发布最新数字</button>

      <button class="secondary" onclick="logout()">退出登录</button>

      <div class="msg" id="publishMsg"></div>

    </div>

  </div>

  <div class="foot">
    © 2022 JIN MANTANG · ADMIN
  </div>

</div>

<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';

const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';

let token =
sessionStorage.getItem('jmt_access_token') || '';


async function signIn(){

  const email =
  document.getElementById('email').value.trim();

  const password =
  document.getElementById('password').value;

  const msg =
  document.getElementById('loginMsg');

  msg.textContent = '正在登录...';

  try{

    const r = await fetch(
      BASE + '/auth/v1/token?grant_type=password',
      {
        method:'POST',
        headers:{
          apikey:KEY,
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const d = await r.json();

    if(!r.ok || !d.access_token){
      throw new Error(
        d.error_description ||
        d.msg ||
        '登录失败'
      );
    }

    token = d.access_token;

    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

    showAdmin();

    loadCurrent();

  }catch(e){

    msg.textContent =
    '登录失败，请检查邮箱和密码';

  }

}


function showAdmin(){

  document.getElementById('loginBox')
  .classList.add('hidden');

  document.getElementById('adminBox')
  .classList.remove('hidden');

}


async function loadCurrent(){

  try{

    const url =
    BASE +
    '/rest/v1/results?select=result_number,published_at&order=published_at.desc&limit=1';

    const r = await fetch(url,{
      headers:{
        apikey:KEY,
        Authorization:'Bearer ' + KEY
      }
    });

    const rows = await r.json();

    document.getElementById(
      'currentResult'
    ).textContent =
    rows.length ? rows[0].result_number : '--';

  }catch(e){

    document.getElementById(
      'currentResult'
    ).textContent = '--';

  }

}


async function publishResult(){

  const input =
  document.getElementById('resultInput');

  const msg =
  document.getElementById('publishMsg');

  let n = input.value.trim();

  if(!/^\d{1,2}$/.test(n)){

    msg.textContent =
    '请输入 00 到 99 的数字';

    return;

  }

  n = n.padStart(2,'0');

  msg.textContent = '正在发布...';

  try{

    const r = await fetch(
      BASE + '/rest/v1/results',
      {
        method:'POST',
        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + token,
          'Content-Type':'application/json',
          Prefer:'return=representation'
        },
        body:JSON.stringify({
          result_number:n
        })
      }
    );

    if(r.status === 401 || r.status === 403){

      sessionStorage.removeItem(
        'jmt_access_token'
      );

      throw new Error('登录已过期');

    }

    if(!r.ok){

      throw new Error(
        '发布失败 HTTP ' + r.status
      );

    }

    msg.textContent =
    '发布成功：' + n;

    input.value = '';

    document.getElementById(
      'currentResult'
    ).textContent = n;

  }catch(e){

    msg.textContent =
    '发布失败，请重新登录后再试';

  }

}


function logout(){

  sessionStorage.removeItem(
    'jmt_access_token'
  );

  location.reload();

}


if(token){

  showAdmin();

  loadCurrent();

}

</script>

</body>
</html>
