<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let refreshPromise =
null;


let agents =
[];


let customers =
[];


let payoutAccounts =
[];


let commissionRows =
[];


let selectedAgentId =
null;


let busy =
false;


/* =====================================
   HELPERS
===================================== */

function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function escJs(value){

  return String(
    value
    ??
    ''
  )
  .replace(
    /\\/g,
    '\\\\'
  )
  .replace(
    /'/g,
    "\\'"
  );

}


function money(value){

  return Number(
    value
    ||
    0
  )
  .toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


function formatRate(value){

  return Number(
    value
    ||
    0
  )
  .toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


function formatDate(value){

  if(!value){

    return '—';

  }


  const date =
  new Date(
    value
  );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return '—';

  }


  return new Intl.DateTimeFormat(
    'zh-CN',
    {
      timeZone:
      'Asia/Yangon',

      year:
      'numeric',

      month:
      '2-digit',

      day:
      '2-digit',

      hour:
      '2-digit',

      minute:
      '2-digit',

      hour12:
      false
    }
  )
  .format(
    date
  )
  +
  ' MMT';

}


function periodName(code){

  if(
    code
    ===
    '1030'
  ){

    return '上午 11:45';

  }


  if(
    code
    ===
    '1530'
  ){

    return '下午 3:45';

  }


  return (
    code
    ||
    '—'
  );

}


function statusName(status){

  if(
    status
    ===
    'active'
  ){

    return '正常';

  }


  if(
    status
    ===
    'suspended'
  ){

    return '已暂停';

  }


  if(
    status
    ===
    'blocked'
  ){

    return '已限制';

  }


  return (
    status
    ||
    '—'
  );

}


function statusClass(status){

  if(
    status
    ===
    'active'
  ){

    return 'active';

  }


  if(
    status
    ===
    'suspended'
  ){

    return 'suspended';

  }


  return 'blocked';

}


function payoutMethodName(type){

  if(
    type
    ===
    'kpay'
  ){

    return 'KPay';

  }


  if(
    type
    ===
    'bank'
  ){

    return '银行账户';

  }


  return (
    type
    ||
    '—'
  );

}


function getJwtPayload(){

  try{

    let part =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');


    while(
      part.length
      %
      4
    ){

      part += '=';

    }


    return JSON.parse(

      decodeURIComponent(

        atob(part)
        .split('')
        .map(

          char =>
          '%'
          +
          (
            '00'
            +
            char
            .charCodeAt(0)
            .toString(16)
          )
          .slice(-2)

        )
        .join('')

      )

    );

  }
  catch{

    return {};

  }

}


/* =====================================
   SESSION / API
===================================== */

async function refreshAdminSession(){

  if(!refreshToken){

    return false;

  }


  if(refreshPromise){

    return refreshPromise;

  }


  refreshPromise =
  (
    async()=>{

      try{

        const response =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:
            'POST',

            headers:{

              apikey:
              KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(!response.ok){

          return false;

        }


        const data =
        await response.json();


        if(!data.access_token){

          return false;

        }


        token =
        data.access_token;


        localStorage.setItem(
          'jmt_access_token',
          token
        );


        sessionStorage.setItem(
          'jmt_access_token',
          token
        );


        if(data.refresh_token){

          refreshToken =
          data.refresh_token;


          localStorage.setItem(
            'jmt_refresh_token',
            refreshToken
          );


          sessionStorage.setItem(
            'jmt_refresh_token',
            refreshToken
          );

        }


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:
        KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let response =
  await request();


  if(
    response.status
    !==
    401
  ){

    return response;

  }


  if(
    !await refreshAdminSession()
  ){

    return response;

  }


  return request();

}


async function parseResponse(response){

  const text =
  await response.text();


  let data =
  null;


  try{

    data =
    text
    ?
    JSON.parse(
      text
    )
    :
    null;

  }
  catch{

    data =
    text;

  }


  if(!response.ok){

    throw new Error(

      data?.message
      ||
      data?.error
      ||
      data?.hint
      ||
      text
      ||
      'REQUEST_FAILED'

    );

  }


  return data;

}


/* =====================================
   ADMIN VERIFY
===================================== */

async function verifyAdmin(){

  if(!token){

    return false;

  }


  const payload =
  getJwtPayload();


  if(
    payload.aal
    !==
    'aal2'
  ){

    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){

      return false;

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(!adminRes.ok){

      return false;

    }


    const rows =
    await adminRes.json();


    return (
      Array.isArray(
        rows
      )
      &&
      rows.length > 0
    );

  }
  catch{

    return false;

  }

}


/* =====================================
   DATA HELPERS
===================================== */

function agentById(id){

  return agents.find(

    agent =>
    agent.id
    ===
    id

  )
  ||
  null;

}


function customersForAgent(id){

  return customers.filter(

    customer =>
    customer.referral_agent_id
    ===
    id

  );

}


function accountsForAgent(id){

  return payoutAccounts.filter(

    account =>
    account.agent_id
    ===
    id

  );

}


function commissionsForAgent(id){

  return commissionRows.filter(

    row =>
    row.agent_id
    ===
    id

  );

}


function commissionSummary(id){

  return commissionsForAgent(
    id
  )
  .reduce(

    (
      summary,
      row
    )=>{

      summary.confirmed +=
      Number(
        row.confirmed_customer_points
        ||
        0
      );


      summary.pending +=
      Number(
        row.pending_customer_points
        ||
        0
      );


      summary.due +=
      Number(
        row.commission_due
        ||
        0
      );


      summary.paid +=
      Number(
        row.commission_paid
        ||
        0
      );


      summary.remaining +=
      Number(
        row.commission_remaining
        ||
        0
      );


      return summary;

    },

    {
      confirmed:0,
      pending:0,
      due:0,
      paid:0,
      remaining:0
    }

  );

}


function payoutState(agentId){

  const rows =
  accountsForAgent(
    agentId
  );


  if(!rows.length){

    return '未绑定';

  }


  const editable =
  rows.some(

    account =>
    account.agent_edit_locked
    ===
    false

  );


  return editable
  ?
  '允许修改中'
  :
  '已绑定';

}


function referralLink(agent){

  if(
    !agent?.referral_code
  ){

    return '—';

  }


  return (
    location.origin
    +
    '/customer/?ref='
    +
    encodeURIComponent(
      agent.referral_code
    )
  );

}


/* =====================================
   LOAD ALL
===================================== */

async function loadAll(
  showMessage=false
){

  const msg =
  document.getElementById(
    'pageMsg'
  );


  if(showMessage){

    msg.className =
    'msg';


    msg.textContent =
    '正在刷新代理中心...';

  }


  try{

    const responses =
    await Promise.all([

      api(
        '/rest/v1/agents'
        +
        '?select=id,display_name,commission_rate,status,created_at,referral_code'
        +
        '&order=created_at.desc'
      ),

      api(
        '/rest/v1/customer_profiles'
        +
        '?select=id,customer_code,username,display_name,phone,status,created_at,referral_agent_id,referral_bound_at'
        +
        '&referral_agent_id=not.is.null'
        +
        '&order=created_at.desc'
      ),

      api(
        '/rest/v1/agent_payout_accounts'
        +
        '?select=id,agent_id,method_type,account_name,account_number,bank_name,is_verified,is_active,agent_edit_locked,locked_at,unlocked_at,created_at,updated_at'
        +
        '&is_active=eq.true'
        +
        '&order=created_at.asc'
      ),

      api(
        '/rest/v1/rpc/admin_list_agent_referral_commissions',
        {

          method:
          'POST',

          headers:{

            'Content-Type':
            'application/json'

          },

          body:
          JSON.stringify({

            p_round_id:
            null

          })

        }
      )

    ]);


    for(
      const response
      of
      responses
    ){

      if(!response.ok){

        throw new Error(
          await response.text()
          ||
          'LOAD_FAILED'
        );

      }

    }


    agents =
    await responses[0]
    .json();


    customers =
    await responses[1]
    .json();


    payoutAccounts =
    await responses[2]
    .json();


    const commissionData =
    await responses[3]
    .json();


    commissionRows =
    Array.isArray(
      commissionData?.rows
    )
    ?
    commissionData.rows
    :
    [];


    updateSummary();


    renderAgents();


    if(showMessage){

      msg.className =
      'msg ok';


      msg.textContent =
      '资料已更新';

    }

  }
  catch(error){

    console.error(
      error
    );


    msg.className =
    'msg err';


    msg.textContent =
    '代理中心读取失败：'
    +
    translateError(
      error.message
    );

  }

}

function updateSummary(){

  document
  .getElementById(
    'totalAgents'
  )
  .textContent =
  agents.length;


  document
  .getElementById(
    'activeAgents'
  )
  .textContent =
  agents.filter(

    agent =>
    agent.status
    ===
    'active'

  )
  .length;


  document
  .getElementById(
    'referredCustomers'
  )
  .textContent =
  customers.length;


  const pending =
  commissionRows.reduce(

    (
      total,
      row
    )=>
    total
    +
    Number(
      row.commission_remaining
      ||
      0
    ),

    0

  );


  document
  .getElementById(
    'pendingCommission'
  )
  .textContent =
  money(
    pending
  );

}

  const keyword =
  document
  .getElementById(
    'searchInput'
  )

  .trim()
  .toLowerCase();

function commissionHtml(
  row,
  agent,
  accountRows

  const paid =
  Number(
    row.commission_paid
    ||
    0
  );


  const due =
  Number(
    row.commission_due
    ||
    0
  );


  const isPaid =
  (
    due > 0
    &&
    remaining <= 0
  );


  const accountSnapshotReady =
  Boolean(
    row.payout_account_number_snapshot
  );


  const currentAccountReady =
  (
    accountRows.length > 0
    &&
    accountRows.every(

      account =>
      account.agent_edit_locked
      !==
      false

    )
  );


  const payoutReady =
  (
    accountSnapshotReady
    ||
    currentAccountReady
  );


  const roundSettled =
  row.round_status
  ===
  'settled';


  const canPay =
  (
    remaining > 0
    &&
    roundSettled
    &&
    payoutReady
  );


  let buttonText =
  '确认佣金已支付';


  if(!roundSettled){

    buttonText =
    '本期结算后才可支付';

      account.agent_edit_locked

===================================== */

async function copyReferralLink(agentId){

  const agent =
  agentById(
    agentId
  );


  const text =
  referralLink(
    agent
  );


  if(
    text
    ===
    '—'
  ){

    setPageMessage(
      '该代理暂时没有推荐码',
      'err'
    );


    return;

  }


  try{

    .clipboard

      text
    );

      '推荐链接已复制',
      'ok'
    );

  }
  catch{

    const textarea =
    document.createElement(
      'textarea'
    );

    );

      'copy'
    );

      '推荐链接已复制',
      'ok'
    );

  }

/* =====================================
   COMMISSION PAID
===================================== */

function pickCommissionProof(){

  return new Promise(
    resolve => {

      const input =
      document.createElement(
        'input'
      );


      input.type =
      'file';


      input.accept =
      'image/jpeg,image/png,image/webp,image/heic,image/heif';


      input.onchange =
      ()=>{

        resolve(
          input.files?.[0]
          ||
          null
        );

      };


      input.click();

    }
  );

}


async function uploadCommissionProof(
  settlementId,
  file
){

  if(!file){
    throw new Error(
      'COMMISSION_PAYMENT_PROOF_REQUIRED'
    );
  }


  const allowed = [
    'image/jpeg',
    'image/png',
    'image/webp',
    'image/heic',
    'image/heif'
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      'COMMISSION_PAYMENT_PROOF_TYPE_INVALID'
    );

  }


  if(
    file.size
    >
    10
    *
    1024
    *
    1024
  ){

    throw new Error(
      'COMMISSION_PAYMENT_PROOF_TOO_LARGE'
    );

  }


  const safeName =
  String(
    file.name
    ||
    'commission-proof'
  )
  .replace(
    /[^a-zA-Z0-9._-]/g,
    '_'
  );


  const uniqueId =
  crypto.randomUUID
  ?
  crypto.randomUUID()
  :
  String(
    Date.now()
  );


  const storagePath =
  settlementId
  +
  '/'
  +
  uniqueId
  +
  '-'
  +
  safeName;


  const encoded =
  storagePath
  .split('/')
  .map(
    encodeURIComponent
  )
  .join('/');


  const response =
  await api(

    '/storage/v1/object/agent-commission-proofs/'
    +
    encoded,

    {

      method:
      'POST',

      headers:{

        'Content-Type':
        file.type,

        'x-upsert':
        'false'

      },

      body:
      file

    }

  );


  if(!response.ok){

    throw new Error(
      'COMMISSION_PAYMENT_PROOF_UPLOAD_FAILED'
    );

  }


  return storagePath;

}


async function deleteCommissionProof(
  storagePath
){

  if(!storagePath){
    return;
  }


  try{

    const encoded =
    storagePath
    .split('/')
    .map(
      encodeURIComponent
    )
    .join('/');


    await api(

      '/storage/v1/object/agent-commission-proofs/'
      +
      encoded,

      {
        method:
        'DELETE'
      }

    );

  }
  catch{}

}


async function viewCommissionProof(
  storagePath
){

  if(!storagePath){
    return;
  }


  const newWindow =
  window.open(
    '',
    '_blank'
  );


  try{

    const encoded =
    storagePath
    .split('/')
    .map(
      encodeURIComponent
    )
    .join('/');


    const response =
    await api(

      '/storage/v1/object/authenticated/agent-commission-proofs/'
      +
      encoded

    );


    if(!response.ok){
      throw new Error(
        'COMMISSION_PAYMENT_PROOF_NOT_FOUND'
      );
    }


    const blob =
    await response.blob();


    const url =
    URL.createObjectURL(
      blob
    );


    if(newWindow){

      newWindow.location =
      url;

    }
    else{

      location.href =
      url;

    }


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      60000
    );

  }
  catch(error){

    if(newWindow){
      newWindow.close();
    }


    setPageMessage(
      translateError(
        error.message
      ),
      'err'
    );

  }

}


/* =====================================
   COMMISSION PAYMENT
===================================== */

async function markCommissionPaid(
  agentId,
  roundId
){

  if(busy){
    return;
  }


  const agent =
  agentById(
    agentId
  );


  const row =
  commissionRows.find(

    item =>
    item.agent_id
    ===
    agentId
    &&
    item.round_id
    ===
    roundId

  );


  if(
    !agent
    ||
    !row
  ){
    return;
  }


  const remaining =
  Number(
    row.commission_remaining
    ||
    0
  );


  if(
    remaining
    <=
    0
  ){

    setPageMessage(
      '这笔佣金已经没有待付金额。',
      'err'
    );

    return;

  }


  if(
    row.round_status
    !==
    'settled'
  ){

    setPageMessage(
      '本期还没有正式结算，暂时不能支付佣金。',
      'err'
    );

    return;

  }


  const accounts =
  accountsForAgent(
    agentId
  );


  const snapshotReady =
  Boolean(
    row.payout_account_number_snapshot
  );


  const currentAccountsReady =
  (
    accounts.length
    >
    0
    &&
    accounts.every(

      account =>
      account.agent_edit_locked
      !==
      false

    )
  );


  if(
    !snapshotReady
    &&
    !currentAccountsReady
  ){

    setPageMessage(

      accounts.some(

        account =>
        account.agent_edit_locked
        ===
        false

      )
      ?
      '代理收款方式正在开放修改，请等代理重新保存并锁定后再支付佣金。'
      :
      '代理尚未绑定收款方式，不能支付佣金。',

      'err'

    );


    return;

  }


  /*
    正常情况下 confirmed 金额进入时
    已经自动生成 settlement。

    没有 settlement_id 时绝不能先上传凭证，
    避免形成无法关联的孤立文件。
  */
  if(
    !row.settlement_id
  ){

    setPageMessage(
      '代理佣金结算尚未准备完成，请刷新页面后再试。',
      'err'
    );

    return;

  }


  let note =
  window.prompt(

    '请输入本次真实付款备注，例如：'
    +
    'KPay 已转账 / 银行转账 / 交易编号：',

    ''

  );


  if(note === null){
    return;
  }


  note =
  note.trim();


  if(!note){

    setPageMessage(
      '必须填写本次佣金付款备注。',
      'err'
    );

    return;

  }


  const file =
  await pickCommissionProof();


  if(!file){

    setPageMessage(
      '必须选择本次佣金付款凭证截图。',
      'err'
    );

    return;

  }


  const confirmed =
  window.confirm(

    '请再次确认现实中已经向代理完成付款。'
    +
    '\n\n代理：'
    +
    (
      agent.display_name
      ||
      '代理'
    )
    +
    '\n期数：'
    +
    (
      row.round_date
      ||
      ''
    )
    +
    ' · '
    +
    periodName(
      row.round_code
    )
    +
    '\n实际支付佣金：'
    +
    money(
      remaining
    )
    +
    '\n付款备注：'
    +
    note
    +
    '\n付款凭证：'
    +
    (
      file.name
      ||
      '已选择'
    )
    +
    '\n\n确认后会生成永久佣金付款记录，不能重复支付。'

  );


  if(!confirmed){
    return;
  }


  busy =
  true;


  let proofStoragePath =
  null;


  setPageMessage(
    '正在上传凭证并登记佣金付款...'
  );


  try{

    proofStoragePath =
    await uploadCommissionProof(
      row.settlement_id,
      file
    );


    const response =
    await api(

      '/rest/v1/rpc/admin_record_agent_referral_commission_payment',

      {

        method:
        'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_round_id:
          roundId,

          p_agent_id:
          agentId,

          p_admin_note:
          note,

          p_proof_storage_path:
          proofStoragePath

        })

      }

    );


    const data =
    await parseResponse(
      response
    );


    await loadAll(
      false
    );


    setPageMessage(

      '代理佣金付款已保存'
      +
      ' · 金额 '
      +
      money(
        data?.commission_paid
        ||
        remaining
      ),

      'ok'

    );

  }
  catch(error){

    if(proofStoragePath){

      await deleteCommissionProof(
        proofStoragePath
      );

    }


    console.error(
      error
    );


    setPageMessage(

      '佣金付款失败：'
      +
      translateError(
        error.message
      ),

      'err'

    );

  }
  finally{

    busy =
    false;

  }

}


/* =====================================
   MESSAGE / ERROR
===================================== */

function setMsg(
  element,
  text,
  type=''
){

  element.textContent =
  text;


  element.className =
  'msg'
  +
  (
    type
    ?
    ' '
    +
    type
    :
    ''
  );

}


function setPageMessage(
  text,
  type=''
){

  setMsg(
    document.getElementById(
      'pageMsg'
    ),
    text,
    type
  );

}


function translateError(message){

  const text =
  String(
    message
    ||
    ''
  );


  if(
    text.includes(
      'ADMIN_AAL2_REQUIRED'
    )
    ||
    text.includes(
      'NOT_ADMIN'
    )
  ){

    return '管理员二次验证已失效，请返回管理中心重新验证。';

  }


  if(
    text.includes(
      'AGENT_PAYOUT_ACCOUNT_NOT_FOUND'
    )
  ){

    return '没有找到这个代理收款账户。';

  }


  if(
    text.includes(
      'ROUND_NOT_SETTLED'
    )
  ){

    return '本期尚未正式结算，不能支付代理佣金。';

  }


  if(
    text.includes(
      'NO_COMMISSION_DUE'
    )
  ){

    return '这笔记录目前没有需要支付的佣金。';

  }


  if(
    text.includes(
      'COMMISSION_SETTLEMENT_NOT_FOUND'
    )
  ){

    return '没有找到对应的代理佣金结算记录。';

  }


  if(
    text.includes(
      'AGENT_NOT_FOUND'
    )
  ){

    return '没有找到对应代理。';

  }

  if(
    text.includes(
      'PAYOUT_METHOD_REQUIRED'
    )
  ){

    return '代理尚未绑定有效收款方式，暂时不能支付佣金。';

  }


  if(
    text.includes(
      'COMMISSION_ALREADY_PAID'
    )
  ){

    return '这笔代理佣金已经支付，请刷新页面。';

  }


  if(
    text.includes(
      'COMMISSION_PAYMENT_NOTE_REQUIRED'
    )
  ){

    return '必须填写本次佣金付款备注。';

  }


  if(
    text.includes(
      'COMMISSION_PAYMENT_PROOF_REQUIRED'
    )
  ){

    return '必须上传本次佣金付款凭证。';

  }


  if(
    text.includes(
      'COMMISSION_PAYMENT_PROOF_PATH_INVALID'
    )
    ||
    text.includes(
      'COMMISSION_PAYMENT_PROOF_NOT_FOUND'
    )
  ){

    return '佣金付款凭证无效，请重新上传。';

  }


  if(
    text.includes(
      'COMMISSION_PAYMENT_PROOF_TYPE_INVALID'
    )
  ){

    return '佣金付款凭证只支持 JPG、PNG、WEBP、HEIC、HEIF 图片。';

  }


  if(
    text.includes(
      'COMMISSION_PAYMENT_PROOF_TOO_LARGE'
    )
  ){

    return '佣金付款凭证不能超过 10MB。';

  }


  if(
    text.includes(
      'COMMISSION_PAYMENT_PROOF_UPLOAD_FAILED'
    )
  ){

    return '佣金付款凭证上传失败，请重新尝试。';

  }
  return (
    text
    ||
    '操作失败，请重新尝试。'
  );

}
