<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">

<title>金满堂 · 期数管理</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#251907 0,#0d0c0a 38%,#070708 100%);
  color:#f7f0df;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.wrap{
  max-width:620px;
  margin:auto;
  min-height:100vh;
  padding:20px 14px 50px
}

.brand{
  text-align:center;
  margin-bottom:20px
}

.mark{
  width:60px;
  height:60px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 9px;
  font-size:22px;
  font-weight:900;
  color:#f4d77d;
  border:1px solid #b98a2c;
  background:#191208
}

.cn{
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  color:#f1d47b
}

.en{
  margin-top:4px;
  font-size:10px;
  color:#998b68;
  letter-spacing:2px
}

.card{
  background:linear-gradient(180deg,#151515,#0d0d0e);
  border:1px solid rgba(214,168,63,.3);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px
}

.title{
  font-size:14px;
  font-weight:900;
  color:#dec372;
  margin-bottom:14px
}

.hidden{display:none}

input,select{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid rgba(214,168,63,.25);
  background:#101011;
  color:#fff;
  outline:none;
  font-size:15px
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  margin-top:10px;
  font-weight:900;
  font-size:14px;
  background:linear-gradient(180deg,#efd47c,#b87e1e);
  color:#171109;
  cursor:pointer
}

.secondary{
  background:#171718;
  color:#dac477;
  border:1px solid rgba(214,168,63,.23)
}

.row2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.numberGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.numBox{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:11px;
  padding:10px
}

.numLabel{
  font-size:18px;
  font-weight:900;
  color:#dec16a;
  margin-bottom:7px
}

.numBox input{
  padding:10px;
  font-size:14px
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.sum{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
  padding:14px
}

.sum small{
  display:block;
  color:#817b71;
  font-size:10px;
  margin-bottom:6px
}

.sum strong{
  font-size:21px;
  color:#e7cb74
}

.result{
  margin-top:14px;
  background:#101011;
  border-radius:14px;
  padding:15px
}

.line{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px
}

.line:last-child{
  border-bottom:0
}

.line span{
  color:#918b80
}

.line strong{
  color:#f0dca0;
  text-align:right
}

.good{
  color:#6ed19a!important
}

.bad{
  color:#e68989!important
}

.note{
  color:#777166;
  font-size:11px;
  line-height:1.6;
  margin-top:10px
}

.msg{
  text-align:center;
  color:#9c9485;
  font-size:12px;
  min-height:18px;
  margin-top:10px
}

.foot{
  text-align:center;
  color:#6f6a61;
  font-size:10px;
  margin-top:22px
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="mark">金</div>
    <div class="cn">金满堂</div>
    <div class="en">ROUND MANAGEMENT</div>
  </div>


  <div class="card" id="loginBox">

    <div class="title">
      管理员登录
    </div>

    <input
      id="email"
      type="email"
      placeholder="管理员邮箱"
    >

    <div style="height:9px"></div>

    <input
      id="password"
      type="password"
      placeholder="管理员密码"
    >

    <button onclick="signIn()">
      登录
    </button>

    <div class="msg" id="loginMsg"></div>

  </div>


  <div id="appBox" class="hidden">


    <div class="card">

      <div class="title">
        本期设置
      </div>

      <div class="row2">

        <select id="roundType">
          <option value="1030">
            上午期 · 10:30
          </option>

          <option value="1530">
            下午期 · 15:30
          </option>
        </select>


        <select id="agentRate">
          <option value="20">代理 20%</option>
          <option value="21">代理 21%</option>
          <option value="22">代理 22%</option>
          <option value="23">代理 23%</option>
          <option value="24">代理 24%</option>
          <option value="25">代理 25%</option>
        </select>

      </div>

    </div>


    <div class="card">

      <div class="title">
        00–99 本期积分
      </div>

      <div
        class="numberGrid"
        id="numberGrid">
      </div>

      <button onclick="calculateSummary()">
        计算本期
      </button>

      <button
        class="secondary"
        onclick="saveDraft()">
        保存草稿
      </button>

      <button
        class="secondary"
        onclick="loadDraft()">
        读取草稿
      </button>

      <button
        class="secondary"
        onclick="clearAll()">
        清空
      </button>

    </div>


    <div class="card">

      <div class="title">
        本期概况
      </div>

      <div class="summary">

        <div class="sum">
          <small>本期总积分</small>
          <strong id="total">0</strong>
        </div>

        <div class="sum">
          <small>代理比例</small>
          <strong id="rate">20%</strong>
        </div>

        <div class="sum">
          <small>最高单号积分</small>
          <strong id="highest">0</strong>
        </div>

        <div class="sum">
          <small>最大80×奖励</small>
          <strong id="maxPayout">0</strong>
        </div>

      </div>

    </div>


    <div class="card">

      <div class="title">
        独立结果结算
      </div>

      <input
        id="winningNumber"
        inputmode="numeric"
        maxlength="2"
        placeholder="输入结果号码 00–99"
      >

      <button onclick="settle()">
        计算结果
      </button>


      <div class="result">

        <div class="line">
          <span>结果号码</span>
          <strong id="rNumber">—</strong>
        </div>

        <div class="line">
          <span>该号码积分</span>
          <strong id="rStake">0</strong>
        </div>

        <div class="line">
          <span>玩家 80× 应得</span>
          <strong id="rPlayer">0</strong>
        </div>

        <div class="line">
          <span>代理应得</span>
          <strong id="rAgent">0</strong>
        </div>

        <div class="line">
          <span>平台最后余额</span>
          <strong id="rPlatform">0</strong>
        </div>

        <div class="line">
          <span>平台需额外准备</span>
          <strong id="rNeed">0</strong>
        </div>

      </div>

      <div class="note">
        玩家奖励固定按该号码积分 × 80 计算。
        代理积分按未中奖积分 × 当前代理比例计算。
        如果平台余额不足，会直接显示需要补多少。
      </div>

    </div>


    <div class="card">

      <button
        class="secondary"
        onclick="location.href='/admin/'">
        ← 返回 Admin 首页
      </button>

    </div>

  </div>


  <div class="foot">
    © 2022 JIN MANTANG
  </div>

</div>


<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';

const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';

let token =
sessionStorage.getItem('jmt_access_token') || '';


function buildGrid(){

  const grid =
  document.getElementById('numberGrid');

  grid.innerHTML = '';

  for(let i=0;i<=99;i++){

    const n =
    String(i).padStart(2,'0');

    const box =
    document.createElement('div');

    box.className =
    'numBox';

    box.innerHTML =
    `
    <div class="numLabel">${n}</div>

    <input
      id="n${n}"
      type="number"
      min="0"
      step="1"
      placeholder="0"
    >
    `;

    grid.appendChild(box);

  }

}


async function signIn(){

  const email =
  document.getElementById('email').value.trim();

  const password =
  document.getElementById('password').value;

  const msg =
  document.getElementById('loginMsg');


  if(!email || !password){

    msg.textContent =
    '请输入邮箱和密码';

    return;

  }


  msg.textContent =
  '正在登录...';


  try{

    const r =
    await fetch(
      BASE +
      '/auth/v1/token?grant_type=password',
      {
        method:'POST',

        headers:{
          apikey:KEY,
          'Content-Type':'application/json'
        },

        body:JSON.stringify({
          email,
          password
        })
      }
    );


    const d =
    await r.json();


    if(!r.ok || !d.access_token){
      throw new Error();
    }


    token =
    d.access_token;


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );


    showApp();


  }catch(e){

    msg.textContent =
    '登录失败，请检查邮箱和密码';

  }

}


function showApp(){

  document.getElementById(
    'loginBox'
  ).classList.add('hidden');


  document.getElementById(
    'appBox'
  ).classList.remove('hidden');

}


function valueOfNumber(n){

  const el =
  document.getElementById(
    'n' + n
  );


  if(!el){
    return 0;
  }


  const v =
  Number(el.value || 0);


  return isFinite(v) && v > 0
  ? v
  : 0;

}


function getTotal(){

  let total = 0;


  for(let i=0;i<=99;i++){

    const n =
    String(i).padStart(2,'0');

    total +=
    valueOfNumber(n);

  }


  return total;

}


function calculateSummary(){

  const total =
  getTotal();


  let highest = 0;


  for(let i=0;i<=99;i++){

    const n =
    String(i).padStart(2,'0');

    const v =
    valueOfNumber(n);


    if(v > highest){
      highest = v;
    }

  }


  const rate =
  document.getElementById(
    'agentRate'
  ).value;


  document.getElementById(
    'total'
  ).textContent =
  format(total);


  document.getElementById(
    'rate'
  ).textContent =
  rate + '%';


  document.getElementById(
    'highest'
  ).textContent =
  format(highest);


  document.getElementById(
    'maxPayout'
  ).textContent =
  format(highest * 80);

}


function settle(){

  const raw =
  document.getElementById(
    'winningNumber'
  ).value.trim();


  if(!/^\d{1,2}$/.test(raw)){

    alert('请输入 00–99');

    return;

  }


  const number =
  String(
    Number(raw)
  ).padStart(2,'0');


  const num =
  Number(number);


  if(num < 0 || num > 99){

    alert('请输入 00–99');

    return;

  }


  const total =
  getTotal();


  const stake =
  valueOfNumber(number);


  const player =
  stake * 80;


  const losing =
  Math.max(
    total - stake,
    0
  );


  const rate =
  Number(
    document.getElementById(
      'agentRate'
    ).value
  ) / 100;


  const agent =
  losing * rate;


  const platform =
  total - player - agent;


  const need =
  Math.max(
    -platform,
    0
  );


  document.getElementById(
    'rNumber'
  ).textContent =
  number;


  document.getElementById(
    'rStake'
  ).textContent =
  format(stake);


  document.getElementById(
    'rPlayer'
  ).textContent =
  format(player);


  document.getElementById(
    'rAgent'
  ).textContent =
  format(agent);


  const platformEl =
  document.getElementById(
    'rPlatform'
  );


  platformEl.textContent =
  format(platform);


  platformEl.className =
  platform >= 0
  ? 'good'
  : 'bad';


  const needEl =
  document.getElementById(
    'rNeed'
  );


  needEl.textContent =
  format(need);


  needEl.className =
  need > 0
  ? 'bad'
  : 'good';


  calculateSummary();

}


function saveDraft(){

  const data = {

    round:
    document.getElementById(
      'roundType'
    ).value,

    rate:
    document.getElementById(
      'agentRate'
    ).value,

    values:{}

  };


  for(let i=0;i<=99;i++){

    const n =
    String(i).padStart(2,'0');


    data.values[n] =
    document.getElementById(
      'n' + n
    ).value || '';

  }


  localStorage.setItem(
    'jmt_simple_round',
    JSON.stringify(data)
  );


  alert('草稿已保存');

}


function loadDraft(){

  const raw =
  localStorage.getItem(
    'jmt_simple_round'
  );


  if(!raw){

    alert('没有保存的草稿');

    return;

  }


  try{

    const data =
    JSON.parse(raw);


    document.getElementById(
      'roundType'
    ).value =
    data.round || '1030';


    document.getElementById(
      'agentRate'
    ).value =
    data.rate || '20';


    for(let i=0;i<=99;i++){

      const n =
      String(i).padStart(2,'0');


      document.getElementById(
        'n' + n
      ).value =
      data.values &&
      data.values[n]
      ? data.values[n]
      : '';

    }


    calculateSummary();


    alert('草稿已读取');


  }catch(e){

    alert('草稿读取失败');

  }

}


function clearAll(){

  if(!confirm('确定全部清空吗？')){
    return;
  }


  for(let i=0;i<=99;i++){

    const n =
    String(i).padStart(2,'0');


    document.getElementById(
      'n' + n
    ).value =
    '';

  }


  document.getElementById(
    'winningNumber'
  ).value =
  '';


  calculateSummary();

}


function format(v){

  return Number(v).toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


buildGrid();


document.getElementById(
  'agentRate'
).addEventListener(
  'change',
  calculateSummary
);


if(token){
  showApp();
}

</script>

</body>
</html>
