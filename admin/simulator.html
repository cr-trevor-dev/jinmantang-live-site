<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1">

<meta
  name="theme-color"
  content="#09090a">

<title>金满堂 · 本期汇总</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;

  background:
  radial-gradient(
    circle at top,
    #251907 0,
    #0d0c0a 40%,
    #070708 100%
  );

  color:#f5edd9;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Arial,
  sans-serif;
}


.wrap{
  max-width:850px;
  margin:auto;
  padding:22px 14px 60px;
}


.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}


.logoTitle{
  color:#efd477;
  font-size:22px;
  font-weight:900;
}


.sub{
  color:#827966;
  font-size:10px;
  letter-spacing:2px;
  margin-top:4px;
}


.card{
  background:
  linear-gradient(
    180deg,
    #151515,
    #0d0d0e
  );

  border:
  1px solid
  rgba(214,168,63,.28);

  border-radius:20px;

  padding:17px;

  margin-bottom:14px;
}


.title{
  color:#dfc575;
  font-size:15px;
  font-weight:900;
  margin-bottom:14px;
}


button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  font-weight:900;
  cursor:pointer;
}


.dark{
  background:#181819;
  color:#dbc67d;

  border:
  1px solid
  rgba(214,168,63,.22);
}


.gold{
  background:
  linear-gradient(
    180deg,
    #efd47c,
    #b87e1e
  );

  color:#161008;
}


.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}


.stat{
  background:#101011;

  border:
  1px solid
  rgba(255,255,255,.06);

  border-radius:13px;

  padding:13px;
}


.stat small{
  display:block;
  color:#817a6d;
  font-size:10px;
  margin-bottom:6px;
}


.stat strong{
  color:#ebcd72;
  font-size:19px;
  line-height:1.25;
}


.green{
  color:#71d49d !important;
}


.roundInfo{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}


.infoBox{
  background:#101011;

  border:
  1px solid
  rgba(255,255,255,.06);

  border-radius:13px;

  padding:13px;
}


.infoBox small{
  display:block;
  color:#817a6d;
  font-size:10px;
  margin-bottom:6px;
}


.infoBox strong{
  color:#e9cd78;
  font-size:14px;
  line-height:1.5;
}


.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}


.num{
  background:#101011;

  border:
  1px solid
  rgba(255,255,255,.06);

  border-radius:13px;

  padding:13px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;
}


.code{
  color:#e7c96d;
  font-size:18px;
  font-weight:900;
}


.amount{
  color:#eee5cf;
  font-size:15px;
  font-weight:800;
}


.nonzero{
  border-color:
  rgba(214,168,63,.38);

  background:#15130e;
}


.nonzero .amount{
  color:#f0d47e;
}


/* AGENT */

.agent{
  background:#101011;

  border:
  1px solid
  rgba(255,255,255,.06);

  border-radius:14px;

  padding:14px;

  margin-bottom:9px;
}


.agentTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}


.agentName{
  color:#efd278;
  font-size:16px;
  font-weight:900;
}


.rate{
  color:#8f8778;
  font-size:11px;
  margin-top:4px;
}


.badge{
  background:#153124;
  color:#77d69e;

  font-size:11px;

  padding:5px 9px;

  border-radius:20px;
}


.agentStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:11px;
}


.agentStat{
  background:#151516;
  border-radius:10px;
  padding:11px;
}


.agentStat small{
  display:block;
  color:#777166;
  font-size:9px;
  margin-bottom:5px;
}


.agentStat strong{
  color:#e6cf86;
  font-size:14px;
}


.detailButton{
  width:100%;
  margin-top:10px;
}


.agentDetail{
  display:none;

  margin-top:12px;

  padding-top:12px;

  border-top:
  1px solid
  rgba(255,255,255,.07);
}


.agentDetail.open{
  display:block;
}


.detailTitle{
  font-size:12px;
  color:#cdb66c;
  font-weight:900;
  margin-bottom:10px;
}


.detailGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}


.detailNum{
  background:#171718;

  border:
  1px solid
  rgba(255,255,255,.05);

  border-radius:10px;

  padding:10px;

  display:flex;

  justify-content:space-between;

  align-items:center;
}


.detailNum.active{
  border-color:
  rgba(214,168,63,.34);

  background:#1a170f;
}


.detailNum span:first-child{
  color:#dfc36d;
  font-weight:900;
}


.detailNum span:last-child{
  color:#e8dfc9;
  font-size:12px;
  font-weight:800;
}


.msg{
  min-height:18px;
  text-align:center;
  color:#9d9586;
  font-size:12px;
  margin-top:10px;
}


.empty{
  text-align:center;
  color:#777166;
  font-size:13px;
  padding:25px 10px;
}


.refreshRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}


.note{
  color:#766f62;
  font-size:10px;
  line-height:1.6;
  margin-top:10px;
}


.foot{
  text-align:center;
  color:#6f6a61;
  font-size:10px;
  margin-top:25px;
}


@media(max-width:600px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

}

</style>

</head>


<body>

<div class="wrap">


  <div class="header">

    <div>

      <div class="logoTitle">
        金满堂 · 本期汇总
      </div>

      <div class="sub">
        ADMIN / ROUND SUMMARY
      </div>

    </div>


    <button
      class="dark"
      onclick="location.href='/admin/'">

      返回总后台

    </button>

  </div>



  <!-- 当前期数 -->

  <div class="card">

    <div class="title">
      当前期数
    </div>


    <div class="roundInfo">


      <div class="infoBox">

        <small>
          期数
        </small>

        <strong id="roundName">
          正在读取...
        </strong>

      </div>


      <div class="infoBox">

        <small>
          状态
        </small>

        <strong
          id="roundStatus"
          class="green">

          —

        </strong>

      </div>


      <div class="infoBox">

        <small>
          截止时间
        </small>

        <strong id="deadlineText">
          —
        </strong>

      </div>


      <div class="infoBox">

        <small>
          Myanmar Time
        </small>

        <strong id="mmtClock">
          —
        </strong>

      </div>


    </div>

  </div>



  <!-- 总体数据 -->

  <div class="card">

    <div class="title">
      本期数据
    </div>


    <div class="stats">


      <div class="stat">

        <small>
          提交总积分
        </small>

        <strong id="grandTotal">
          0
        </strong>

      </div>


      <div class="stat">

        <small>
          已提交代理
        </small>

        <strong id="agentCount">
          0
        </strong>

      </div>


      <div class="stat">

        <small>
          有数据号码
        </small>

        <strong id="activeNumbers">
          0
        </strong>

      </div>


      <div class="stat">

        <small>
          最后刷新
        </small>

        <strong
          id="lastRefresh"
          style="font-size:13px">

          —

        </strong>

      </div>


    </div>


    <div
      class="refreshRow"
      style="margin-top:12px">


      <button
        class="gold"
        onclick="loadAll()">

        刷新本期数据

      </button>


      <button
        class="dark"
        onclick="location.href='/admin/agents/'">

        查看代理管理

      </button>


    </div>


    <div
      class="msg"
      id="mainMsg">
    </div>


    <div class="note">

      页面每 20 秒自动刷新一次。
      所有数据来自代理已提交的本期积分。

    </div>

  </div>



  <!-- 总汇总 -->

  <div class="card">

    <div class="title">
      00–99 本期总汇总
    </div>


    <div
      class="grid"
      id="numberGrid">
    </div>

  </div>



  <!-- AGENT LIST -->

  <div class="card">

    <div class="title">
      本期代理提交
    </div>


    <div id="agentList">

      <div class="empty">
        正在读取...
      </div>

    </div>

  </div>



  <div class="card">

    <button
      class="dark"
      style="width:100%"
      onclick="location.href='/admin/'">

      ← 返回 Admin 总后台

    </button>

  </div>


  <div class="foot">

    © 2022 JIN MANTANG · ROUND SUMMARY

  </div>


</div>



<script>


const BASE =
'https://veserwfjxglxieehfggy.supabase.co';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =

localStorage.getItem(
  'jmt_access_token'
)

||

sessionStorage.getItem(
  'jmt_access_token'
)

||

'';


let currentRound = null;

let agents = [];

let submissions = [];



/* API */

async function api(
  path,
  options={}
){

  return fetch(

    BASE + path,

    {

      ...options,

      headers:{

        apikey:KEY,

        Authorization:
        'Bearer ' + token,

        ...(options.headers || {})

      }

    }

  );

}



/* BUILD TOTAL GRID */

function buildNumberGrid(){

  const box =
  document.getElementById(
    'numberGrid'
  );


  box.innerHTML = '';


  for(
    let i=0;
    i<=99;
    i++
  ){

    const n =
    String(i)
    .padStart(
      2,
      '0'
    );


    const div =
    document.createElement(
      'div'
    );


    div.className =
    'num';


    div.id =
    'numBox' + n;


    div.innerHTML = `

      <div class="code">
        ${n}
      </div>

      <div
        class="amount"
        id="num${n}">

        0

      </div>

    `;


    box.appendChild(
      div
    );

  }

}



/* VERIFY ADMIN */

async function verifyAdmin(){

  if(!token){

    location.href =
    '/admin/';

    return false;

  }


  try{

    const r =
    await api(
      '/auth/v1/user'
    );


    if(!r.ok){

      throw new Error();

    }


    return true;


  }catch(e){

    localStorage.removeItem(
      'jmt_access_token'
    );

    sessionStorage.removeItem(
      'jmt_access_token'
    );


    location.href =
    '/admin/';


    return false;

  }

}



/* LOAD ROUND */

async function loadRound(){

  const r =
  await api(

    '/rest/v1/rounds' +

    '?select=id,round_date,round_code,deadline_at,result_number,status,created_at' +

    '&order=created_at.desc' +

    '&limit=20'

  );


  if(!r.ok){

    throw new Error(
      '无法读取当前期'
    );

  }


  const rows =
  await r.json();


  if(!rows.length){

    currentRound =
    null;

    return;

  }


  currentRound =

  rows.find(
    x =>
    x.status === 'open'
  )

  ||

  rows[0];


  renderRound();

}



/* RENDER ROUND */

function renderRound(){

  if(!currentRound){

    document.getElementById(
      'roundName'
    ).textContent =
    '暂无期数';


    document.getElementById(
      'roundStatus'
    ).textContent =
    '—';


    document.getElementById(
      'deadlineText'
    ).textContent =
    '—';


    return;

  }


  const sessionName =

  currentRound.round_code === '1530'

  ? '下午 15:30'

  :

  currentRound.round_code === '1030'

  ? '上午 10:30'

  :

  currentRound.round_code;



  document.getElementById(
    'roundName'
  ).textContent =

  currentRound.round_date
  +
  ' · '
  +
  sessionName;



  document.getElementById(
    'roundStatus'
  ).textContent =

  currentRound.status === 'open'

  ? '开放中'

  :

  currentRound.status === 'settled'

  ? '已结算'

  :

  '已关闭';



  document.getElementById(
    'deadlineText'
  ).textContent =

  formatMMT(
    currentRound.deadline_at
  );

}



/* LOAD AGENTS */

async function loadAgents(){

  const r =
  await api(

    '/rest/v1/agents' +

    '?select=id,display_name,commission_rate,status,created_at'

  );


  if(!r.ok){

    throw new Error(
      '无法读取代理'
    );

  }


  agents =
  await r.json();

}



/* LOAD SUBMISSIONS */

async function loadSubmissions(){

  if(!currentRound){

    submissions = [];

    return;

  }


  const r =
  await api(

    '/rest/v1/agent_submissions' +

    '?round_id=eq.' +

    encodeURIComponent(
      currentRound.id
    )

    +

    '&select=agent_id,number_code,points,submitted_at,updated_at'

  );


  if(!r.ok){

    throw new Error(
      '无法读取代理提交'
    );

  }


  submissions =
  await r.json();

}



/* CALCULATE */

function calculate(){

  const totals = {};

  const agentMap = {};


  for(
    let i=0;
    i<=99;
    i++
  ){

    totals[
      String(i)
      .padStart(
        2,
        '0'
      )
    ] = 0;

  }



  submissions.forEach(
    row => {

      const code =
      String(
        row.number_code
      ).padStart(
        2,
        '0'
      );


      const points =
      Number(
        row.points || 0
      );


      if(
        Object.prototype
        .hasOwnProperty
        .call(
          totals,
          code
        )
      ){

        totals[code] +=
        points;

      }



      if(
        !agentMap[
          row.agent_id
        ]
      ){

        agentMap[
          row.agent_id
        ] = {

          total:0,

          lastTime:
          row.updated_at
          ||
          row.submitted_at,

          numbers:{}

        };


        for(
          let i=0;
          i<=99;
          i++
        ){

          agentMap[
            row.agent_id
          ].numbers[
            String(i)
            .padStart(
              2,
              '0'
            )
          ] = 0;

        }

      }


      agentMap[
        row.agent_id
      ].total +=
      points;


      agentMap[
        row.agent_id
      ].numbers[
        code
      ] +=
      points;


      const thisTime =
      row.updated_at
      ||
      row.submitted_at;


      if(
        thisTime
        &&
        (
          !agentMap[
            row.agent_id
          ].lastTime

          ||

          new Date(
            thisTime
          )
          >
          new Date(
            agentMap[
              row.agent_id
            ].lastTime
          )
        )
      ){

        agentMap[
          row.agent_id
        ].lastTime =
        thisTime;

      }

    }

  );


  renderTotals(
    totals,
    agentMap
  );

}



/* RENDER TOTALS */

function renderTotals(
  totals,
  agentMap
){

  let grandTotal = 0;

  let activeNumbers = 0;


  Object.entries(
    totals
  )
  .forEach(
    ([code,value]) => {

      grandTotal +=
      Number(value);


      if(
        Number(value) > 0
      ){

        activeNumbers++;

      }


      const el =
      document.getElementById(
        'num' + code
      );


      const box =
      document.getElementById(
        'numBox' + code
      );


      if(el){

        el.textContent =
        formatNumber(
          value
        );

      }


      if(box){

        box.classList.toggle(
          'nonzero',
          Number(value) > 0
        );

      }

    }

  );


  const submittedAgentIds =

  Object.keys(
    agentMap
  )

  .filter(
    id =>
    Number(
      agentMap[id].total
    ) > 0
  );


  document.getElementById(
    'grandTotal'
  ).textContent =
  formatNumber(
    grandTotal
  );


  document.getElementById(
    'agentCount'
  ).textContent =
  submittedAgentIds.length;


  document.getElementById(
    'activeNumbers'
  ).textContent =
  activeNumbers;


  renderAgents(
    agentMap
  );

}



/* RENDER AGENTS */

function renderAgents(
  agentMap
){

  const box =
  document.getElementById(
    'agentList'
  );


  const list =

  agents

  .map(
    a => ({

      ...a,

      roundData:
      agentMap[a.id]

    })
  )

  .filter(
    a =>
    a.roundData
    &&
    Number(
      a.roundData.total
    ) > 0
  )

  .sort(
    (a,b) =>

    Number(
      b.roundData.total
    )

    -

    Number(
      a.roundData.total
    )

  );



  if(!list.length){

    box.innerHTML =

    '<div class="empty">' +

    '本期暂时没有代理提交' +

    '</div>';

    return;

  }



  box.innerHTML =

  list.map(
    a => {


      const rate =
      Number(
        a.commission_rate || 0
      );


      const total =
      Number(
        a.roundData.total || 0
      );


      const detailHtml =

      Object.entries(
        a.roundData.numbers
      )

      .map(
        ([code,value]) => {

          const active =
          Number(value) > 0

          ? ' active'

          : '';


          return `

          <div class="detailNum${active}">

            <span>
              ${code}
            </span>

            <span>
              ${formatNumber(value)}
            </span>

          </div>

          `;

        }

      )
      .join('');



      return `

      <div class="agent">


        <div class="agentTop">


          <div>

            <div class="agentName">

              ${escapeHtml(
                a.display_name
                ||
                '未命名代理'
              )}

            </div>


            <div class="rate">

              代理比例：
              ${rate}%

            </div>

          </div>


          <div class="badge">

            已提交

          </div>


        </div>



        <div class="agentStats">


          <div class="agentStat">

            <small>
              本期提交总积分
            </small>

            <strong>

              ${formatNumber(
                total
              )}

            </strong>

          </div>


          <div class="agentStat">

            <small>
              最后提交时间
            </small>

            <strong>

              ${
                a.roundData.lastTime

                ?

                formatMMT(
                  a.roundData.lastTime
                )

                :

                '—'
              }

            </strong>

          </div>


        </div>



        <button
          class="dark detailButton"
          onclick="toggleAgentDetail('${a.id}',this)">

          查看 00–99 明细

        </button>



        <div
          class="agentDetail"
          id="detail-${a.id}">


          <div class="detailTitle">

            ${escapeHtml(
              a.display_name
              ||
              '未命名代理'
            )}

            · 本期 00–99 明细

          </div>


          <div class="detailGrid">

            ${detailHtml}

          </div>


        </div>


      </div>

      `;

    }

  ).join('');

}



/* OPEN/CLOSE DETAIL */

function toggleAgentDetail(
  agentId,
  button
){

  const detail =
  document.getElementById(
    'detail-' + agentId
  );


  if(!detail){
    return;
  }


  const isOpen =
  detail.classList.contains(
    'open'
  );


  detail.classList.toggle(
    'open',
    !isOpen
  );


  button.textContent =

  isOpen

  ? '查看 00–99 明细'

  : '收起 00–99 明细';

}



/* LOAD ALL */

async function loadAll(){

  const msg =
  document.getElementById(
    'mainMsg'
  );


  msg.textContent =
  '正在读取最新数据...';


  try{

    const ok =
    await verifyAdmin();


    if(!ok){
      return;
    }


    await loadRound();

    await loadAgents();

    await loadSubmissions();


    calculate();


    document.getElementById(
      'lastRefresh'
    ).textContent =

    new Intl
    .DateTimeFormat(
      'zh-CN',
      {

        timeZone:
        'Asia/Yangon',

        hour:'2-digit',

        minute:'2-digit',

        second:'2-digit',

        hour12:false

      }
    )
    .format(
      new Date()
    );


    msg.textContent =
    '✓ 已更新';


    setTimeout(
      () => {

        if(
          msg.textContent ===
          '✓ 已更新'
        ){

          msg.textContent =
          '';

        }

      },
      1800
    );


  }catch(e){

    msg.textContent =
    e.message
    ||
    '读取失败';

  }

}



/* TIME */

function formatMMT(
  value
){

  if(!value){
    return '—';
  }


  return new Intl
  .DateTimeFormat(
    'zh-CN',
    {

      timeZone:
      'Asia/Yangon',

      year:'numeric',

      month:'2-digit',

      day:'2-digit',

      hour:'2-digit',

      minute:'2-digit',

      second:'2-digit',

      hour12:false

    }
  )
  .format(
    new Date(
      value
    )
  )

  +

  ' MMT';

}



function updateClock(){

  document.getElementById(
    'mmtClock'
  ).textContent =

  new Intl
  .DateTimeFormat(
    'zh-CN',
    {

      timeZone:
      'Asia/Yangon',

      hour:'2-digit',

      minute:'2-digit',

      second:'2-digit',

      hour12:false

    }
  )
  .format(

  );

}



/* FORMAT */

function formatNumber(
  value
){

  return Number(
    value || 0
  )
  .toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}



function escapeHtml(
  text
){

  return String(
    text
  )

  .replaceAll('&','&amp;')

  .replaceAll('<','&lt;')

  .replaceAll('>','&gt;')

  .replaceAll('"','&quot;')

  .replaceAll("'","&#039;");

}

);


loadAll();


setInterval(
  loadAll,
  20000
);
