<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let rows =
[];


let refreshPromise =
null;


const ZODIACS =
[
  '鼠',
  '牛',
  '虎',
  '兔',
  '龙',
  '蛇',
  '马',
  '羊',
  '猴',
  '鸡',
  '狗',
  '猪'
];


function money(value){

  return new Intl.NumberFormat(
    'en-US',
    {
      maximumFractionDigits:0
    }
  )
  .format(
    Number(
      value
      ||
      0
    )
  );

}


function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function zodiacName(code){

  return (
    ZODIACS[
      Number(
        code
        ||
        0
      )
      -
      1
    ]
    ||
    '—'
  );

}


function periodName(code){

  if(code === '1030'){
    return '上午 11:45';
  }

  if(code === '1530'){
    return '下午 3:45';
  }

  return code || '—';

}


function jwt(){

  try{

    let p =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');

    while(
      p.length % 4
    ){
      p += '=';
    }

    return JSON.parse(
      decodeURIComponent(
        atob(p)
        .split('')
        .map(
          c =>
          '%'
          +
          (
            '00'
            +
            c
            .charCodeAt(0)
            .toString(16)
          )
          .slice(-2)
        )
        .join('')
      )
    );

  }
  catch{

    return {};

  }

}


async function refreshSession(){

  if(!refreshToken){
    return false;
  }

  if(refreshPromise){
    return refreshPromise;
  }

  refreshPromise =
  (
    async()=>{

      try{

        const res =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:'POST',

            headers:{

              apikey:
              KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(!res.ok){
          return false;
        }


        const data =
        await res.json();


        if(!data.access_token){
          return false;
        }


        token =
        data.access_token;


        localStorage.setItem(
          'jmt_access_token',
          token
        );


        sessionStorage.setItem(
          'jmt_access_token',
          token
        );


        if(data.refresh_token){

          refreshToken =
          data.refresh_token;


          localStorage.setItem(
            'jmt_refresh_token',
            refreshToken
          );


          sessionStorage.setItem(
            'jmt_refresh_token',
            refreshToken
          );

        }


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:
        KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let res =
  await request();


  if(
    res.status
    !==
    401
  ){
    return res;
  }


  if(
    !await refreshSession()
  ){
    return res;
  }


  return request();

}


async function verifyAdmin(){

  if(!token){
    return false;
  }


  if(
    jwt().aal
    !==
    'aal2'
  ){
    return false;
  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){
      return false;
    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(!adminRes.ok){
      return false;
    }


    const data =
    await adminRes.json();


    return (
      Array.isArray(data)
      &&
      data.length > 0
    );

  }
  catch{

    return false;

  }

}


async function parseResponse(res){

  const text =
  await res.text();


  let data =
  null;


  try{

    data =
    text
    ?
    JSON.parse(text)
    :
    null;

  }
  catch{

    data =
    text;

  }


  if(!res.ok){

    throw new Error(

      data?.message
      ||
      data?.error
      ||
      text
      ||
      'REQUEST_FAILED'

    );

  }


  return data;

}


function statusText(status){

  if(status === 'paid'){
    return '已派彩';
  }

  if(status === 'partial'){
    return '部分派彩';
  }

  return '待派彩';

}


function payoutTransactionsHtml(row){
  const transactions = Array.isArray(row.transactions)
    ? row.transactions
    : [];

  if(!transactions.length){
    return '';
  }

  return `
    <div class="account">
      <strong>派彩交易记录</strong>
      <br><br>

      ${transactions.map(transaction => {
        const time = transaction.paid_at
          ? new Date(transaction.paid_at).toLocaleString('zh-CN')
          : '—';

        return `
          <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)">
            <div class="row">
              <span>本次派彩</span>
              <strong>${money(transaction.amount)}</strong>
            </div>

            <div class="row">
              <span>派彩时间</span>
              <strong>${esc(time)}</strong>
            </div>

            <div class="row">
              <span>派彩备注</span>
              <strong>${esc(transaction.admin_note || '—')}</strong>
            </div>

            ${
              transaction.proof_storage_path
              ? `
                <button
                  type="button"
                  style="margin-top:9px;padding:10px;background:#17140d;color:#d8bf73;border:1px solid rgba(214,168,63,.22)"
                  onclick="viewPayoutProof('${esc(transaction.proof_storage_path)}')">
                  查看派彩凭证
                </button>
              `
              : ''
            }
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function payoutAccountMethodName(account){

  if(
    account?.method_type
    ===
    'kpay'
  ){
    return 'KPay';
  }


  if(
    account?.method_type
    ===
    'bank'
  ){
    return (
      account.bank_name
      ||
      '银行账户'
    );
  }


  return (
    account?.method_type
    ||
    '收款账户'
  );

}


function currentPayoutAccountsHtml(row){

  const snapshotReady =
  Boolean(
    row.payout_method_type_snapshot
    &&
    row.payout_account_name_snapshot
    &&
    row.payout_account_number_snapshot
  );


  /*
    已经发生过首次派彩并锁定快照的历史记录，
    永远优先显示当时真正使用的账户。
    不使用客户后来修改的新账户覆盖历史。
  */
  if(snapshotReady){

    return `
      <div class="account">

        <strong>
          本期已锁定收款账户
        </strong>

        <br><br>

        收款方式：
        ${esc(
          String(
            row.payout_method_type_snapshot
            ||
            ''
          )
          .toUpperCase()
          ||
          '—'
        )}

        <br>

        收款户名：
        ${esc(
          row.payout_account_name_snapshot
          ||
          '—'
        )}

        <br>

        收款账号：
        ${esc(
          row.payout_account_number_snapshot
          ||
          '—'
        )}

        ${
          row.payout_bank_name_snapshot
          ?
          '<br>银行：'
          +
          esc(
            row.payout_bank_name_snapshot
          )
          :
          ''
        }

        <br><br>

        <span style="
          color:#766f62;
          font-size:10px;
        ">
          此账户为本期派彩历史快照，不会因客户以后修改收款方式而改变。
        </span>

      </div>
    `;

  }


  const accounts =
  Array.isArray(
    row.current_payout_accounts
  )
  ?
  row.current_payout_accounts
  :
  [];


  if(!accounts.length){

    return `
      <div class="account">

        <strong>
          客户当前收款方式
        </strong>

        <br><br>

        当前没有查询到有效收款账户。

        <br><br>

        <span style="
          color:#d1ad5b;
          font-size:10px;
        ">
          请先让客户完成 KPay 或银行账户绑定，再进行实际派彩。
        </span>

      </div>
    `;

  }


  const ordered =
  [
    ...accounts
  ]
  .sort(
    (
      a,
      b
    )=>{

      const aPriority =
      a.method_type
      ===
      'kpay'
      ?
      0
      :
      1;

      const bPriority =
      b.method_type
      ===
      'kpay'
      ?
      0
      :
      1;


      if(
        aPriority
        !==
        bPriority
      ){
        return (
          aPriority
          -
          bPriority
        );
      }


      return String(
        a.created_at
        ||
        ''
      )
      .localeCompare(
        String(
          b.created_at
          ||
          ''
        )
      );

    }
  );


  const preferred =
  ordered[0];


  return `
    <div class="account">

      <strong>
        客户当前已绑定收款方式
      </strong>

      <br><br>

      ${
        ordered
        .map(
          account=>`

            <div style="
              padding:9px 0;
              border-bottom:
              1px solid
              rgba(255,255,255,.06);
            ">

              <div style="
                color:#e6cb79;
                font-weight:800;
              ">
                ${esc(
                  payoutAccountMethodName(
                    account
                  )
                )}

                ·

                ${
                  account.is_verified
                  ?
                  '已验证'
                  :
                  '待验证'
                }
              </div>

              <div style="
                margin-top:5px;
                color:#b3aa96;
              ">
                户名：
                ${esc(
                  account.account_name
                  ||
                  '—'
                )}
              </div>

              <div style="
                margin-top:3px;
                color:#b3aa96;
              ">
                账号：
                ${esc(
                  account.account_number
                  ||
                  '—'
                )}
              </div>

              ${
                account.bank_name
                ?
                `
                  <div style="
                    margin-top:3px;
                    color:#b3aa96;
                  ">
                    银行：
                    ${esc(
                      account.bank_name
                    )}
                  </div>
                `
                :
                ''
              }

            </div>

          `
        )
        .join('')
      }

      <div style="
        margin-top:10px;
        color:#8f8674;
        font-size:10px;
        line-height:1.65;
      ">

        本期目前尚未锁定派彩账户。

        首次真正登记派彩时，
        现有后台规则会优先使用：

        <strong style="color:#d8bf73">
          ${esc(
            payoutAccountMethodName(
              preferred
            )
          )}
          ·
          ${esc(
            preferred?.account_name
            ||
            '—'
          )}
          ·
          ${esc(
            preferred?.account_number
            ||
            '—'
          )}
        </strong>

        。请在现实转账前再次核对。

      </div>

    </div>
  `;

}
function payoutHtml(row){
  const open =
    row.payout_status !== 'paid'
    &&
    Number(row.payout_remaining || 0) > 0;

  return `
    <div class="item">

      <div class="head">
        <div>
          <div class="name">
            ${esc(row.display_name || '客户')}
          </div>

          <div class="meta">
            ${esc(row.customer_code || '')}
            ${
              row.username
              ? ' · @' + esc(row.username)
              : ''
            }
            ${
              row.phone
              ? ' · ' + esc(row.phone)
              : ''
            }
          </div>
        </div>

        <div class="badge ${esc(row.payout_status)}">
          ${esc(statusText(row.payout_status))}
        </div>
      </div>


      <div class="row">
        <span>对应期数</span>
        <strong>
          ${esc(row.round_date || '—')}
          ·
          ${esc(periodName(row.round_code))}
        </strong>
      </div>

      <div class="row">
        <span>开奖生肖</span>
        <strong>${esc(zodiacName(row.result_number))}</strong>
      </div>

      <div class="row">
        <span>命中金额</span>
        <strong>${money(row.winning_points)}</strong>
      </div>

      <div class="row">
        <span>应派彩</span>
        <strong>${money(row.payout_due)}</strong>
      </div>

      <div class="row">
        <span>已派彩</span>
        <strong>${money(row.payout_paid)}</strong>
      </div>

      <div class="row">
        <span>剩余待派</span>
        <strong class="amount">${money(row.payout_remaining)}</strong>
      </div>


            ${currentPayoutAccountsHtml(row)}


      ${payoutTransactionsHtml(row)}


      ${
        open
        ? `
          <button
            type="button"
            onclick="recordPayout('${esc(row.settlement_id)}')">
            记录本次实际派彩
          </button>
        `
        : ''
      }

    </div>
  `;
}


function render(){

  const pending =
  rows.filter(
    row =>
    row.payout_status
    !==
    'paid'
    &&
    Number(
      row.payout_remaining
      ||
      0
    )
    >
    0
  );


  const paid =
  rows.filter(
    row =>
    row.payout_status
    ===
    'paid'
  );


  document
  .getElementById(
    'pendingCount'
  )
  .textContent =
  pending.length;


  document
  .getElementById(
    'pendingAmount'
  )
  .textContent =
  money(
    pending.reduce(
      (
        sum,
        row
      ) =>
      sum
      +
      Number(
        row.payout_remaining
        ||
        0
      ),
      0
    )
  );


  document
  .getElementById(
    'paidCount'
  )
  .textContent =
  paid.length;


  document
  .getElementById(
    'pendingList'
  )
  .innerHTML =
  pending.length
  ?
  pending
  .map(
    payoutHtml
  )
  .join('')
  :
  `
    <div class="empty">
      当前没有待派彩客户
    </div>
  `;


  document
  .getElementById(
    'historyList'
  )
  .innerHTML =
  paid.length
  ?
  paid
  .map(
    payoutHtml
  )
  .join('')
  :
  `
    <div class="empty">
      暂无已完成派彩记录
    </div>
  `;

}


async function loadAll(){

  setMessage(
    '正在刷新...'
  );


  try{

    const [
      payoutRes,
      accountRes
    ] =
    await Promise.all([

      api(
        '/rest/v1/rpc/admin_list_customer_payouts',
        {
          method:'POST',

          headers:{
            'Content-Type':
            'application/json'
          },

          body:'{}'
        }
      ),

      api(
        '/rest/v1/customer_payout_accounts'
        +
        '?select=id,customer_id,method_type,account_name,account_number,bank_name,is_active,is_verified,created_at'
        +
        '&is_active=eq.true'
        +
        '&order=created_at.asc'
      )

    ]);


    const data =
    await parseResponse(
      payoutRes
    );


    const accountData =
    await parseResponse(
      accountRes
    );


    const payoutRows =
    Array.isArray(
      data?.rows
    )
    ?
    data.rows
    :
    [];


    const currentAccounts =
    Array.isArray(
      accountData
    )
    ?
    accountData
    :
    [];


    rows =
    payoutRows.map(
      row=>({

        ...row,

        current_payout_accounts:
        currentAccounts.filter(
          account=>
          account.customer_id
          ===
          row.customer_id
        )

      })
    );


    render();


    setMessage(
      '资料已更新',
      'ok'
    );

  }
  catch(error){

    console.error(
      error
    );


    setMessage(
      translateError(
        error.message
      ),
      'err'
    );

  }

}


function pickPayoutProof(){
  return new Promise(resolve => {
    const input = document.createElement('input');

    input.type = 'file';
    input.accept =
      'image/jpeg,image/png,image/webp,image/heic,image/heif';

    input.onchange = () => {
      resolve(input.files?.[0] || null);
    };

    input.click();
  });
}


async function uploadPayoutProof(settlementId,file){
  if(!file){
    return null;
  }

  const allowed = [
    'image/jpeg',
    'image/png',
    'image/webp',
    'image/heic',
    'image/heif'
  ];

  if(!allowed.includes(file.type)){
    throw new Error('PAYOUT_PROOF_TYPE_INVALID');
  }

  if(file.size > 10*1024*1024){
    throw new Error('PAYOUT_PROOF_TOO_LARGE');
  }

  const safeName = String(file.name || 'payout-proof')
    .replace(/[^a-zA-Z0-9._-]/g,'_');

  const uniqueId = crypto.randomUUID
    ? crypto.randomUUID()
    : String(Date.now());

  const storagePath =
    settlementId
    + '/'
    + uniqueId
    + '-'
    + safeName;

  const encoded = storagePath
    .split('/')
    .map(encodeURIComponent)
    .join('/');

  const res = await api(
    '/storage/v1/object/customer-payout-proofs/' + encoded,
    {
      method:'POST',
      headers:{
        'Content-Type':file.type,
        'x-upsert':'false'
      },
      body:file
    }
  );

  if(!res.ok){
    throw new Error('PAYOUT_PROOF_UPLOAD_FAILED');
  }

  return storagePath;
}


async function deletePayoutProof(storagePath){
  if(!storagePath){
    return;
  }

  try{
    const encoded = storagePath
      .split('/')
      .map(encodeURIComponent)
      .join('/');

    await api(
      '/storage/v1/object/customer-payout-proofs/' + encoded,
      {
        method:'DELETE'
      }
    );
  }
  catch{
  }
}


async function viewPayoutProof(storagePath){
  const newWindow = window.open('','_blank');

  try{
    const encoded = storagePath
      .split('/')
      .map(encodeURIComponent)
      .join('/');

    const res = await api(
      '/storage/v1/object/authenticated/customer-payout-proofs/'
      + encoded
    );

    if(!res.ok){
      throw new Error();
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    if(newWindow){
      newWindow.location = url;
    }
    else{
      location.href = url;
    }

    setTimeout(
      () => URL.revokeObjectURL(url),
      60000
    );
  }
  catch{
    if(newWindow){
      newWindow.close();
    }

    setMessage(
      '派彩凭证读取失败。',
      'err'
    );
  }
}


async function recordPayout(settlementId){
  if(recordPayout.busy){
    setMessage(
      '上一笔派彩正在处理中，请稍候。'
    );
    return;
  }

  const row = rows.find(
    item => item.settlement_id === settlementId
  );

  if(!row){
    setMessage(
      '没有找到这条客户结算。',
      'err'
    );
    return;
  }

  const remaining = Math.max(
    0,
    Number(row.payout_remaining || 0)
  );

  if(remaining <= 0){
    setMessage(
      '这笔派彩已经没有剩余金额。',
      'err'
    );
    return;
  }

  let inputAmount = window.prompt(
    '请输入这一次现实中已经实际转出的派彩金额：',
    String(remaining)
  );

  if(inputAmount === null){
    return;
  }

  inputAmount = inputAmount
    .replace(/,/g,'')
    .trim();

  const amount = Number(inputAmount);

  if(
    !Number.isFinite(amount)
    ||
    amount <= 0
    ||
    amount > remaining
  ){
    setMessage(
      '派彩金额不正确，不能超过当前剩余待派金额。',
      'err'
    );
    return;
  }

  let note = window.prompt(
    '请输入这一次真实转账备注，例如：KPay 已转账 / 银行转账 / 交易编号：',
    ''
  );

  if(note === null){
    return;
  }

  note = note.trim();

  if(!note){
    setMessage(
      '必须填写派彩备注。',
      'err'
    );
    return;
  }

  const remainingAfter = Math.max(
    0,
    remaining - amount
  );

  const text =
    '请再次确认：\n\n'
    + '客户：'
    + (row.display_name || row.customer_code)
    + '\n'
    + '本次实际派彩：'
    + money(amount)
    + '\n'
    + '派彩后剩余：'
    + money(remainingAfter)
    + '\n'
    + '收款账户：'
    + (row.payout_account_name_snapshot || '')
    + ' · '
    + (row.payout_account_number_snapshot || '')
    + '\n'
    + '备注：'
    + note
    + '\n\n'
    + '只有现实中已经完成这一次转账后才能确认。';

  if(!window.confirm(text)){
    return;
  }

  const wantProof = window.confirm(
    '是否上传这一次转账凭证截图？\n\n'
    + '有截图建议选择“确定”；'
    + '没有截图可以选择“取消”继续。'
  );

  let proofStoragePath = null;

  recordPayout.busy = true;

  setMessage(
    '正在登记派彩...'
  );

  try{
    if(wantProof){
      const file = await pickPayoutProof();

      if(file){
        proofStoragePath =
          await uploadPayoutProof(
            settlementId,
            file
          );
      }
    }

    const res = await api(
      '/rest/v1/rpc/admin_record_customer_payout',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          p_settlement_id:settlementId,
          p_amount:amount,
          p_admin_note:note,
          p_proof_storage_path:proofStoragePath
        })
      }
    );

    const result = await parseResponse(res);

    await loadAll();

    if(result?.payout_status === 'paid'){
      setMessage(
        '本次派彩已保存，这笔应派金额已经全部完成。',
        'ok'
      );
    }
    else{
      setMessage(
        '本次派彩已保存，剩余待派 '
        + money(result?.payout_remaining)
        + '。',
        'ok'
      );
    }
  }
  catch(error){
    if(proofStoragePath){
      await deletePayoutProof(
        proofStoragePath
      );
    }

    console.error(error);

    setMessage(
      translateError(error.message),
      'err'
    );
  }
  finally{
    recordPayout.busy = false;
  }
}


function translateError(message){
  const text = String(message || '');

  if(text.includes('ADMIN_AAL2_REQUIRED')){
    return '管理员二次验证已经失效，请返回管理中心重新验证。';
  }

  if(text.includes('CUSTOMER_SETTLEMENT_NOT_FOUND')){
    return '没有找到这条客户结算。';
  }

  if(text.includes('NO_PAYOUT_DUE')){
    return '这笔结算没有应派彩金额。';
  }

  if(text.includes('PAYOUT_ALREADY_COMPLETED')){
    return '这笔派彩已经完成，请刷新页面。';
  }

  if(text.includes('PAYOUT_METHOD_REQUIRED')){
    return '客户尚未绑定可用收款方式，请先联系客服处理。';
  }

  if(text.includes('INVALID_PAYOUT_AMOUNT')){
    return '派彩金额必须大于 0。';
  }

  if(text.includes('PAYOUT_EXCEEDS_REMAINING')){
    return '派彩金额超过当前剩余应派金额。';
  }

  if(text.includes('PAYOUT_NOTE_REQUIRED')){
    return '必须填写派彩备注。';
  }

  if(text.includes('PAYOUT_PROOF_PATH_INVALID')){
    return '派彩凭证路径不正确，请重新上传。';
  }

  if(text.includes('PAYOUT_PROOF_TOO_LARGE')){
    return '派彩凭证不能超过 10MB。';
  }

  if(text.includes('PAYOUT_PROOF_TYPE_INVALID')){
    return '派彩凭证只支持 JPG、PNG、WEBP、HEIC、HEIF 图片。';
  }

  if(text.includes('PAYOUT_PROOF_UPLOAD_FAILED')){
    return '派彩凭证上传失败，请重新尝试。';
  }

  return text || '操作失败，请重新尝试。';
}


function setMessage(
  text,
  type=''
){

  const el =
  document.getElementById(
    'pageMsg'
  );


  el.textContent =
  text;


  el.className =
  'msg'
  +
  (
    type
    ?
    ' '
    +
    type
    :
    ''
  );

}
