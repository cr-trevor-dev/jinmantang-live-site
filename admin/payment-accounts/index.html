<!doctype html>

<title>金满堂 · 收款账户管理</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #251907 0,
      #0d0c0a 38%,
      #070708 100%

  color:#f7f0df;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:22px 15px 55px;
}

.brand{
  text-align:center;
  margin-bottom:20px;
}

.mark{
  width:68px;
  height:68px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  font-size:27px;
  font-weight:900;
  color:#f6da86;
  border:1px solid #b98a2c;
  background:
    linear-gradient(
      145deg,
      #382506,
      #100d08
    );
  box-shadow:
    0 0 28px
    rgba(235,185,62,.22);
}

.cn{
  font-weight:900;
  font-size:25px;
  letter-spacing:4px;
  color:#f3d889;
}

.en{
  font-size:10px;
  letter-spacing:3px;
  color:#9f916d;
  margin-top:5px;
}

.back{
  display:block;
  text-decoration:none;
  text-align:center;
  padding:13px;
  border-radius:13px;
  margin-bottom:14px;
  color:#d8bf73;
  background:#121213;
  border:
    1px solid
    rgba(214,168,63,.18);
}

.card{
  background:
    linear-gradient(
      180deg,
      rgba(22,22,22,.98),
      rgba(11,11,12,.98)
    );
  border:
    1px solid
    rgba(214,168,63,.30);
  border-radius:22px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:
    0 22px 60px
    rgba(0,0,0,.32);
}

.title{
  color:#dfc575;
  font-size:17px;
  font-weight:900;
  margin-bottom:14px;
}

.note{
  color:#8f8778;
  font-size:11px;
  line-height:1.7;
  margin-bottom:14px;
}

.field{
  margin-bottom:12px;
}

label.fieldLabel{

  color:#a59a82;
  font-size:11px;
  margin-bottom:7px;
}

input,
select,
textarea{

  border:

  color:#fff;

  padding:13px;

  outline:none;
}

textarea{

}

.two{
  display:grid;

}

.switchRow{

.switchRow span{

.switchRow input{

button{

}

button.secondary{

  color:#d9c37c;

}

button:disabled{

.accountCard{

.accountHead{

  align-items:flex-start;

  margin-bottom:15px;
}

.accountName{
  color:#efd477;

  font-weight:900;
}

.accountMeta{

  font-size:10px;

}

.badge{

.badge.active{

}

.badge.inactive{

}

.qrBox{

  border-radius:14px;
  padding:13px;

.qrPreview{
  width:min(260px,100%);

}

.msg{

.accountCard{

.accountCard:hover{

}

}

.accountCard .accountHead{

}

.accountCard.open .accountHead{

.accountHead > div:first-child{

  display:grid;
  place-items:center;

  border:

}

.accountCard.open
.accountHead::after{

    rgba(214,168,63,.14);
}

.accountSummary{

  justify-content:space-between;

  margin-top:18px;
  margin-bottom:5px;
}

.accountSummaryTitle{

  font-size:13px;

}

.countPill{
  min-width:31px;
  height:25px;
  display:grid;
  place-items:center;
  padding:0 9px;
  border-radius:99px;
  background:
    rgba(214,168,63,.10);
  border:
    1px solid
    rgba(214,168,63,.20);
  color:#e4ca79;
  font-size:11px;
  font-weight:900;
}

.inactiveToggle{
  margin-top:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
  padding:14px 15px;
  border-radius:15px;
  background:
    linear-gradient(

      #151516,
      #101011

  border:
    1px solid
    rgba(214,168,63,.16);
  color:#c9b783;

}

.inactiveToggleMain{
  display:flex;
  align-items:center;
  gap:9px;

}

.inactiveToggleTitle{
  color:#d4c18c;
  font-size:13px;
  font-weight:900;
}

.inactiveToggleSub{
  color:#787164;
  font-size:10px;
  margin-top:3px;

}

.inactiveArrow{

  font-size:17px;
  transition:transform .2s ease;
}

.inactiveToggle.open

}

.inactivePanel{
  padding-top:2px;
}

.reactivateButton{

  margin-bottom:10px;
  background:
    linear-gradient(

      #213a2b,
      #14271d

    1px solid

}

.accountLimit{
  margin-top:10px;
  padding:10px 12px;

  background:
    rgba(214,168,63,.06);
  border:
    1px solid
    rgba(214,168,63,.12);
  color:#91866d;

  line-height:1.6;
  text-align:center;
}
.hidden{

.foot{

  color:#706b62;
  font-size:10px;
  margin-top:24px;

@media(max-width:600px){

  .two{
    grid-template-columns:1fr;
  }

</style>

</head>

<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let refreshPromise =
null;


let adminUserId =
'';


let accounts =
[];


let inactiveExpanded =
false;


const qrUrls =
new Map();


function saveSession(data){

  if(data?.access_token){

    token =
    data.access_token;

    localStorage.setItem(
      'jmt_access_token',
      token
    );

    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

  }


  if(data?.refresh_token){

    refreshToken =
    data.refresh_token;

    localStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

    sessionStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

  }

}


function jwtPayload(){

  try{

    let part =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');


    while(
      part.length
      %
      4
    ){

      part += '=';

    }


    return JSON.parse(
      decodeURIComponent(
        atob(part)
        .split('')
        .map(
          c =>
          '%'
          +
          (
            '00'
            +
            c.charCodeAt(0)
            .toString(16)
          )
          .slice(-2)
        )
        .join('')
      )
    );

  }
  catch{

    return {};

  }

}


async function refreshAdminSession(){

  if(!refreshToken){

    return false;

  }


  if(refreshPromise){

    return refreshPromise;

  }


  refreshPromise =
  (async()=>{

    try{

      const res =
      await fetch(
        BASE
        +
        '/auth/v1/token?grant_type=refresh_token',
        {
          method:'POST',

          headers:{
            apikey:KEY,
            'Content-Type':
            'application/json'
          },

          body:
          JSON.stringify({
            refresh_token:
            refreshToken
          })
        }
      );


      if(!res.ok){

        return false;

      }


      const data =
      await res.json();


      if(!data.access_token){

        return false;

      }


      saveSession(
        data
      );


      return true;

    }
    catch{

      return false;

    }
    finally{

      refreshPromise =
      null;

    }

  })();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(
    BASE
    +
    path,
    {
      ...options,

      headers:{
        apikey:KEY,
        Authorization:
        'Bearer '
        +
        token,
        ...(options.headers || {})
      }
    }
  );


  let response =
  await request();


  if(
    response.status
    !==
    401
  ){

    return response;

  }


  const refreshed =
  await refreshAdminSession();


  if(!refreshed){

    return response;

  }


  response =
  await request();


  return response;

}


async function verifyAdmin(){

  if(!token){

    return false;

  }


  const userRes =
  await api(
    '/auth/v1/user'
  );


  if(!userRes.ok){

    return false;

  }


  const user =
  await userRes.json();


  if(!user?.id){

    return false;

  }


  adminUserId =
  user.id;


  const adminRes =
  await api(
    '/rest/v1/admin_users'
    +
    '?auth_user_id=eq.'
    +
    encodeURIComponent(
      user.id
    )
    +
    '&select=auth_user_id'
    +
    '&limit=1'
  );


  if(!adminRes.ok){

    return false;

  }


  const rows =
  await adminRes.json();


  if(!rows.length){

    return false;

  }


  const payload =
  jwtPayload();


  if(
    payload.aal
    !==
    'aal2'
  ){

    document.getElementById(
      'authErrorText'
    ).textContent =
    '管理员账号已登录，但当前没有完成二次验证。请返回管理中心完成验证后再进入。';

    return false;

  }


  return true;

}


function setMsg(
  id,
  text='',
  type=''
){

  const el =
  document.getElementById(
    id
  );


  if(!el){

    return;

  }


  el.textContent =
  text;


  el.className =
  'msg'
  +
  (
    type
    ?
    ' '
    +
    type
    :
    ''
  );

}


function field(
  labelText,
  element
){

  const wrap =
  document.createElement(
    'div'
  );

  wrap.className =
  'field';


  const label =
  document.createElement(
    'label'
  );

  label.className =
  'fieldLabel';

  label.textContent =
  labelText;


  wrap.appendChild(
    label
  );

  wrap.appendChild(
    element
  );


  return wrap;

}


function input(
  value='',
  placeholder=''
){

  const el =
  document.createElement(
    'input'
  );

  el.value =
  value
  ??
  '';

  el.placeholder =
  placeholder;


  return el;

}


function selectType(
  value
){

  const el =
  document.createElement(
    'select'
  );


  const wallet =
  document.createElement(
    'option'
  );

  wallet.value =
  'wallet';

  wallet.textContent =
  'K Pay / 钱包';


  const bank =
  document.createElement(
    'option'
  );

  bank.value =
  'bank';

  bank.textContent =
  '银行账户';


  el.append(
    wallet,
    bank
  );


  el.value =
  value
  ===
  'bank'
  ?
  'bank'
  :
  'wallet';


  return el;

}


function safeFile(file){

  if(!file){

    return true;

  }


  const allowed =
  [
    'image/png',
    'image/jpeg',
    'image/webp'
  ];


  return (
    allowed.includes(
      file.type
    )
    &&
    file.size
    <=
    8
    *
    1024
    *
    1024
  );

}


function fileExtension(file){

  if(
    file.type
    ===
    'image/png'
  ){

    return 'png';

  }


  if(
    file.type
    ===
    'image/webp'
  ){

    return 'webp';

  }


  return 'jpg';

}


function encodeStoragePath(
  path
){

  return path
  .split('/')
  .map(
    encodeURIComponent
  )
  .join('/');

}


async function uploadQr(
  accountId,
  file
){

  if(!file){

    return null;

  }


  if(!safeFile(file)){

    throw new Error(
      'QR_FILE_INVALID'
    );

  }


  const random =
  crypto.randomUUID
  ?
  crypto.randomUUID()
  :
  String(
    Date.now()
  );


  const path =
  'accounts/'
  +
  accountId
  +
  '/'
  +
  Date.now()
  +
  '-'
  +
  random
  +
  '.'
  +
  fileExtension(
    file
  );


  const res =
  await api(
    '/storage/v1/object/payment-qr-codes/'
    +
    encodeStoragePath(
      path
    ),
    {
      method:'POST',

      headers:{
        'Content-Type':
        file.type,

        'x-upsert':
        'false'
      },

      body:
      file
    }
  );


  if(!res.ok){

    throw new Error(
      'QR_UPLOAD_FAILED'
    );

  }


  return path;

}


async function cleanupQr(
  path
){

  if(!path){

    return;

  }


  try{

    await api(
      '/storage/v1/object/payment-qr-codes/'
      +
      encodeStoragePath(
        path
      ),
      {
        method:'DELETE'
      }
    );

  }
  catch{

  }

}


async function loadQr(
  path,
  img,
  text
){

  if(!path){

    text.textContent =
    '当前没有上传二维码';

    return;

  }


  try{

    const oldUrl =
    qrUrls.get(
      path
    );


    if(oldUrl){

      img.src =
      oldUrl;

      img.style.display =
      'block';

      text.textContent =
      '当前二维码';

      return;

    }


    const res =
    await api(
      '/storage/v1/object/authenticated/payment-qr-codes/'
      +
      encodeStoragePath(
        path
      )
    );


    if(!res.ok){

      throw new Error();

    }


    const blob =
    await res.blob();


    const url =
    URL.createObjectURL(
      blob
    );


    qrUrls.set(
      path,
      url
    );


    img.src =
    url;

    img.style.display =
    'block';

    text.textContent =
    '当前二维码';

  }
  catch{

    text.textContent =
    '二维码读取失败，但账户资料仍然存在';

  }

}

function cardValue(
  card,
  role
){

  return card
  .querySelector(
    '[data-role="'
    +
    role
    +
    '"]'
  );

}


async function saveAccount(
  account,
  card,
  button
){

  const msg =
  cardValue(
    card,
    'msg'
  );


  const methodType =
  cardValue(
    card,
    'methodType'
  ).value;


  const methodName =
  cardValue(
    card,
    'methodName'
  ).value.trim();


  const accountName =
  cardValue(
    card,
    'accountName'
  ).value.trim();


  const accountNumber =
  cardValue(
    card,
    'accountNumber'
  ).value.trim();


  const bankName =
  cardValue(
    card,
    'bankName'
  ).value.trim();


  const note =
  cardValue(
    card,
    'note'
  ).value.trim();


  const sortOrder =
  Number(
    cardValue(
      card,
      'sortOrder'
    ).value
    ||
    0
  );


  const isActive =
  cardValue(
    card,
    'isActive'
  ).checked;


  const file =
  cardValue(
    card,
    'qrFile'
  ).files?.[0]
  ||
  null;


  if(
    !methodName
    ||
    !accountName
    ||
    !accountNumber
  ){

    msg.className =
    'msg err';

    msg.textContent =
    '请填写显示名称、收款人姓名和收款账号。';

    return;

  }


  if(
    methodType
    ===
    'bank'
    &&
    !bankName
  ){

    msg.className =
    'msg err';

    msg.textContent =
    '银行账户必须填写银行名称。';

    return;

  }


  if(!safeFile(file)){

    msg.className =
    'msg err';

    msg.textContent =
    '二维码只能使用 PNG、JPG 或 WEBP，并且不能超过 8MB。';

    return;

  }


  if(
    !window.confirm(
      '确认保存这个平台收款账户吗？'
    )
  ){

    return;

  }


  button.disabled =
  true;

  msg.className =
  'msg';

  msg.textContent =
  '正在保存...';


  let newQrPath =
  null;


  try{

    if(file){

      newQrPath =
      await uploadQr(
        account.id,
        file
      );

    }


    const body = {
      method_name:
      methodName,

      method_type:
      methodType,

      account_name:
      accountName,

      account_number:
      accountNumber,

      bank_name:
      bankName
      ||
      null,

      note:
      note
      ||
      null,

      is_active:
      isActive,

      sort_order:
      Number.isFinite(
        sortOrder
      )
      ?
      sortOrder
      :
      0,

      updated_at:
      new Date()
      .toISOString(),

      updated_by:
      adminUserId
    };


    if(newQrPath){

      body.qr_storage_path =
      newQrPath;

    }


    const res =
    await api(
      '/rest/v1/payment_accounts'
      +
      '?id=eq.'
      +
      encodeURIComponent(
        account.id
      ),
      {
        method:'PATCH',

        headers:{
          'Content-Type':
          'application/json',

          Prefer:
          'return=representation'
        },

        body:
        JSON.stringify(
          body
        )
      }
    );


    if(!res.ok){

      throw new Error(
        'UPDATE_FAILED'
      );

    }


    msg.className =
    'msg ok';

    msg.textContent =
    '✓ 已保存';


    await loadAccounts();

  }
  catch{

    if(newQrPath){

      await cleanupQr(
        newQrPath
      );

    }


    msg.className =
    'msg err';

    msg.textContent =
    '保存失败，原来的账户资料没有被删除。';

  }
  finally{

    button.disabled =
    false;

  }

}
