<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">

<title>金满堂 · 客户管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #251907 0,
      #0d0c0a 38%,
      #070708 100%
    );
  color:#f7f0df;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.wrap{
  max-width:820px;
  margin:auto;
  min-height:100vh;
  padding:22px 15px 55px;
}

.brand{
  text-align:center;
  margin-bottom:20px;
}

.mark{
  width:68px;
  height:68px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  font-size:27px;
  font-weight:900;
  color:#f6da86;
  border:1px solid #b98a2c;
  background:
    linear-gradient(
      145deg,
      #382506,
      #100d08
    );
  box-shadow:
    0 0 28px rgba(235,185,62,.22);
}

.cn{
  font-weight:900;
  font-size:25px;
  letter-spacing:4px;
  color:#f3d889;
}

.en{
  font-size:10px;
  letter-spacing:3px;
  color:#9f916d;
  margin-top:5px;
}

.card{
  background:
    linear-gradient(
      180deg,
      rgba(22,22,22,.98),
      rgba(11,11,12,.98)
    );
  border:1px solid rgba(214,168,63,.30);
  border-radius:22px;
  padding:18px;
  margin-bottom:15px;

    0 22px 60px rgba(0,0,0,.32);
}

.title{
  font-size:16px;
  font-weight:900;
  color:#dfc575;
  margin-bottom:14px;
}

input{
  width:100%;
  border:1px solid rgba(214,168,63,.24);
  background:#101011;
  color:#fff;
  border-radius:13px;
  padding:14px;
  font-size:15px;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  background:
    linear-gradient(
      180deg,
      #f1d784,
      #b47d20
    );
  color:#171109;
}

button.secondary{
  background:#171718;
  color:#d9c37c;
  border:1px solid rgba(214,168,63,.22);
}

button.danger{
  background:#1b1717;
  color:#d9a4a4;
  border:1px solid rgba(180,100,100,.22);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
}

.refreshBtn{
  width:auto;
  min-width:94px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.summaryBox{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:13px;
}

.summaryBox small{
  display:block;
  color:#817a6d;
  font-size:10px;
  margin-bottom:6px;
}

.summaryBox strong{
  display:block;
  color:#ebcd72;
  font-size:20px;
}

.customer{
  border:1px solid rgba(214,168,63,.19);
  border-radius:17px;
  padding:14px;
  margin-top:12px;
  background:#0e0e0f;
}

.customerHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.customerName{
  color:#f0d077;
  font-size:17px;
  font-weight:900;
}

.customerCode{
  color:#a99b75;
  font-size:11px;
  margin-top:4px;
}

.customerMeta{
  color:#888174;
  font-size:12px;
  line-height:1.7;
}

.status{
  padding:6px 9px;
  border-radius:99px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.status.active{
  background:rgba(68,143,87,.14);
  color:#89d09d;
}

.status.other{
  background:rgba(163,100,64,.14);
  color:#d0a07f;
}

.sectionLabel{
  margin-top:16px;
  margin-bottom:8px;
  color:#b7a46d;
  font-size:12px;
  font-weight:800;
}

.account,
.order,
.payment{
  margin-top:9px;
  padding:13px;
  border-radius:14px;
  background:#131314;
  border:1px solid rgba(255,255,255,.055);
}

.accountHead,
.paymentHead,
.orderHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:10px;
}

.accountType,
.paymentTitle,
.orderTitle{
  color:#e5c96f;
  font-weight:900;
  font-size:14px;
}

.verify,
.paymentStatus{
  padding:5px 8px;
  border-radius:99px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.verify.yes,
.paymentStatus.approved{
  background:rgba(64,145,88,.14);
  color:#86d19c;
}

.verify.no,
.paymentStatus.pending{
  background:rgba(172,126,42,.14);
  color:#ddbc65;
}

.paymentStatus.rejected{
  background:rgba(169,73,66,.15);
  color:#e0a09a;
}

.infoRow{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:6px 0;
  font-size:12px;
  border-bottom:1px solid rgba(255,255,255,.045);
}

.infoRow:last-child{
  border-bottom:0;
}

.infoRow span{
  color:#777166;
}

.infoRow strong{
  color:#e9dfc7;
  text-align:right;
  word-break:break-all;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.singleAction{
  margin-top:10px;
}

.finance{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.financeBox{
  border:1px solid rgba(214,168,63,.14);
  border-radius:12px;
  padding:10px;
  background:#0c0c0d;
}

.financeBox small{
  display:block;
  color:#777166;
  font-size:9px;
  margin-bottom:5px;
}

.financeBox strong{
  display:block;
  color:#ecd176;
  font-size:14px;
}

.empty{
  text-align:center;
  color:#7f786b;
  padding:20px 10px;
  font-size:12px;
}

.msg{
  min-height:18px;
  margin-top:10px;
  text-align:center;
  color:#aaa18d;
  font-size:12px;
  line-height:1.6;
}

.msg.ok{
  color:#70d49c;
}

.msg.err{
  color:#e89191;
}

.back{
  display:block;
  text-decoration:none;
  text-align:center;
  padding:13px;
  border-radius:13px;
  margin-bottom:14px;
  color:#d8bf73;
  background:#121213;
  border:1px solid rgba(214,168,63,.18);
}

.hidden{
  display:none!important;
}

.foot{
  text-align:center;
  color:#706b62;
  font-size:10px;
  margin-top:24px;
}

@media(max-width:620px){

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .refreshBtn{
    width:100%;
  }

  .finance{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="mark">金</div>
    <div class="cn">金满堂</div>
    <div class="en">CUSTOMER MANAGEMENT</div>
  </div>


  <a
    class="back"
    href="/admin/">
    ← 返回管理中心
  </a>


  <div
    id="authError"
    class="card hidden">

    <div class="title">
      无法进入客户管理
    </div>

    <div
      id="authErrorText"
      class="msg err">
      请先登录管理员账号并完成二次验证。
    </div>

  </div>


  <main
    id="mainBox"
    class="hidden">


    <section class="card">

      <div class="title">
        客户概况
      </div>

      <div class="summary">

        <div class="summaryBox">
          <small>客户总数</small>
          <strong id="customerTotal">0</strong>
        </div>

        <div class="summaryBox">
          <small>正常客户</small>
          <strong id="activeTotal">0</strong>
        </div>

        <div class="summaryBox">
          <small>待确认收款方式</small>
          <strong id="payoutPendingTotal">0</strong>
        </div>

        <div class="summaryBox">
          <small>待审核付款</small>
          <strong id="paymentPendingTotal">0</strong>
        </div>

      </div>

    </section>


    <section class="card">

      <div class="title">
        客户搜索
      </div>

      <div class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="客户编号、用户名、姓名、电话"
          oninput="renderCustomers()">

        <button
          class="secondary refreshBtn"
          onclick="loadAll()">
          刷新
        </button>

      </div>

      <div
        id="pageMsg"
        class="msg">
      </div>

    </section>


    <section class="card">

      <div class="title">
        客户、下注与付款
      </div>

      <div id="customerList">

        <div class="empty">
          正在读取客户资料...
        </div>

      </div>

    </section>

  </main>


  <div class="foot">
    © 2022 JIN MANTANG · ADMIN CUSTOMER SYSTEM
  </div>

</div>


<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let customers = [];
let payoutAccounts = [];
let orders = [];
let payments = [];
let proofs = [];
let rounds = [];

let refreshPromise = null;
let autoTimer = null;


/* =========================================================
   SESSION
========================================================= */

function saveSession(data){

  if(data?.access_token){

    token =
    data.access_token;

    localStorage.setItem(
      'jmt_access_token',
      token
    );

    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

  }


  if(data?.refresh_token){

    refreshToken =
    data.refresh_token;

    localStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

    sessionStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

  }

}


function getJwtPayload(){

  try{

    let part =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');


    while(part.length % 4){
      part += '=';
    }


    return JSON.parse(

      decodeURIComponent(

        atob(part)
        .split('')
        .map(
          c =>
          '%'
          +
          (
            '00'
            +
            c.charCodeAt(0)
            .toString(16)
          )
          .slice(-2)
        )
        .join('')

      )

    );

  }
  catch{

    return {};

  }

}


async function refreshAdminSession(){

  if(!refreshToken){
    return false;
  }


  if(refreshPromise){
    return refreshPromise;
  }


  refreshPromise =
  (
    async()=>{

      try{

        const res =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:'POST',

            headers:{

              apikey:
              KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(!res.ok){
          return false;
        }


        const data =
        await res.json();


        if(!data.access_token){
          return false;
        }


        saveSession(
          data
        );


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:
        KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let res =
  await request();


  if(res.status !== 401){
    return res;
  }


  const refreshed =
  await refreshAdminSession();


  if(!refreshed){
    return res;
  }


  return request();

}


/* =========================================================
   ADMIN VERIFY
========================================================= */

async function verifyAdmin(){

  if(!token){
    return false;
  }


  const payload =
  getJwtPayload();


  if(payload.aal !== 'aal2'){
    return false;
  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){
      return false;
    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(!adminRes.ok){
      return false;
    }


    const rows =
    await adminRes.json();


    return (
      Array.isArray(rows)
      &&
      rows.length > 0
    );

  }
  catch{

    return false;

  }

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function money(value){

  return new Intl.NumberFormat(
    'en-US',
    {
      maximumFractionDigits:0
    }
  )
  .format(
    Number(
      value
      ||
      0
    )
  );

}


function methodName(type){

  if(type === 'kpay'){
    return 'KPay';
  }


  if(type === 'bank'){
    return '银行账户';
  }


  return type || '—';

}


function roundName(roundId){

  const round =
  rounds.find(
    x =>
    x.id === roundId
  );


  if(!round){
    return '—';
  }


  let label =
  round.round_code
  ||
  '';


  if(round.round_code === '1030'){
    label = '上午 11:45';
  }


  if(round.round_code === '1530'){
    label = '下午 3:45';
  }


  return (
    round.round_date
    +
    ' · '
    +
    label
  );

}


function customerAccounts(customerId){

  return payoutAccounts.filter(

    item =>
    item.customer_id
    ===
    customerId

  );

}


function customerOrders(customerId){

  return orders.filter(

    item =>
    item.customer_id
    ===
    customerId

  );

}


function customerPayments(customerId){

  return payments.filter(

    item =>
    item.customer_id
    ===
    customerId

  );

}


function proofForSubmission(submissionId){

  return proofs.find(

    item =>
    item.payment_submission_id
    ===
    submissionId

  )
  ||
  null;

}


/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll(){

  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.textContent =
  '正在刷新...';


  msg.className =
  'msg';


  try{

    const responses =
    await Promise.all([

      api(
        '/rest/v1/customer_profiles'
        +
        '?select=id,customer_code,username,display_name,phone,status,created_at'
        +
        '&order=created_at.desc'
      ),

      api(
        '/rest/v1/customer_payout_accounts'
        +
        '?select=id,customer_id,method_type,account_name,account_number,bank_name,is_verified,is_active,created_at,updated_at'
        +
        '&is_active=eq.true'
        +
        '&order=updated_at.desc'
      ),

      api(
        '/rest/v1/customer_round_orders'
        +
        '?select=id,round_id,customer_id,status,submitted_total,pending_total,confirmed_total,submitted_at,created_at,updated_at'
        +
        '&order=created_at.desc'
        +
        '&limit=1000'
      ),

      api(
        '/rest/v1/customer_payment_submissions'
        +
        '?select=id,order_id,round_id,customer_id,payment_account_id,declared_amount,confirmed_amount,status,method_name_snapshot,method_type_snapshot,account_name_snapshot,account_number_snapshot,bank_name_snapshot,customer_note,submitted_at,reviewed_at,rejection_reason'
        +
        '&order=submitted_at.desc'
        +
        '&limit=1000'
      ),

      api(
        '/rest/v1/customer_payment_proofs'
        +
        '?select=id,payment_submission_id,customer_id,storage_path,original_name,mime_type,file_size,created_at'
        +
        '&order=created_at.desc'
        +
        '&limit=1000'
      ),

      api(
        '/rest/v1/rounds'
        +
        '?select=id,round_date,round_code,status,deadline_at,game_mode,created_at'
        +
        '&order=created_at.desc'
        +
        '&limit=100'
      )

    ]);


    for(const res of responses){

      if(!res.ok){

        const text =
        await res.text();

        throw new Error(
          text
          ||
          'LOAD_FAILED'
        );

      }

    }


    customers =
    await responses[0].json();


    payoutAccounts =
    await responses[1].json();


    orders =
    await responses[2].json();


    payments =
    await responses[3].json();


    proofs =
    await responses[4].json();


    rounds =
    await responses[5].json();


    updateSummary();


    renderCustomers();


    msg.textContent =
    '资料已更新';


    msg.className =
    'msg ok';

  }
  catch(err){

    console.error(
      err
    );


    msg.textContent =
    '读取客户资料失败，请返回管理中心重新登录后再试。';


    msg.className =
    'msg err';

  }

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

  document
  .getElementById(
    'customerTotal'
  )
  .textContent =
  customers.length;


  document
  .getElementById(
    'activeTotal'
  )
  .textContent =
  customers.filter(

    item =>
    item.status
    ===
    'active'

  )
  .length;


  document
  .getElementById(
    'payoutPendingTotal'
  )
  .textContent =
  payoutAccounts.filter(

    item =>
    item.is_verified
    !==
    true

  )
  .length;


  document
  .getElementById(
    'paymentPendingTotal'
  )
  .textContent =
  payments.filter(

    item =>
    item.status
    ===
    'pending'

  )
  .length;

}


/* =========================================================
   PAYOUT ACCOUNT
========================================================= */

function accountHtml(account){

  const verified =
  account.is_verified
  ===
  true;


  return `

    <div class="account">

      <div class="accountHead">

        <div class="accountType">
          ${esc(methodName(account.method_type))}
        </div>

        <div
          class="verify ${verified ? 'yes' : 'no'}">

          ${
            verified
            ?
            '已确认'
            :
            '待确认'
          }

        </div>

      </div>


      ${
        account.method_type
        ===
        'bank'
        ?
        `
          <div class="infoRow">
            <span>银行名称</span>
            <strong>${esc(account.bank_name || '—')}</strong>
          </div>
        `
        :
        ''
      }


      <div class="infoRow">
        <span>户名</span>
        <strong>${esc(account.account_name)}</strong>
      </div>


      <div class="infoRow">
        <span>账号 / 手机</span>
        <strong>${esc(account.account_number)}</strong>
      </div>


      <div class="actions">

        <button
          ${verified ? 'disabled' : ''}
          onclick="setPayoutVerification(
            '${esc(account.id)}',
            true
          )">

          ${
            verified
            ?
            '已经确认'
            :
            '确认此账户'
          }

        </button>


        <button
          class="danger"
          ${verified ? '' : 'disabled'}
          onclick="setPayoutVerification(
            '${esc(account.id)}',
            false
          )">

          取消确认

        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   ORDER
========================================================= */

function orderHtml(order){

  const statusMap = {

    draft:
    '待付款',

    payment_pending:
    '付款审核中',

    confirmed:
    '已确认',

    locked:
    '已锁定',

    settled:
    '已结算',

    cancelled:
    '已取消'

  };


  return `

    <div class="order">

      <div class="orderHead">

        <div class="orderTitle">
          ${esc(roundName(order.round_id))}
        </div>

        <div class="status active">
          ${esc(statusMap[order.status] || order.status)}
        </div>

      </div>


      <div class="finance">

        <div class="financeBox">
          <small>下注总额</small>
          <strong>${money(order.submitted_total)}</strong>
        </div>

        <div class="financeBox">
          <small>审核中</small>
          <strong>${money(order.pending_total)}</strong>
        </div>

        <div class="financeBox">
          <small>已确认</small>
          <strong>${money(order.confirmed_total)}</strong>
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   PAYMENT
========================================================= */

function paymentHtml(payment){

  const proof =
  proofForSubmission(
    payment.id
  );


  const statusText = {

    pending:
    '待审核',

    approved:
    '已确认',

    rejected:
    '已拒绝'

  };


  return `

    <div class="payment">

      <div class="paymentHead">

        <div>

          <div class="paymentTitle">
            ${esc(roundName(payment.round_id))}
          </div>

          <div class="customerCode">
            ${esc(payment.method_name_snapshot || '付款')}
          </div>

        </div>

        <div
          class="paymentStatus ${esc(payment.status)}">

          ${esc(statusText[payment.status] || payment.status)}

        </div>

      </div>


      <div class="infoRow">
        <span>申报付款</span>
        <strong>${money(payment.declared_amount)}</strong>
      </div>


      <div class="infoRow">
        <span>已确认金额</span>
        <strong>${money(payment.confirmed_amount)}</strong>
      </div>


      <div class="infoRow">
        <span>付款方式</span>
        <strong>${esc(payment.method_name_snapshot || '—')}</strong>
      </div>


      ${
        payment.bank_name_snapshot
        ?
        `
          <div class="infoRow">
            <span>银行 / 钱包</span>
            <strong>${esc(payment.bank_name_snapshot)}</strong>
          </div>
        `
        :
        ''
      }


      <div class="infoRow">
        <span>平台户名</span>
        <strong>${esc(payment.account_name_snapshot || '—')}</strong>
      </div>


      <div class="infoRow">
        <span>平台账号</span>
        <strong>${esc(payment.account_number_snapshot || '—')}</strong>
      </div>


      ${
        payment.customer_note
        ?
        `
          <div class="infoRow">
            <span>客户备注</span>
            <strong>${esc(payment.customer_note)}</strong>
          </div>
        `
        :
        ''
      }


      ${
        payment.status
        ===
        'rejected'
        &&
        payment.rejection_reason
        ?
        `
          <div class="infoRow">
            <span>拒绝原因</span>
            <strong>${esc(payment.rejection_reason)}</strong>
          </div>
        `
        :
        ''
      }


      ${
        proof
        ?
        `
          <div class="singleAction">

            <button
              class="secondary"
              onclick="viewProof(
                '${esc(proof.storage_path)}'
              )">

              查看付款凭证

            </button>

          </div>
        `
        :
        `
          <div class="msg err">
            尚未上传付款凭证
          </div>
        `
      }


      ${
        payment.status
        ===
        'pending'
        ?
        `
          <div class="actions">

            <button
              ${proof ? '' : 'disabled'}
              onclick="reviewPayment(
                '${esc(payment.id)}',
                'approved'
              )">

              确认到账

            </button>


            <button
              class="danger"
              onclick="reviewPayment(
                '${esc(payment.id)}',
                'rejected'
              )">

              拒绝付款

            </button>

          </div>
        `
        :
        ''
      }

    </div>

  `;

}


/* =========================================================
   CUSTOMER RENDER
========================================================= */

function renderCustomers(){

  const list =
  document.getElementById(
    'customerList'
  );


  const query =
  document
  .getElementById(
    'searchInput'
  )
  .value
  .trim()
  .toLowerCase();


  let rows =
  customers;


  if(query){

    rows =
    customers.filter(

      customer => {

        const text =
        [
          customer.customer_code,
          customer.username,
          customer.display_name,
          customer.phone
        ]
        .join(' ')
        .toLowerCase();


        return text.includes(
          query
        );

      }

    );

  }


  if(!rows.length){

    list.innerHTML =
    `
      <div class="empty">
        没有找到客户
      </div>
    `;


    return;

  }


  list.innerHTML =
  rows.map(

    customer => {

      const accounts =
      customerAccounts(
        customer.id
      );


      const customerOrderRows =
      customerOrders(
        customer.id
      );


      const customerPaymentRows =
      customerPayments(
        customer.id
      );


      return `

        <div class="customer">

          <div class="customerHead">

            <div>

              <div class="customerName">
                ${esc(customer.display_name || '未填写姓名')}
              </div>

              <div class="customerCode">
                ${esc(customer.customer_code || '—')}
              </div>

            </div>


            <div
              class="status ${
                customer.status === 'active'
                ?
                'active'
                :
                'other'
              }">

              ${
                customer.status === 'active'
                ?
                '正常'
                :
                esc(customer.status)
              }

            </div>

          </div>


          <div class="customerMeta">

            用户名：
            ${esc(customer.username || '—')}
            <br>

            电话：
            ${esc(customer.phone || '—')}

          </div>


          <div class="sectionLabel">
            收款方式
          </div>


          ${
            accounts.length
            ?
            accounts
            .map(
              accountHtml
            )
            .join('')
            :
            `
              <div class="empty">
                暂无客户收款方式
              </div>
            `
          }


          <div class="sectionLabel">
            客户下注
          </div>


          ${
            customerOrderRows.length
            ?
            customerOrderRows
            .slice(0,10)
            .map(
              orderHtml
            )
            .join('')
            :
            `
              <div class="empty">
                暂无客户下注
              </div>
            `
          }


          <div class="sectionLabel">
            客户付款申请
          </div>


          ${
            customerPaymentRows.length
            ?
            customerPaymentRows
            .slice(0,10)
            .map(
              paymentHtml
            )
            .join('')
            :
            `
              <div class="empty">
                暂无付款申请
              </div>
            `
          }

        </div>

      `;

    }

  )
  .join('');

}


/* =========================================================
   PAYOUT VERIFY
========================================================= */

async function setPayoutVerification(
  accountId,
  verified
){

  const ok =
  window.confirm(

    verified
    ?
    '确认此客户收款资料正确吗？'
    :
    '确定取消此客户收款方式的确认状态吗？'

  );


  if(!ok){
    return;
  }


  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.textContent =
  '处理中...';


  msg.className =
  'msg';


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_set_customer_payout_verification',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_account_id:
          accountId,

          p_verified:
          verified

        })

      }

    );


    const text =
    await res.text();


    let data = null;


    try{
      data =
      text
      ?
      JSON.parse(
        text
      )
      :
      null;
    }
    catch{
      data = text;
    }


    if(!res.ok){

      throw new Error(

        data?.message
        ||
        data?.error
        ||
        'VERIFY_FAILED'

      );

    }


    await loadAll();


    msg.textContent =
    verified
    ?
    '客户收款方式已经确认。'
    :
    '客户收款方式已取消确认。';


    msg.className =
    'msg ok';

  }
  catch(err){

    console.error(
      err
    );


    msg.textContent =
    translateError(
      err.message
    );


    msg.className =
    'msg err';

  }

}


/* =========================================================
   PAYMENT REVIEW
========================================================= */

async function reviewPayment(
  submissionId,
  action
){

  let reason =
  null;


  if(action === 'approved'){

    const ok =
    window.confirm(
      '请确认您已经核对付款凭证，并且平台确实收到这笔款项。确认到账吗？'
    );


    if(!ok){
      return;
    }

  }
  else{

    reason =
    window.prompt(
      '请输入拒绝原因：',
      '付款凭证或金额不正确'
    );


    if(reason === null){
      return;
    }


    reason =
    reason.trim();


    if(!reason){
      reason =
      '付款未通过审核';
    }

  }


  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.textContent =
  action === 'approved'
  ?
  '正在确认付款...'
  :
  '正在拒绝付款...';


  msg.className =
  'msg';


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_review_customer_payment',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_submission_id:
          submissionId,

          p_action:
          action,

          p_rejection_reason:
          action === 'rejected'
          ?
          reason
          :
          null

        })

      }

    );


    const text =
    await res.text();


    let data = null;


    try{
      data =
      text
      ?
      JSON.parse(
        text
      )
      :
      null;
    }
    catch{
      data = text;
    }


    if(!res.ok){

      throw new Error(

        data?.message
        ||
        data?.error
        ||
        'REVIEW_FAILED'

      );

    }


    await loadAll();


    msg.textContent =
    action === 'approved'
    ?
    '付款已经确认到账。'
    :
    '付款已拒绝，对应锁定金额已经释放。';


    msg.className =
    'msg ok';

  }
  catch(err){

    console.error(
      err
    );


    msg.textContent =
    translateError(
      err.message
    );


    msg.className =
    'msg err';

  }

}


/* =========================================================
   PAYMENT PROOF
========================================================= */

async function viewProof(storagePath){

  const newWindow =
  window.open(
    '',
    '_blank'
  );


  try{

    const encoded =
    storagePath
    .split('/')
    .map(
      encodeURIComponent
    )
    .join('/');


    const res =
    await api(

      '/storage/v1/object/authenticated/customer-payment-proofs/'
      +
      encoded

    );


    if(!res.ok){

      throw new Error(
        'PROOF_LOAD_FAILED'
      );

    }


    const blob =
    await res.blob();


    const url =
    URL.createObjectURL(
      blob
    );


    if(newWindow){

      newWindow.location =
      url;

    }
    else{

      window.location.href =
      url;

    }


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      60000
    );

  }
  catch(err){

    if(newWindow){
      newWindow.close();
    }


    const msg =
    document.getElementById(
      'pageMsg'
    );


    msg.textContent =
    '付款凭证读取失败。';


    msg.className =
    'msg err';

  }

}


/* =========================================================
   ERRORS
========================================================= */

function translateError(message){

  const text =
  String(
    message
    ||
    ''
  );


  if(
    text.includes(
      'ADMIN_AAL2_REQUIRED'
    )
    ||
    text.includes(
      'NOT_ADMIN'
    )
  ){

    return '管理员二次验证已经失效，请返回管理中心重新验证。';

  }


  if(
    text.includes(
      'PAYMENT_SUBMISSION_NOT_FOUND'
    )
  ){

    return '没有找到这笔付款申请。';

  }


  if(
    text.includes(
      'PAYMENT_ALREADY_REVIEWED'
    )
  ){

    return '这笔付款已经被处理，请刷新页面。';

  }


  if(
    text.includes(
      'PAYMENT_PROOF_REQUIRED_FOR_APPROVAL'
    )
  ){

    return '客户还没有上传付款凭证，不能确认到账。';

  }


  if(
    text.includes(
      'CONFIRMED_AMOUNT_EXCEEDS_ORDER_TOTAL'
    )
    ||
    text.includes(
      'APPROVED_AMOUNT_EXCEEDS_ORDER'
    )
  ){

    return '确认金额超过客户本期订单金额，操作已被阻止。';

  }


  return (
    text
    ||
    '操作失败，请重新尝试。'
  );

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function startAutoRefresh(){

  if(autoTimer){

    clearInterval(
      autoTimer
    );

  }


  autoTimer =
  setInterval(

    ()=>{

      loadAll();

    },

    15000

  );

}


/* =========================================================
   START
========================================================= */

(async function start(){

  const isAdmin =
  await verifyAdmin();


  if(!isAdmin){

    document
    .getElementById(
      'authError'
    )
    .classList
    .remove(
      'hidden'
    );


    return;

  }


  document
  .getElementById(
    'mainBox'
  )
  .classList
  .remove(
    'hidden'
  );


  await loadAll();


  startAutoRefresh();

})();
