<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">

<title>金满堂 · 客户管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top,
      #251907 0,
      #0d0c0a 38%,
      #070708 100%
    );
  color:#f7f0df;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.wrap{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:22px 15px 55px;
}

.brand{
  text-align:center;
  margin-bottom:20px;
}

.mark{
  width:68px;
  height:68px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 10px;
  font-size:27px;
  font-weight:900;
  color:#f6da86;
  border:1px solid #b98a2c;
  background:
    linear-gradient(
      145deg,
      #382506,
      #100d08
    );
  box-shadow:
    0 0 28px rgba(235,185,62,.22);
}

.cn{
  font-weight:900;
  font-size:25px;
  letter-spacing:4px;
  color:#f3d889;
}

.en{
  font-size:10px;
  letter-spacing:3px;
  color:#9f916d;
  margin-top:5px;
}

.card{
  background:
    linear-gradient(
      180deg,
      rgba(22,22,22,.98),
      rgba(11,11,12,.98)
    );
  border:1px solid rgba(214,168,63,.30);
  border-radius:22px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:
    0 22px 60px rgba(0,0,0,.32);
}

.title{
  font-size:16px;
  font-weight:900;
  color:#dfc575;
  margin-bottom:14px;
}

input{
  width:100%;
  border:1px solid rgba(214,168,63,.24);
  background:#101011;
  color:#fff;
  border-radius:13px;
  padding:14px;
  font-size:15px;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  background:
    linear-gradient(
      180deg,
      #f1d784,
      #b47d20
    );
  color:#171109;
}

button.secondary{
  background:#171718;
  color:#d9c37c;
  border:1px solid rgba(214,168,63,.22);
}

button.danger{
  background:#1b1717;
  color:#d9a4a4;
  border:1px solid rgba(180,100,100,.22);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
}

.refreshBtn{
  width:auto;
  min-width:94px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.summaryBox{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:13px;
}

.summaryBox small{
  display:block;
  color:#817a6d;
  font-size:10px;
  margin-bottom:6px;
}

.summaryBox strong{
  display:block;
  color:#ebcd72;
  font-size:20px;
}

.customer{
  border:1px solid rgba(214,168,63,.19);
  border-radius:17px;
  padding:14px;
  margin-top:12px;
  background:#0e0e0f;
}

.customerHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.customerName{
  color:#f0d077;
  font-size:17px;
  font-weight:900;
}

.customerCode{
  color:#a99b75;
  font-size:11px;
  margin-top:4px;
}

.customerMeta{
  color:#888174;
  font-size:12px;
  line-height:1.7;
}

.status{
  padding:6px 9px;
  border-radius:99px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.status.active{
  background:rgba(68,143,87,.14);
  color:#89d09d;
}

.status.other{
  background:rgba(163,100,64,.14);
  color:#d0a07f;
}

.account{
  margin-top:11px;
  padding:13px;
  border-radius:14px;
  background:#131314;
  border:1px solid rgba(255,255,255,.055);
}

.accountHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.accountType{
  color:#e5c96f;
  font-weight:900;
  font-size:14px;
}

.verify{
  padding:5px 8px;
  border-radius:99px;
  font-size:10px;
  font-weight:900;
}

.verify.yes{
  background:rgba(64,145,88,.14);
  color:#86d19c;
}

.verify.no{
  background:rgba(172,126,42,.14);
  color:#ddbc65;
}

.accountRow{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:6px 0;
  font-size:12px;
  border-bottom:1px solid rgba(255,255,255,.045);
}

.accountRow:last-of-type{
  border-bottom:0;
}

.accountRow span{
  color:#777166;
}

.accountRow strong{
  color:#e9dfc7;
  text-align:right;
  word-break:break-all;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.empty{
  text-align:center;
  color:#7f786b;
  padding:28px 10px;
  font-size:13px;
}

.msg{
  min-height:18px;
  margin-top:10px;
  text-align:center;
  color:#aaa18d;
  font-size:12px;
  line-height:1.6;
}

.msg.ok{
  color:#70d49c;
}

.msg.err{
  color:#e89191;
}

.back{
  display:block;
  text-decoration:none;
  text-align:center;
  padding:13px;
  border-radius:13px;
  margin-bottom:14px;
  color:#d8bf73;
  background:#121213;
  border:1px solid rgba(214,168,63,.18);
}

.hidden{
  display:none!important;
}

.foot{
  text-align:center;
  color:#706b62;
  font-size:10px;
  margin-top:24px;
}

@media(max-width:560px){

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .refreshBtn{
    width:100%;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">

    <div class="mark">
      金
    </div>

    <div class="cn">
      金满堂
    </div>

    <div class="en">
      CUSTOMER MANAGEMENT
    </div>

  </div>


  <a
    class="back"
    href="/admin/">
    ← 返回管理中心
  </a>


  <div
    id="authError"
    class="card hidden">

    <div class="title">
      无法进入客户管理
    </div>

    <div
      id="authErrorText"
      class="msg err">
      请先登录管理员账号并完成二次验证。
    </div>

  </div>


  <main id="mainBox" class="hidden">

    <section class="card">

      <div class="title">
        客户概况
      </div>

      <div class="summary">

        <div class="summaryBox">
          <small>客户总数</small>
          <strong id="customerTotal">
            0
          </strong>
        </div>

        <div class="summaryBox">
          <small>正常客户</small>
          <strong id="activeTotal">
            0
          </strong>
        </div>

        <div class="summaryBox">
          <small>待确认收款方式</small>
          <strong id="pendingTotal">
            0
          </strong>
        </div>

      </div>

    </section>


    <section class="card">

      <div class="title">
        客户搜索
      </div>

      <div class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="客户编号、用户名、姓名、电话"
          oninput="renderCustomers()">

        <button
          class="secondary refreshBtn"
          onclick="loadCustomers()">
          刷新
        </button>

      </div>

      <div
        id="pageMsg"
        class="msg">
      </div>

    </section>


    <section class="card">

      <div class="title">
        客户与收款方式
      </div>

      <div id="customerList">

        <div class="empty">
          正在读取客户资料...
        </div>

      </div>

    </section>

  </main>


  <div class="foot">
    © 2022 JIN MANTANG · ADMIN CUSTOMER SYSTEM
  </div>

</div>


<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let customers =
[];


let payoutAccounts =
[];


let refreshPromise =
null;


/* =========================================================
   SESSION
========================================================= */

function saveSession(data){

  if(
    data?.access_token
  ){

    token =
    data.access_token;


    localStorage.setItem(
      'jmt_access_token',
      token
    );


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

  }


  if(
    data?.refresh_token
  ){

    refreshToken =
    data.refresh_token;


    localStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );


    sessionStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

  }

}


function getJwtPayload(){

  try{

    let part =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');


    while(
      part.length % 4
    ){

      part += '=';

    }


    return JSON.parse(

      decodeURIComponent(

        atob(part)
        .split('')
        .map(
          c =>
          '%'
          +
          (
            '00'
            +
            c.charCodeAt(0)
            .toString(16)
          )
          .slice(-2)
        )
        .join('')

      )

    );

  }
  catch{

    return {};

  }

}


async function refreshAdminSession(){

  if(
    !refreshToken
  ){

    return false;

  }


  if(
    refreshPromise
  ){

    return refreshPromise;

  }


  refreshPromise =
  (
    async()=>{

      try{

        const res =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:'POST',

            headers:{

              apikey:
              KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(
          !res.ok
        ){

          return false;

        }


        const data =
        await res.json();


        if(
          !data.access_token
        ){

          return false;

        }


        saveSession(
          data
        );


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:
        KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let res =
  await request();


  if(
    res.status
    !==
    401
  ){

    return res;

  }


  const refreshed =
  await refreshAdminSession();


  if(
    !refreshed
  ){

    return res;

  }


  return request();

}


/* =========================================================
   VERIFY ADMIN
========================================================= */

async function verifyAdmin(){

  if(
    !token
  ){

    return false;

  }


  const payload =
  getJwtPayload();


  if(
    payload.aal
    !==
    'aal2'
  ){

    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(
      !userRes.ok
    ){

      return false;

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(
      !adminRes.ok
    ){

      return false;

    }


    const rows =
    await adminRes.json();


    return (
      Array.isArray(rows)
      &&
      rows.length > 0
    );

  }
  catch{

    return false;

  }

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


function methodName(type){

  if(
    type ===
    'kpay'
  ){

    return 'KPay';

  }


  if(
    type ===
    'bank'
  ){

    return '银行账户';

  }


  return type;

}


function customerAccounts(
  customerId
){

  return payoutAccounts.filter(

    item =>
    item.customer_id
    ===
    customerId

  );

}


function accountHtml(account){

  const verified =
  account.is_verified
  ===
  true;


  return `

    <div class="account">

      <div class="accountHead">

        <div class="accountType">
          ${esc(methodName(account.method_type))}
        </div>

        <div
          class="verify ${verified ? 'yes' : 'no'}">

          ${
            verified
            ?
            '已确认'
            :
            '待确认'
          }

        </div>

      </div>


      ${
        account.method_type === 'bank'
        ?
        `
          <div class="accountRow">
            <span>银行名称</span>
            <strong>${esc(account.bank_name || '—')}</strong>
          </div>
        `
        :
        ''
      }


      <div class="accountRow">
        <span>户名</span>
        <strong>${esc(account.account_name)}</strong>
      </div>


      <div class="accountRow">
        <span>账号 / 手机</span>
        <strong>${esc(account.account_number)}</strong>
      </div>


      <div class="actions">

        <button
          ${verified ? 'disabled' : ''}
          onclick="setVerification(
            '${esc(account.id)}',
            true
          )">

          ${
            verified
            ?
            '已经确认'
            :
            '确认此账户'
          }

        </button>


        <button
          class="danger"
          ${verified ? '' : 'disabled'}
          onclick="setVerification(
            '${esc(account.id)}',
            false
          )">

          取消确认

        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   LOAD
========================================================= */

async function loadCustomers(){

  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.className =
  'msg';


  msg.textContent =
  '正在刷新...';


  try{

    const [
      customerRes,
      accountRes
    ] =
    await Promise.all([

      api(

        '/rest/v1/customer_profiles'
        +
        '?select=id,customer_code,username,display_name,phone,status,created_at'
        +
        '&order=created_at.desc'

      ),

      api(

        '/rest/v1/customer_payout_accounts'
        +
        '?select=id,customer_id,method_type,account_name,account_number,bank_name,is_verified,is_active,created_at,updated_at'
        +
        '&is_active=eq.true'
        +
        '&order=updated_at.desc'

      )

    ]);


    if(
      !customerRes.ok
      ||
      !accountRes.ok
    ){

      throw new Error(
        'LOAD_FAILED'
      );

    }


    customers =
    await customerRes.json();


    payoutAccounts =
    await accountRes.json();


    updateSummary();


    renderCustomers();


    msg.textContent =
    '资料已更新';


    msg.className =
    'msg ok';

  }
  catch(err){

    console.error(
      err
    );


    msg.textContent =
    '读取客户资料失败，请重新登录管理员账号后再试。';


    msg.className =
    'msg err';

  }

}


function updateSummary(){

  document
  .getElementById(
    'customerTotal'
  )
  .textContent =
  customers.length;


  document
  .getElementById(
    'activeTotal'
  )
  .textContent =
  customers.filter(

    item =>
    item.status
    ===
    'active'

  )
  .length;


  document
  .getElementById(
    'pendingTotal'
  )
  .textContent =
  payoutAccounts.filter(

    item =>
    item.is_verified
    !==
    true

  )
  .length;

}


/* =========================================================
   RENDER
========================================================= */

function renderCustomers(){

  const list =
  document.getElementById(
    'customerList'
  );


  const query =
  document
  .getElementById(
    'searchInput'
  )
  .value
  .trim()
  .toLowerCase();


  let rows =
  customers;


  if(
    query
  ){

    rows =
    customers.filter(

      item => {

        const text =
        [
          item.customer_code,
          item.username,
          item.display_name,
          item.phone
        ]
        .join(' ')
        .toLowerCase();


        return text.includes(
          query
        );

      }

    );

  }


  if(
    !rows.length
  ){

    list.innerHTML =
    `
      <div class="empty">
        没有找到客户
      </div>
    `;


    return;

  }


  list.innerHTML =
  rows.map(

    customer => {

      const accounts =
      customerAccounts(
        customer.id
      );


      return `

        <div class="customer">

          <div class="customerHead">

            <div>

              <div class="customerName">
                ${esc(customer.display_name || '未填写姓名')}
              </div>

              <div class="customerCode">
                ${esc(customer.customer_code || '—')}
              </div>

            </div>


            <div
              class="status ${
                customer.status === 'active'
                ?
                'active'
                :
                'other'
              }">

              ${
                customer.status === 'active'
                ?
                '正常'
                :
                esc(customer.status)
              }

            </div>

          </div>


          <div class="customerMeta">

            用户名：
            ${esc(customer.username || '—')}
            <br>

            电话：
            ${esc(customer.phone || '—')}

          </div>


          ${
            accounts.length
            ?
            accounts
            .map(
              accountHtml
            )
            .join('')
            :
            `
              <div class="empty">
                暂无收款方式
              </div>
            `
          }

        </div>

      `;

    }

  )
  .join('');

}


/* =========================================================
   VERIFY ACCOUNT
========================================================= */

async function setVerification(
  accountId,
  verified
){

  const actionText =
  verified
  ?
  '确认'
  :
  '取消确认';


  const ok =
  window.confirm(

    verified
    ?
    '确认此客户的收款资料正确吗？'
    :
    '确定取消此收款方式的确认状态吗？'

  );


  if(
    !ok
  ){

    return;

  }


  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.textContent =
  actionText
  +
  '中...';


  msg.className =
  'msg';


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_set_customer_payout_verification',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_account_id:
          accountId,

          p_verified:
          verified

        })

      }

    );


    const text =
    await res.text();


    let data =
    null;


    try{

      data =
      text
      ?
      JSON.parse(
        text
      )
      :
      null;

    }
    catch{

      data =
      text;

    }


    if(
      !res.ok
    ){

      throw new Error(

        data?.message
        ||
        data?.error
        ||
        'VERIFY_FAILED'

      );

    }


    msg.textContent =
    verified
    ?
    '收款方式已经确认。'
    :
    '收款方式已取消确认。';


    msg.className =
    'msg ok';


    await loadCustomers();

  }
  catch(err){

    console.error(
      err
    );


    let text =
    String(
      err.message
      ||
      ''
    );


    if(
      text.includes(
        'ADMIN_AAL2_REQUIRED'
      )
    ){

      text =
      '管理员二次验证已经失效，请返回管理中心重新验证。';

    }


    msg.textContent =
    text
    ||
    '操作失败，请重试。';


    msg.className =
    'msg err';

  }

}


/* =========================================================
   START
========================================================= */

(async function start(){

  const isAdmin =
  await verifyAdmin();


  if(
    !isAdmin
  ){

    document
    .getElementById(
      'authError'
    )
    .classList
    .remove(
      'hidden'
    );


    return;

  }


  document
  .getElementById(
    'mainBox'
  )
  .classList
  .remove(
    'hidden'
  );


  await loadCustomers();

})();

</script>
