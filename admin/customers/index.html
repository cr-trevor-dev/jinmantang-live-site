<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let customers =
[];


let payoutAccounts =
[];


let orders =
[];


let payments =
[];


let proofs =
[];


let rounds =
[];


let refreshPromise =
null;


let autoTimer =
null;


/* =========================================================
   SESSION
========================================================= */

function saveSession(data){

  if(data?.access_token){

    token =
    data.access_token;


    localStorage.setItem(
      'jmt_access_token',
      token
    );


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

  }


  if(data?.refresh_token){

    refreshToken =
    data.refresh_token;


    localStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );


    sessionStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

  }

}


function getJwtPayload(){

  try{

    let part =
    token
    .split('.')[1]
    .replace(/-/g,'+')
    .replace(/_/g,'/');


    while(
      part.length
      %
      4
    ){

      part += '=';

    }


    return JSON.parse(

      decodeURIComponent(

        atob(part)
        .split('')
        .map(

          c =>
          '%'
          +
          (
            '00'
            +
            c.charCodeAt(0)
            .toString(16)
          )
          .slice(-2)

        )
        .join('')

      )

    );

  }
  catch{

    return {};

  }

}


async function refreshAdminSession(){

  if(!refreshToken){

    return false;

  }


  if(refreshPromise){

    return refreshPromise;

  }


  refreshPromise =
  (
    async()=>{

      try{

        const res =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:'POST',

            headers:{

              apikey:
              KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(!res.ok){

          return false;

        }


        const data =
        await res.json();


        if(!data.access_token){

          return false;

        }


        saveSession(
          data
        );


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:
        KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let res =
  await request();


  if(
    res.status
    !==
    401
  ){

    return res;

  }


  const refreshed =
  await refreshAdminSession();


  if(!refreshed){

    return res;

  }


  return request();

}


/* =========================================================
   ADMIN VERIFY
========================================================= */

async function verifyAdmin(){

  if(!token){

    return false;

  }


  const payload =
  getJwtPayload();


  if(
    payload.aal
    !==
    'aal2'
  ){

    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){

      return false;

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(!adminRes.ok){

      return false;

    }


    const rows =
    await adminRes.json();


    return (
      Array.isArray(
        rows
      )
      &&
      rows.length > 0
    );

  }
  catch{

    return false;

  }

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function money(value){

  return new Intl.NumberFormat(

    'en-US',

    {
      maximumFractionDigits:0
    }

  )
  .format(
    Number(
      value
      ||
      0
    )
  );

}


function customerById(id){

  return customers.find(

    customer =>
    customer.id
    ===
    id

  )
  ||
  null;

}


function accountsForCustomer(id){

  return payoutAccounts.filter(

    account =>
    account.customer_id
    ===
    id

  );

}


function ordersForCustomer(id){

  return orders.filter(

    order =>
    order.customer_id
    ===
    id

  );

}


function paymentsForCustomer(id){

  return payments.filter(

    payment =>
    payment.customer_id
    ===
    id

  );

}


function proofForSubmission(id){

  return proofs.find(

    proof =>
    proof.payment_submission_id
    ===
    id

  )
  ||
  null;

}


function roundName(roundId){

  const round =
  rounds.find(

    item =>
    item.id
    ===
    roundId

  );


  if(!round){

    return '—';

  }


  let label =
  round.round_code
  ||
  '';


  if(
    round.round_code
    ===
    '1030'
  ){

    label =
    '上午 11:45';

  }


  if(
    round.round_code
    ===
    '1530'
  ){

    label =
    '下午 3:45';

  }


  return (
    round.round_date
    +
    ' · '
    +
    label
  );

}


function statusText(status){

  const map = {

    active:
    '正常',

    suspended:
    '已限制',

    blocked:
    '已拉黑'

  };


  return map[
    status
  ]
  ||
  status
  ||
  '—';

}


function statusClass(status){

  if(
    status
    ===
    'active'
  ){

    return 'active';

  }


  if(
    status
    ===
    'suspended'
  ){

    return 'suspended';

  }


  return 'blocked';

}


/* =========================================================
   LOAD
========================================================= */

async function loadAll(){

  const msg =
  document.getElementById(
    'pageMsg'
  );


  msg.textContent =
  '正在刷新...';


  msg.className =
  'msg';


  try{

    const responses =
    await Promise.all([

      api(
        '/rest/v1/customer_profiles'
        +
        '?select=id,customer_code,username,display_name,phone,status,restriction_reason,status_changed_at,created_at'
        +
        '&order=created_at.desc'
      ),

      api(
        '/rest/v1/customer_payout_accounts'
        +
        '?select=id,customer_id,method_type,account_name,account_number,bank_name,is_active,is_verified,customer_edit_locked,locked_at,unlocked_at,created_at,updated_at'
        +
        '&is_active=eq.true'
        +
        '&order=updated_at.desc'
      ),

      api(
        '/rest/v1/customer_round_orders'
        +
        '?select=id,round_id,customer_id,status,submitted_total,pending_total,confirmed_total,created_at,updated_at'
        +
        '&order=created_at.desc'
        +
        '&limit=1000'
      ),

      api(
        '/rest/v1/customer_payment_submissions'
        +
        '?select=id,order_id,round_id,customer_id,payment_account_id,declared_amount,confirmed_amount,status,method_name_snapshot,method_type_snapshot,account_name_snapshot,account_number_snapshot,bank_name_snapshot,customer_note,submitted_at,reviewed_at,rejection_reason'
        +
        '&order=submitted_at.desc'
        +
        '&limit=1000'
      ),

      api(
        '/rest/v1/customer_payment_proofs'
        +
        '?select=id,payment_submission_id,customer_id,storage_path,original_name,mime_type,file_size,created_at'
        +
        '&order=created_at.desc'
        +
        '&limit=1000'
      ),

      api(
        '/rest/v1/rounds'
        +
        '?select=id,round_date,round_code,status,deadline_at,game_mode,created_at'
        +
        '&order=created_at.desc'
        +
        '&limit=200'
      )

    ]);


    for(
      const res
      of
      responses
    ){

      if(!res.ok){

        const text =
        await res.text();


        throw new Error(
          text
          ||
          'LOAD_FAILED'
        );

      }

    }


    customers =
    await responses[0]
    .json();


    payoutAccounts =
    await responses[1]
    .json();


    orders =
    await responses[2]
    .json();


    payments =
    await responses[3]
    .json();


    proofs =
    await responses[4]
    .json();


    rounds =
    await responses[5]
    .json();


    updateSummary();


    renderPendingPayments();


    renderCustomers();


    msg.textContent =
    '资料已更新';


    msg.className =
    'msg ok';

  }
  catch(err){

    console.error(
      err
    );


    msg.textContent =
    '读取客户资料失败，请返回管理中心重新登录后再试。';


    msg.className =
    'msg err';

  }

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

/* =========================================================
   CUSTOMER STATUS
========================================================= */

async function setCustomerStatus(
  customerId,
  newStatus
){

  const customer =
  customerById(
    customerId
  );


  if(!customer){

    return;

  }


  let reason =
  null;


  if(
    newStatus
    ===
    'suspended'
  ){

    reason =
    window.prompt(

      '请输入限制原因，客户登录后会看到这段说明：',

      '账户暂时受限，请联系客服。'

    );


    if(reason === null){

      return;

    }


    reason =
    reason.trim()
    ||
    '账户暂时受限，请联系客服。';

  }


  if(
    newStatus
    ===
    'blocked'
  ){

    reason =
    window.prompt(

      '请输入拉黑原因，客户登录后会看到这段说明：',

      '账户已停用，请联系客服。'

    );


    if(reason === null){

      return;

    }


    reason =
    reason.trim()
    ||
    '账户已停用，请联系客服。';

  }


  const action =
  newStatus
  ===
  'active'
  ?
  '恢复此客户为正常状态'
  :
  newStatus
  ===
  'suspended'
  ?
  '限制此客户'
  :
  '拉黑此客户';


  const confirmed =
  window.confirm(
    action
    +
    '？'
  );


  if(!confirmed){

    return;

  }


  setPageMessage(
    '正在更新客户状态...'
  );


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_set_customer_status',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_customer_id:
          customerId,

          p_status:
          newStatus,

          p_reason:
          reason

        })

      }

    );


    const data =
    await parseAdminResponse(
      res
    );


    await loadAll();


    setPageMessage(

      data?.status
      ===
      'active'
      ?
      '客户已经恢复正常。'
      :
      data?.status
      ===
      'suspended'
      ?
      '客户已经限制。'
      :
      '客户已经拉黑。',

      'ok'

    );

  }
  catch(err){

    setPageMessage(
      translateError(
        err.message
      ),
      'err'
    );

  }

}

/* =========================================================
   PAYMENT REVIEW
========================================================= */

async function reviewPayment(
  submissionId,
  action
){

  let reason =
  null;


  if(
    action
    ===
    'approved'
  ){

    const confirmed =
    window.confirm(

      '请确认已经核对付款凭证，并且平台确实收到这笔款项。确认到账吗？'

    );


    if(!confirmed){

      return;

    }

  }
  else{

    reason =
    window.prompt(

      '请输入拒绝原因：',

      '付款凭证或付款金额不正确'

    );


    if(reason === null){

      return;

    }


    reason =
    reason.trim()
    ||
    '付款未通过审核';

  }


  setPageMessage(

    action
    ===
    'approved'
    ?
    '正在确认付款...'
    :
    '正在拒绝付款...'

  );


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_review_customer_payment',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_submission_id:
          submissionId,

          p_action:
          action,

          p_rejection_reason:
          action
          ===
          'rejected'
          ?
          reason
          :
          null

        })

      }

    );


    await parseAdminResponse(
      res
    );


    await loadAll();


    setPageMessage(

      action
      ===
      'approved'
      ?
      '付款已经确认到账。'
      :
      '付款已拒绝，对应锁定金额已经释放。',

      'ok'

    );

  }
  catch(err){

    setPageMessage(
      translateError(
        err.message
      ),
      'err'
    );

  }

}


/* =========================================================
   PROOF
========================================================= */

async function viewProof(storagePath){

  const newWindow =
  window.open(
    '',
    '_blank'
  );


  try{

    const encoded =
    storagePath
    .split('/')
    .map(
      encodeURIComponent
    )
    .join('/');


    const res =
    await api(

      '/storage/v1/object/authenticated/customer-payment-proofs/'
      +
      encoded

    );


    if(!res.ok){

      throw new Error(
        'PROOF_LOAD_FAILED'
      );

    }


    const blob =
    await res.blob();


    const url =
    URL.createObjectURL(
      blob
    );


    if(newWindow){

      newWindow.location =
      url;

    }
    else{

      window.location.href =
      url;

    }


    setTimeout(

      ()=>{

        URL.revokeObjectURL(
          url
        );

      },

      60000

    );

  }
  catch(err){

    if(newWindow){

      newWindow.close();

    }


    setPageMessage(
      '付款凭证读取失败。',
      'err'
    );

  }

}


/* =========================================================
   RESPONSE
========================================================= */

async function parseAdminResponse(res){

  const text =
  await res.text();


  let data =
  null;


  try{

    data =
    text
    ?
    JSON.parse(
      text
    )
    :
    null;

  }
  catch{

    data =
    text;

  }


  if(!res.ok){

    throw new Error(

      data?.message
      ||
      data?.error
      ||
      data?.hint
      ||
      text
      ||
      'REQUEST_FAILED'

    );

  }


  return data;

}

}


/* =========================================================
   ERRORS
========================================================= */

function translateError(message){

  const text =
  String(
    message
    ||
    ''
  );


  if(
    text.includes(
      'ADMIN_AAL2_REQUIRED'
    )
    ||
    text.includes(
      'NOT_ADMIN'
    )
  ){

    return '管理员二次验证已经失效，请返回管理中心重新验证。';

  }


  if(
    text.includes(
      'INVALID_CUSTOMER_STATUS'
    )
  ){

    return '客户状态不正确。';

  }


  if(
    text.includes(
      'CUSTOMER_NOT_FOUND'
    )
  ){

    return '没有找到这个客户。';

  }


  if(
    text.includes(
      'CUSTOMER_PAYOUT_ACCOUNT_NOT_FOUND'
    )
  ){

    return '没有找到这个客户收款账户。';

  }


  if(
    text.includes(
      'PAYMENT_SUBMISSION_NOT_FOUND'
    )
  ){

    return '没有找到这笔付款申请。';

  }


  if(
    text.includes(
      'PAYMENT_ALREADY_REVIEWED'
    )
  ){

    return '这笔付款已经被处理，请刷新页面。';

  }


  if(
    text.includes(
      'PAYMENT_PROOF_REQUIRED_FOR_APPROVAL'
    )
  ){

    return '客户还没有上传付款凭证，不能确认到账。';

  }


  if(
    text.includes(
      'CONFIRMED_AMOUNT_EXCEEDS_ORDER_TOTAL'
    )
    ||
    text.includes(
      'APPROVED_AMOUNT_EXCEEDS_ORDER'
    )
  ){

    return '确认金额超过客户本期下注总额，系统已经阻止操作。';

  }


  return (
    text
    ||
    '操作失败，请重新尝试。'
  );

}

    .remove(
      'hidden'
    );


    return;

  }


  document
  .getElementById(
    'mainBox'
  )
  .classList
  .remove(
    'hidden'
  );


  await loadAll();


  startAutoRefresh();

})();

</script>
