<!doctype html>
<html lang="zh-CN">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1">

<meta
  name="theme-color"
  content="#09090a">

<title>金满堂 · 期数档案</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
  radial-gradient(
    circle at top,
    #251907 0,
    #0d0c0a 38%,
    #070708 100%
  );
  color:#f5edd9;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Arial,
  sans-serif;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:22px 15px 60px;
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:20px;
}

.headTitle{
  color:#efd477;
  font-size:27px;
  font-weight:900;
  line-height:1.35;
}

.headSub{
  color:#817a6d;
  font-size:10px;
  letter-spacing:3px;
  margin-top:6px;
}

.back{
  text-decoration:none;
  color:#efd477;
  background:#181819;
  border:
  1px solid
  rgba(214,168,63,.28);
  border-radius:15px;
  padding:12px 15px;
  font-size:12px;
  font-weight:900;
  flex:none;
}

.card{
  background:
  linear-gradient(
    180deg,
    rgba(22,22,22,.98),
    rgba(11,11,12,.98)
  );
  border:
  1px solid
  rgba(214,168,63,.28);
  border-radius:21px;
  padding:17px;
  margin-bottom:14px;
}

.title{
  color:#dfc575;
  font-size:17px;
  font-weight:900;
  margin-bottom:13px;
}

.selector{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
}

select{
  width:100%;
  border:
  1px solid
  rgba(214,168,63,.23);
  background:#101011;
  color:#f5edd9;
  border-radius:12px;
  padding:13px;
  font-size:14px;
  outline:none;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  background:
  linear-gradient(
    180deg,
    #efd47d,
    #b87c1e
  );
  color:#171008;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.summary{
  display:grid;
  grid-template-columns:
  repeat(4,1fr);
  gap:9px;
}

.box{
  background:#101011;
  border:
  1px solid
  rgba(255,255,255,.055);
  border-radius:14px;
  padding:13px;
  min-width:0;
}

.box small{
  display:block;
  color:#777166;
  font-size:10px;
  margin-bottom:6px;
}

.box strong{
  display:block;
  color:#ebcd72;
  font-size:17px;
  line-height:1.35;
  word-break:break-word;
}

.box strong.normal{
  font-size:13px;
  color:#ddd2b7;
}

.green{
  color:#70d49c!important;
}

.red{
  color:#e89090!important;
}

.muted{
  color:#8d8576!important;
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:2px;
}

.tab{
  flex:none;
  width:auto;
  min-width:84px;
  padding:10px 13px;
  border-radius:11px;
  border:
  1px solid
  rgba(214,168,63,.18);
  background:#121213;
  color:#9e947f;
}

.tab.active{
  background:#2b220f;
  color:#efd477;
  border-color:
  rgba(214,168,63,.38);
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.zodiacGrid{
  display:grid;
  grid-template-columns:
  repeat(4,1fr);
  gap:8px;
}

.zodiac{
  padding:12px;
  border-radius:13px;
  background:#101011;
  border:
  1px solid
  rgba(255,255,255,.055);
}

.zodiacName{
  color:#e7cb76;
  font-weight:900;
  font-size:14px;
}

.zodiacMeta{
  color:#777166;
  font-size:10px;
  line-height:1.65;
  margin-top:6px;
}

.list{
  display:grid;
  gap:9px;
}

.item{
  background:#101011;
  border:
  1px solid
  rgba(255,255,255,.055);
  border-radius:15px;
  padding:13px;
}

.itemHead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.itemName{
  color:#ead078;
  font-size:15px;
  font-weight:900;
}

.itemMeta{
  color:#817a6d;
  font-size:10px;
  margin-top:5px;
  line-height:1.6;
}

.badge{
  flex:none;
  padding:5px 8px;
  border-radius:99px;
  background:#28220f;
  color:#d9bf6c;
  font-size:9px;
  font-weight:900;
}

.rows{
  margin-top:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:
  1px solid
  rgba(255,255,255,.045);
  font-size:11px;
}

.row:last-child{
  border-bottom:0;
}

.row span{
  color:#777166;
}

.row strong{
  color:#ddd3bc;
  text-align:right;
  word-break:break-word;
}

.empty{
  text-align:center;
  padding:25px 10px;
  color:#777166;
  font-size:12px;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#15120b;
  border:
  1px solid
  rgba(214,168,63,.16);
  color:#9f9478;
  font-size:11px;
  line-height:1.7;
}

.msg{
  min-height:17px;
  margin-top:9px;
  text-align:center;
  font-size:11px;
  color:#928a7b;
}

.msg.error{
  color:#e89090;
}

.msg.success{
  color:#70d49c;
}

.foot{
  text-align:center;
  color:#666159;
  font-size:9px;
  margin-top:23px;
}

@media(max-width:760px){

  .summary{
    grid-template-columns:
    1fr 1fr;
  }

  .zodiacGrid{
    grid-template-columns:
    1fr 1fr;
  }

}

@media(max-width:500px){

  .headTitle{
    font-size:23px;
  }

  .selector{
    grid-template-columns:1fr;
  }

  .summary{
    grid-template-columns:
    1fr 1fr;
  }

}

</style>

</head>


<body>

<div class="wrap">

  <div class="header">

    <div>

      <div class="headTitle">
        金满堂 · 期数档案
      </div>

      <div class="headSub">
        ADMIN / ROUND DOSSIER
      </div>

    </div>

    <a
      class="back"
      href="/admin/rounds/">
      返回期数管理
    </a>

  </div>


  <section class="card">

    <div class="title">
      选择期数
    </div>

    <div class="selector">

      <select id="roundSelect">

        <option value="">
          正在读取期数...
        </option>

      </select>

      <button
        id="loadBtn"
        type="button"
        onclick="loadSelectedRound()">
        查看档案
      </button>

    </div>

    <div
      id="pageMsg"
      class="msg">
    </div>

  </section>


  <main
    id="dossierBox"
    style="display:none">


    <section class="card">

      <div class="title">
        本期资料
      </div>

      <div
        id="roundSummary"
        class="summary">
      </div>

    </section>


    <section class="card">

      <div class="tabs">

        <button
          type="button"
          class="tab active"
          data-tab="overview"
          onclick="setTab('overview')">
          总览
        </button>

        <button

          class="tab"
          data-tab="zodiac"
          onclick="setTab('zodiac')">
          生肖
        </button>

        <button
          type="button"
          class="tab"
          data-tab="customers"
          onclick="setTab('customers')">
          客户
        </button>

        <button
          type="button"
          class="tab"
          data-tab="agents"
          onclick="setTab('agents')">
          代理
        </button>

      </div>

    </section>


    <section
      id="panel-overview"
      class="panel active">

      <div class="card">

        <div class="title">
          客户与本期金额
        </div>

        <div
          id="customerSummary"
          class="summary">
        </div>

      </div>


      <div class="card">

        <div class="title">
          付款审核
        </div>

        <div
          id="paymentSummary"
          class="summary">
        </div>

      </div>


      <div class="card">

        <div class="title">
          中奖与派彩
        </div>

        <div
          id="payoutSummary"
          class="summary">
        </div>

      </div>


      <div class="card">

        <div class="title">
          退款核对
        </div>

        <div
          id="refundSummary"
          class="summary">
        </div>

        <div
          class="notice"
          style="margin-top:11px">
          退款候选金额不代表平台已经实际退款。
          实际资金流出只看“已实际退款”金额。
        </div>

      </div>


      <div class="card">

        <div class="title">
          代理佣金
        </div>

        <div
          id="commissionSummary"
          class="summary">
        </div>

      </div>

    </section>


    <section
      id="panel-zodiac"
      class="panel">

      <div class="card">

        <div class="title">
          12生肖金额分布
        </div>

        <div
          id="zodiacList"
          class="zodiacGrid">
        </div>

      </div>

    </section>


    <section
      id="panel-customers"
      class="panel">

      <div class="card">

        <div class="title">
          本期客户
        </div>

        <div
          id="customerList"
          class="list">
        </div>

      </div>

    </section>


    <section
      id="panel-agents"
      class="panel">

      <div class="card">

        <div class="title">
          本期代理
        </div>

        <div
          id="agentList"
          class="list">
        </div>

      </div>

    </section>


  </main>


  <div class="foot">
    © JIN MANTANG · ROUND DOSSIER
  </div>

</div>


<script>

const BASE =
location.origin
+
'/supabase';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let refreshToken =
localStorage.getItem(
  'jmt_refresh_token'
)
||
sessionStorage.getItem(
  'jmt_refresh_token'
)
||
'';


let refreshPromise =
null;


let dossier =
null;


const zodiacNames = {

  '01':'鼠',
  '02':'牛',
  '03':'虎',
  '04':'兔',
  '05':'龙',
  '06':'蛇',
  '07':'马',
  '08':'羊',
  '09':'猴',
  '10':'鸡',
  '11':'狗',
  '12':'猪'

};


/* =========================================================
   SESSION
========================================================= */

function saveSession(data){

  if(data?.access_token){

    token =
    data.access_token;

    localStorage.setItem(
      'jmt_access_token',
      token
    );

    sessionStorage.setItem(
      'jmt_access_token',
      token
    );

  }


  if(data?.refresh_token){

    refreshToken =
    data.refresh_token;

    localStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

    sessionStorage.setItem(
      'jmt_refresh_token',
      refreshToken
    );

  }

}


async function refreshAdminSession(){

  if(!refreshToken){

    return false;

  }


  if(refreshPromise){

    return refreshPromise;

  }


  refreshPromise =
  (
    async()=>{

      try{

        const res =
        await fetch(

          BASE
          +
          '/auth/v1/token?grant_type=refresh_token',

          {

            method:'POST',

            headers:{

              apikey:KEY,

              'Content-Type':
              'application/json'

            },

            body:
            JSON.stringify({

              refresh_token:
              refreshToken

            })

          }

        );


        if(!res.ok){

          return false;

        }


        const data =
        await res.json();


        if(!data.access_token){

          return false;

        }


        saveSession(
          data
        );


        return true;

      }
      catch{

        return false;

      }
      finally{

        refreshPromise =
        null;

      }

    }
  )();


  return refreshPromise;

}


async function api(
  path,
  options={}
){

  const request =
  ()=>fetch(

    BASE
    +
    path,

    {

      ...options,

      headers:{

        apikey:KEY,

        Authorization:
        'Bearer '
        +
        token,

        ...(
          options.headers
          ||
          {}
        )

      }

    }

  );


  let res =
  await request();


  if(
    res.status
    !==
    401
  ){

    return res;

  }


  const refreshed =
  await refreshAdminSession();


  if(!refreshed){

    return res;

  }


  return request();

}


/* =========================================================
   VERIFY ADMIN
========================================================= */

async function verifyAdmin(){

  if(!token){

    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){

      return false;

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(

      '/rest/v1/admin_users'
      +
      '?auth_user_id=eq.'
      +
      encodeURIComponent(
        user.id
      )
      +
      '&select=auth_user_id'
      +
      '&limit=1'

    );


    if(!adminRes.ok){

      return false;

    }


    const rows =
    await adminRes.json();


    return (
      Array.isArray(
        rows
      )
      &&
      rows.length > 0
    );

  }
  catch{

    return false;

  }

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value
    ??
    ''
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function money(value){

  return new Intl.NumberFormat(
    'en-US',
    {
      maximumFractionDigits:2
    }
  )
  .format(
    Number(
      value
      ||
      0
    )
  );

}


function dateTime(value){

  if(!value){

    return '—';

  }


  try{

    return new Date(
      value
    )
    .toLocaleString(
      'zh-CN',
      {
        timeZone:
        'Asia/Yangon'
      }
    );

  }
  catch{

    return '—';

  }

}


function periodName(
  code
){

  if(
    code
    ===
    '1030'
  ){

    return '上午 11:45';

  }


  if(
    code
    ===
    '1530'
  ){

    return '下午 15:45';

  }


  return (
    code
    ||
    '—'
  );

}


function statusText(
  status
){

  const map = {

    open:
    '开放中',

    settled:
    '已结算',

    draft:
    '已保存',

    payment_pending:
    '付款审核中',

    confirmed:
    '已确认',

    locked:
    '已锁定',

    pending:
    '待处理',

    partial:
    '部分完成',

    paid:
    '已完成',

    refunded:
    '已退款',

    cancelled:
    '已结案',

    none:
    '无'

  };


  return (
    map[status]
    ||
    status
    ||
    '—'
  );

}


function box(
  label,
  value,
  className=''
){

  return `

    <div class="box">

      <small>
        ${esc(label)}
      </small>

      <strong class="${esc(className)}">
        ${esc(value)}
      </strong>

    </div>

  `;

}


function setMessage(
  text,
  type=''
){

  const el =
  document.getElementById(
    'pageMsg'
  );


  el.textContent =
  text;


  el.className =
  'msg'
  +
  (
    type
    ?
    ' '
    +
    type
    :
    ''
  );

}


/* =========================================================
   LOAD ROUND LIST
========================================================= */

async function loadRoundList(){

  const res =
  await api(

    '/rest/v1/rounds'
    +
    '?select=id,round_date,round_code,status,result_number,created_at'
    +
    '&order=round_date.desc,round_code.desc'
    +
    '&limit=100'

  );


  if(!res.ok){

    throw new Error(
      await res.text()
    );

  }


  const rows =
  await res.json();


  const select =
  document.getElementById(
    'roundSelect'
  );


  if(
    !Array.isArray(rows)
    ||
    !rows.length
  ){

    select.innerHTML =
    `
      <option value="">
        暂无期数
      </option>
    `;

    return;

  }


  const requested =
  new URLSearchParams(
    location.search
  )
  .get(
    'round'
  );


  select.innerHTML =
  rows
  .map(
    row => {

      const label =
      row.round_date
      +
      ' · '
      +
      periodName(
        row.round_code
      )
      +
      ' · '
      +
      statusText(
        row.status
      )
      +
      (
        row.result_number
        ?
        ' · 开奖 '
        +
        (
          zodiacNames[
            row.result_number
          ]
          ||
          row.result_number
        )
        :
        ''
      );


      return `

        <option
          value="${esc(row.id)}"
          ${
            requested
            &&
            requested === row.id
            ?
            'selected'
            :
            ''
          }>
          ${esc(label)}
        </option>

      `;

    }
  )
  .join('');


  if(
    requested
    &&
    !rows.some(
      row =>
      row.id === requested
    )
  ){

    select.value =
    rows[0].id;

  }


  await loadSelectedRound();

}


/* =========================================================
   LOAD DOSSIER
========================================================= */

async function loadSelectedRound(){

  const roundId =
  document.getElementById(
    'roundSelect'
  )
  .value;


  if(!roundId){

    return;

  }


  const btn =
  document.getElementById(
    'loadBtn'
  );


  btn.disabled =
  true;


  setMessage(
    '正在读取本期完整档案...'
  );


  try{

    const res =
    await api(

      '/rest/v1/rpc/admin_round_dossier',

      {

        method:'POST',

        headers:{

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          p_round_id:
          roundId

        })

      }

    );


    const text =
    await res.text();


    let data =
    null;


    try{

      data =
      text
      ?
      JSON.parse(
        text
      )
      :
      null;

    }
    catch{

      data =
      text;

    }


    if(!res.ok){

      throw new Error(

        data?.message
        ||
        data?.error
        ||
        text
        ||
        'REQUEST_FAILED'

      );

    }


    dossier =
    data;


    history.replaceState(
      null,
      '',
      '/admin/rounds/file.html?round='
      +
      encodeURIComponent(
        roundId
      )
    );


    renderDossier();


    document.getElementById(
      'dossierBox'
    )
    .style.display =
    'block';


    setMessage(
      '本期档案已更新',
      'success'
    );

  }
  catch(err){

    console.error(
      err
    );


    setMessage(
      translateError(
        err.message
      ),
      'error'
    );

  }
  finally{

    btn.disabled =
    false;

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderDossier(){

  if(
    !dossier
    ||
    !dossier.round
  ){

    return;

  }


  renderRoundSummary();

  renderOverview();

  renderZodiac();

  renderCustomers();

  renderAgents();

}


function renderRoundSummary(){

  const r =
  dossier.round;


  const result =
  r.result_number
  ?
  (
    zodiacNames[
      r.result_number
    ]
    ||
    r.result_number
  )
  :
  '尚未开奖';


  document.getElementById(
    'roundSummary'
  )
  .innerHTML =

    box(
      '日期',
      r.round_date
      ||
      '—',
      'normal'
    )

    +

    box(
      '期数',
      periodName(
        r.round_code
      ),
      'normal'
    )

    +

    box(
      '状态',
      statusText(
        r.status
      ),
      r.status === 'settled'
      ?
      'green'
      :
      ''
    )

    +

    box(
      '开奖结果',
      result,
      r.result_number
      ?
      'green'
      :
      'muted'
    )

    +

    box(
      '截止时间',
      dateTime(
        r.deadline_at
      ),
      'normal'
    )

    +

    box(
      '结算时间',
      dateTime(
        r.settled_at
      ),
      'normal'
    )

    +

    box(
      '游戏模式',
      r.game_mode
      ||
      '—',
      'normal'
    )

    +

    box(
      '赔率',
      money(
        r.payout_multiplier

/* =========================================================

function setTab(
  name
){

  document
  .querySelectorAll(
    '.tab'
  )
  .forEach(
    el => {

      el.classList.toggle(
        'active',
        el.dataset.tab === name
      );

    }
  );


  document
  .querySelectorAll(
    '.panel'
  )
  .forEach(
    el => {

      el.classList.toggle(
        'active',
        el.id ===
        'panel-'
        +
        name
      );

    }
  );

}


/* =========================================================
   ERRORS
========================================================= */

function translateError(
  message
){

  const text =
  String(
    message
    ||
    ''
  );


  if(
    text.includes(
      'ADMIN_AAL2_REQUIRED'
    )
  ){

    return '管理员二次验证已经失效，请返回总后台重新验证。';

  }


  if(
    text.includes(
      'ROUND_NOT_FOUND'
    )
  ){

    return '没有找到这期资料。';

  }


  return (
    text
    ||
    '读取失败，请重新尝试。'
  );

}
