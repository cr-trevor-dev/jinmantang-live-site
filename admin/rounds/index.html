<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <title>金满堂 · 期数管理</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:
        radial-gradient(circle at 50% 0%,rgba(160,105,0,.18),transparent 35%),
        #09090a;
      color:#f2d77c;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
      "Microsoft YaHei",Arial,sans-serif;
    }

    .wrap{
      width:min(920px,100%);
      margin:auto;
      padding:45px 28px 70px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:38px;
    }

    h1{
      margin:0;
      font-size:34px;
      letter-spacing:1px;
    }

    .sub{
      color:#8e887b;
      letter-spacing:5px;
      margin-top:8px;
      font-size:14px;
    }

    .btn{
      border:1px solid #5e4b1d;
      background:#171719;
      color:#efd477;
      border-radius:20px;
      padding:17px 24px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      display:inline-block;
    }

    .card{
      background:linear-gradient(180deg,#151516,#101011);
      border:1px solid #5b481c;
      border-radius:30px;
      padding:30px;
      margin-bottom:28px;
      box-shadow:0 15px 50px rgba(0,0,0,.25);
    }

    .title{
      font-size:22px;
      font-weight:800;
      margin-bottom:24px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .box{
      min-height:125px;
      background:#0d0d0e;
      border:1px solid #292929;
      border-radius:22px;
      padding:22px;
    }

    .label{
      color:#817c72;
      font-size:15px;
      margin-bottom:12px;
    }

    .value{
      font-size:25px;
      font-weight:800;
      color:#f1d574;
      line-height:1.4;
    }

    .green{color:#58d79a}

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-top:22px;
    }

    button{
      width:100%;
      border-radius:20px;
      padding:19px 15px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }

    .end{
      border:1px solid #7b5522;
      background:linear-gradient(180deg,#f0d37a,#c78d25);
      color:#111;
    }

    .new{
      border:1px solid #5e4b1d;
      background:#181819;
      color:#efd477;
    }

    .notice{
      margin-top:20px;
      padding:18px;
      border-radius:17px;
      background:#0d0d0e;
      color:#928b7c;
      line-height:1.7;
      font-size:14px;
    }

    .danger{
      color:#e6aa62;
    }

    .footer{
      text-align:center;
      color:#69655e;
      margin-top:45px;
      font-size:13px;
      letter-spacing:1px;
    }

    @media(max-width:650px){
      .wrap{padding:35px 18px 60px}
      h1{font-size:27px}
      .grid,.actions{grid-template-columns:1fr}
      .card{padding:22px}
      .top{align-items:flex-start}
      .btn{padding:14px 17px}
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div>
      <h1>金满堂 · 期数管理</h1>
      <div class="sub">ADMIN / ROUND CONTROL</div>
    </div>

    <a class="btn" href="../">返回总后台</a>
  </div>

  <section class="card">

    <div class="title">当前期数</div>

    <div class="grid">

      <div class="box">
        <div class="label">当前期</div>
        <div class="value" id="roundName">正在读取...</div>
      </div>

      <div class="box">
        <div class="label">状态</div>
        <div class="value green" id="roundStatus">正在读取...</div>
      </div>

      <div class="box">
        <div class="label">截止时间</div>
        <div class="value" id="closeTime">—</div>
      </div>

      <div class="box">
        <div class="label">Myanmar Time</div>
        <div class="value" id="mmTime">--:--:--</div>
      </div>

    </div>

  </section>


  <section class="card">

    <div class="title">期数操作</div>

    <div class="actions">

      <button class="end" onclick="finishRound()">
        结束本期并归档
      </button>

      <button class="new" onclick="newRound()">
        开启下一期
      </button>

    </div>

    <div class="notice">
      <span class="danger">重要：</span>
      当前版本先保护你的现有数据。
      在没有确认数据库字段之前，
      按钮不会直接删除、清空或覆盖代理提交记录。
    </div>

  </section>


  <section class="card">

    <div class="title">历史数据</div>

    <a class="btn" href="../../history/">
      查看全部历史期数
    </a>

  </section>

  <div class="footer">
    © 2022 JIN MANTANG · ROUND MANAGEMENT
  </div>

</div>


<script>
  function updateClock(){
    try{
      const now = new Date();

      const time = new Intl.DateTimeFormat(
        "en-GB",
        {
          timeZone:"Asia/Yangon",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit",
          hour12:false
        }
      ).format(now);

      document.getElementById("mmTime").textContent = time;

    }catch(e){
      document.getElementById("mmTime").textContent = "--:--:--";
    }
  }

  updateClock();
  setInterval(updateClock,1000);


  /*
    这里先尝试读取 Admin 已保存到浏览器里的期数资料。
    如果当前系统使用其他数据库来源，
    下一步再连接到你现有的数据。
  */

  function loadRound(){

    let round = null;

    const possibleKeys = [
      "currentRound",
      "jinmantang_current_round",
      "jmt_current_round",
      "round"
    ];

    for(const key of possibleKeys){
      try{
        const raw = localStorage.getItem(key);

        if(raw){
          const parsed = JSON.parse(raw);

          if(parsed && typeof parsed === "object"){
            round = parsed;
            break;
          }
        }
      }catch(e){}
    }


    if(!round){

      document.getElementById("roundName").textContent =
        "等待连接当前期";

      document.getElementById("roundStatus").textContent =
        "数据保护模式";

      document.getElementById("closeTime").textContent =
        "—";

      return;
    }


    const name =
      round.name ||
      round.round_name ||
      round.title ||
      round.round ||
      "当前期";


    const status =
      round.status ||
      "开放中";


    const close =
      round.close_time ||
      round.closeTime ||
      round.deadline ||
      "—";


    document.getElementById("roundName").textContent = name;

    document.getElementById("roundStatus").textContent = status;

    document.getElementById("closeTime").textContent = close;
  }


  function finishRound(){

    const ok = confirm(
      "确定要结束本期吗？\\n\\n" +
      "当前为了保护数据，系统暂时不会真正执行归档。"
    );

    if(!ok) return;

    alert(
      "按钮正常。\\n\\n" +
      "下一步连接现有数据库后，" +
      "这里才会正式执行：结束本期 → 保存历史。"
    );
  }


  function newRound(){

    alert(
      "开启下一期功能已经准备好。\\n\\n" +
      "连接现有数据库后，" +
      "这里将用于创建新的期数。"
    );
  }


  loadRound();
</script>

</body>
</html>
