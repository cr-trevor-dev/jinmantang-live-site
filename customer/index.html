<style>
*{

.card{

.divider{

.two{

.foot{

</style>

<body>

<script>
const BASE =
location.origin + '/supabase';

const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_customer_token'
)
||
'';

let refreshToken =
localStorage.getItem(
  'jmt_customer_refresh_token'
)
||
'';

let profile =
null;

let payoutAccounts =
[];


/* =========================================================
   COMMON
========================================================= */

function showMessage(
  id,
  text,
  type = 'err'
){
  const el =
  document.getElementById(id);

  el.textContent =
  text;

  el.className =
  'msg show ' + type;
}


function clearMessage(id){
  const el =
  document.getElementById(id);

  el.textContent =
  '';

  el.className =
  'msg';
}


function setBusy(
  buttonId,
  busy,
  normalText,
  busyText
){
  const button =
  document.getElementById(buttonId);

  button.disabled =
  busy;

  button.textContent =
  busy
  ? busyText
  : normalText;
}


function authHeaders(){
  return {
    'apikey':KEY,
    'Authorization':
    'Bearer ' + token,
    'Content-Type':
    'application/json'
  };
}


async function parseResponse(res){
  const text =
  await res.text();

  let data =
  null;

  try{
    data =
    text
    ? JSON.parse(text)
    : null;
  }
  catch{
    data =
    text;
  }

  if(!res.ok){
    const message =
    data?.message
    ||
    data?.error_description
    ||
    data?.error
    ||
    data?.hint
    ||
    '请求失败';

    throw new Error(message);
  }

  return data;
}


/* =========================================================
   AUTH UI
========================================================= */

function showAuth(mode){

  const login =
  mode === 'login';

  document
  .getElementById(
    'loginTab'
  )
  .classList
  .toggle(
    'active',
    login
  );

  document
  .getElementById(
    'registerTab'
  )
  .classList
  .toggle(
    'active',
    !login
  );

  document
  .getElementById(
    'loginPanel'
  )
  .classList
  .toggle(
    'active',
    login
  );

  document
  .getElementById(
    'registerPanel'
  )
  .classList
  .toggle(
    'active',
    !login
  );
}


/* =========================================================
   REGISTER
========================================================= */

async function registerCustomer(){

  clearMessage(
    'registerMsg'
  );

  const name =
  document
  .getElementById(
    'regName'
  )
  .value
  .trim();

  const phone =
  document
  .getElementById(
    'regPhone'
  )
  .value
  .trim();

  const email =
  document
  .getElementById(
    'regEmail'
  )
  .value
  .trim()
  .toLowerCase();

  const password =
  document
  .getElementById(
    'regPassword'
  )
  .value;


  if(name.length < 2){
    showMessage(
      'registerMsg',
      '请输入正确姓名。'
    );
    return;
  }

  if(!email){
    showMessage(
      'registerMsg',
      '请输入邮箱。'
    );
    return;
  }

  if(password.length < 8){
    showMessage(
      'registerMsg',
      '密码至少需要 8 位。'
    );
    return;
  }


  setBusy(
    'registerBtn',
    true,
    '注册账户',
    '正在注册...'
  );


  try{

    const signupRes =
    await fetch(
      BASE + '/auth/v1/signup',
      {
        method:'POST',
        headers:{
          'apikey':KEY,
          'Content-Type':
          'application/json'
        },
        body:JSON.stringify({
          email,
          password,
          data:{
            display_name:name,
            phone
          }
        })
      }
    );


    const signup =
    await parseResponse(
      signupRes
    );


    if(
      signup?.access_token
    ){

      token =
      signup.access_token;

      refreshToken =
      signup.refresh_token
      ||
      '';

      saveTokens();


      await ensureProfile(
        name,
        phone
      );


      await loadDashboard();

      return;
    }


    showMessage(
      'registerMsg',
      '注册成功。请先完成邮箱确认，然后返回登录。',
      'ok'
    );

    showAuth(
      'login'
    );

  }
  catch(err){

    showMessage(
      'registerMsg',
      translateError(
        err.message
      )
    );

  }
  finally{

    setBusy(
      'registerBtn',
      false,
      '注册账户',
      '正在注册...'
    );

  }
}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  clearMessage(
    'loginMsg'
  );

  const email =
  document
  .getElementById(
    'loginEmail'
  )
  .value
  .trim()
  .toLowerCase();

  const password =
  document
  .getElementById(
    'loginPassword'
  )
  .value;


  if(
    !email
    ||
    !password
  ){
    showMessage(
      'loginMsg',
      '请输入邮箱和密码。'
    );
    return;
  }

  if(!captchaToken){
    showMessage(
      'loginMsg',
      '请先完成人机验证。'
    );
    return;
  }
  setBusy(
    'loginBtn',
    true,
    '登录',
    '正在登录...'
  );


  try{

    const res =
    await fetch(
      BASE
      +
      '/auth/v1/token?grant_type=password',
      {
        method:'POST',
        headers:{
          'apikey':KEY,
          'Content-Type':
          'application/json'
        },
        body:JSON.stringify({
  email,
  password,
  gotrue_meta_security:{
    captcha_token:captchaToken
  }
})
      }
    );


    const data =
    await parseResponse(
      res
    );


    token =
    data.access_token;

    refreshToken =
    data.refresh_token
    ||
    '';

    saveTokens();


    const metadata =
    data?.user?.user_metadata
    ||
    {};


    await ensureProfile(
      metadata.display_name
      ||
      email.split('@')[0],
      metadata.phone
      ||
      ''
    );


    await loadDashboard();

  }
  catch(err){

    clearTokens();

    showMessage(
      'loginMsg',
      translateError(
        err.message
      )
    );

  }
  finally{

    setBusy(
      'loginBtn',
      false,
      '登录',
      '正在登录...'
    );
   resetCaptcha();
  }
}


/* =========================================================
   TOKEN
========================================================= */

function saveTokens(){

  localStorage.setItem(
    'jmt_customer_token',
    token
  );

  if(refreshToken){
    localStorage.setItem(
      'jmt_customer_refresh_token',
      refreshToken
    );
  }
}


function clearTokens(){

  token =
  '';

  refreshToken =
  '';

  localStorage.removeItem(
    'jmt_customer_token'
  );

  localStorage.removeItem(
    'jmt_customer_refresh_token'
  );
}


async function refreshSession(){

  if(!refreshToken){
    return false;
  }


  try{

    const res =
    await fetch(
      BASE
      +
      '/auth/v1/token?grant_type=refresh_token',
      {
        method:'POST',
        headers:{
          'apikey':KEY,
          'Content-Type':
          'application/json'
        },
        body:JSON.stringify({
          refresh_token:
          refreshToken
        })
      }
    );


    const data =
    await parseResponse(
      res
    );


    token =
    data.access_token;

    refreshToken =
    data.refresh_token
    ||
    refreshToken;

    saveTokens();

    return true;

  }
  catch{

    clearTokens();

    return false;
  }
}


/* =========================================================
   PROFILE
========================================================= */

async function ensureProfile(
  name,
  phone
){

  const res =
  await fetch(
    BASE
    +
    '/rest/v1/rpc/customer_ensure_profile',
    {
      method:'POST',
      headers:
      authHeaders(),
      body:JSON.stringify({
        p_display_name:
        name,
        p_phone:
        phone
        ||
        null
      })
    }
  );


  profile =
  await parseResponse(
    res
  );

  return profile;
}


async function loadProfile(){

  const res =
  await fetch(
    BASE
    +
    '/rest/v1/customer_profiles?select=id,customer_code,display_name,phone,status&limit=1',
    {
      headers:
      authHeaders()
    }
  );


  const rows =
  await parseResponse(
    res
  );


  if(
    !Array.isArray(rows)
    ||
    !rows.length
  ){
    throw new Error(
      'CUSTOMER_PROFILE_NOT_FOUND'
    );
  }


  profile =
  rows[0];

  renderProfile();
}


function renderProfile(){

  document
  .getElementById(
    'profileName'
  )
  .textContent =
  profile.display_name
  ||
  '—';


  document
  .getElementById(
    'customerCode'
  )
  .textContent =
  profile.customer_code
  ||
  '—';


  document
  .getElementById(
    'profileNameInput'
  )
  .value =
  profile.display_name
  ||
  '';


  document
  .getElementById(
    'profilePhoneInput'
  )
  .value =
  profile.phone
  ||
  '';
}


async function saveProfile(){

  clearMessage(
    'profileMsg'
  );


  const name =
  document
  .getElementById(
    'profileNameInput'
  )
  .value
  .trim();


  const phone =
  document
  .getElementById(
    'profilePhoneInput'
  )
  .value
  .trim();


  if(name.length < 2){
    showMessage(
      'profileMsg',
      '请输入正确姓名。'
    );
    return;
  }


  setBusy(
    'saveProfileBtn',
    true,
    '保存个人资料',
    '正在保存...'
  );


  try{

    const res =
    await fetch(
      BASE
      +
      '/rest/v1/rpc/customer_update_profile',
      {
        method:'POST',
        headers:
        authHeaders(),
        body:JSON.stringify({
          p_display_name:
          name,
          p_phone:
          phone
          ||
          null
        })
      }
    );


    profile =
    await parseResponse(
      res
    );

    renderProfile();


    showMessage(
      'profileMsg',
      '个人资料已保存。',
      'ok'
    );

  }
  catch(err){

    showMessage(
      'profileMsg',
      translateError(
        err.message
      )
    );

  }
  finally{

    setBusy(
      'saveProfileBtn',
      false,
      '保存个人资料',
      '正在保存...'
    );

  }
}


/* =========================================================
   PAYOUT ACCOUNTS
========================================================= */

async function loadPayoutAccounts(){

  const res =
  await fetch(
    BASE
    +
    '/rest/v1/customer_payout_accounts?select=id,method_type,account_name,account_number,bank_name,is_verified,is_active&is_active=eq.true&order=method_type.asc',
    {
      headers:
      authHeaders()
    }
  );


  payoutAccounts =
  await parseResponse(
    res
  );

  renderPayoutAccounts();
}


function renderPayoutAccounts(){

  const kpay =
  payoutAccounts.find(
    x =>
    x.method_type ===
    'kpay'
  );


  const bank =
  payoutAccounts.find(
    x =>
    x.method_type ===
    'bank'
  );


  document
  .getElementById(
    'kpayName'
  )
  .value =
  kpay?.account_name
  ||
  '';


  document
  .getElementById(
    'kpayNumber'
  )
  .value =
  kpay?.account_number
  ||
  '';


  setVerifyBadge(
    'kpayVerify',
    kpay
  );


  document
  .getElementById(
    'bankName'
  )
  .value =
  bank?.bank_name
  ||
  '';


  document
  .getElementById(
    'bankAccountName'
  )
  .value =
  bank?.account_name
  ||
  '';


  document
  .getElementById(
    'bankAccountNumber'
  )
  .value =
  bank?.account_number
  ||
  '';


  setVerifyBadge(
    'bankVerify',
    bank
  );
}


function setVerifyBadge(
  id,
  account
){

  const el =
  document.getElementById(
    id
  );


  if(!account){

    el.textContent =
    '未绑定';

    el.className =
    'verify no';

    return;
  }


  if(account.is_verified){

    el.textContent =
    '已确认';

    el.className =
    'verify yes';

  }
  else{

    el.textContent =
    '待确认';

    el.className =
    'verify no';

  }
}


async function savePayoutAccount(
  method
){

  clearMessage(
    'accountMsg'
  );


  let accountName =
  '';

  let accountNumber =
  '';

  let bankName =
  null;


  if(method === 'kpay'){

    accountName =
    document
    .getElementById(
      'kpayName'
    )
    .value
    .trim();


    accountNumber =
    document
    .getElementById(
      'kpayNumber'
    )
    .value
    .trim();

  }
  else{

    bankName =
    document
    .getElementById(
      'bankName'
    )
    .value
    .trim();


    accountName =
    document
    .getElementById(
      'bankAccountName'
    )
    .value
    .trim();


    accountNumber =
    document
    .getElementById(
      'bankAccountNumber'
    )
    .value
    .trim();

  }


  if(accountName.length < 2){

    showMessage(
      'accountMsg',
      '请输入正确的收款户名。'
    );

    return;
  }


  if(accountNumber.length < 5){

    showMessage(
      'accountMsg',
      '请输入正确的收款号码或账号。'
    );

    return;
  }


  if(
    method === 'bank'
    &&
    (!bankName || bankName.length < 2)
  ){

    showMessage(
      'accountMsg',
      '请输入银行名称。'
    );

    return;
  }


  const buttonId =
  method === 'kpay'
  ? 'saveKpayBtn'
  : 'saveBankBtn';


  const normalText =
  method === 'kpay'
  ? '保存 KPay'
  : '保存银行账户';


  setBusy(
    buttonId,
    true,
    normalText,
    '正在保存...'
  );


  try{

    const res =
    await fetch(
      BASE
      +
      '/rest/v1/rpc/customer_upsert_payout_account',
      {
        method:'POST',
        headers:
        authHeaders(),
        body:JSON.stringify({
          p_method_type:
          method,

          p_account_name:
          accountName,

          p_account_number:
          accountNumber,

          p_bank_name:
          method === 'bank'
          ? bankName
          : null
        })
      }
    );


    await parseResponse(
      res
    );


    await loadPayoutAccounts();


    showMessage(
      'accountMsg',
      method === 'kpay'
      ? 'KPay 已保存，当前状态为待确认。'
      : '银行账户已保存，当前状态为待确认。',
      'ok'
    );

  }
  catch(err){

    showMessage(
      'accountMsg',
      translateError(
        err.message
      )
    );

  }
  finally{

    setBusy(
      buttonId,
      false,
      normalText,
      '正在保存...'
    );

  }
}


/* =========================================================
   DASHBOARD
========================================================= */

async function loadDashboard(){

  document
  .getElementById(
    'authCard'
  )
  .classList
  .add(
    'hidden'
  );


  document
  .getElementById(
    'dashboard'
  )
  .classList
  .remove(
    'show'
  );


  document
  .getElementById(
    'loading'
  )
  .classList
  .remove(
    'hidden'
  );


  try{

    await loadProfile();

    await loadPayoutAccounts();


    document
    .getElementById(
      'loading'
    )
    .classList
    .add(
      'hidden'
    );


    document
    .getElementById(
      'dashboard'
    )
    .classList
    .add(
      'show'
    );

  }
  catch(err){

    const refreshed =
    await refreshSession();


    if(refreshed){

      try{

        await loadProfile();

        await loadPayoutAccounts();


        document
        .getElementById(
          'loading'
        )
        .classList
        .add(
          'hidden'
        );


        document
        .getElementById(
          'dashboard'
        )
        .classList
        .add(
          'show'
        );


        return;

      }
      catch{}
    }


    clearTokens();


    document
    .getElementById(
      'loading'
    )
    .classList
    .add(
      'hidden'
    );


    document
    .getElementById(
      'dashboard'
    )
    .classList
    .remove(
      'show'
    );


    document
    .getElementById(
      'authCard'
    )
    .classList
    .remove(
      'hidden'
    );


    showAuth(
      'login'
    );

  }
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    if(token){

      await fetch(
        BASE
        +
        '/auth/v1/logout',
        {
          method:'POST',
          headers:
          authHeaders()
        }
      );

    }

  }
  catch{}


  clearTokens();

  profile =
  null;

  payoutAccounts =
  [];


  document
  .getElementById(
    'dashboard'
  )
  .classList
  .remove(
    'show'
  );


  document
  .getElementById(
    'authCard'
  )
  .classList
  .remove(
    'hidden'
  );


  showAuth(
    'login'
  );
}


/* =========================================================
   ERRORS
========================================================= */

function translateError(message){

  const text =
  String(
    message
    ||
    ''
  );


  if(
    text.includes(
      'Invalid login credentials'
    )
  ){
    return '邮箱或密码错误。';
  }


  if(
    text.includes(
      'Email not confirmed'
    )
  ){
    return '请先完成邮箱确认。';
  }


  if(
    text.includes(
      'User already registered'
    )
  ){
    return '此邮箱已经注册。';
  }


  if(
    text.includes(
      'Password should be'
    )
  ){
    return '密码长度或强度不符合要求。';
  }


  if(
    text.includes(
      'ACCOUNT_ROLE_CONFLICT'
    )
  ){
    return '此登录账户已经属于其他系统身份，不能再创建客户账户。';
  }


  if(
    text.includes(
      'CUSTOMER_NOT_ACTIVE'
    )
  ){
    return '此客户账户当前不可使用，请联系管理员。';
  }


  if(
    text.includes(
      'DISPLAY_NAME_REQUIRED'
    )
  ){
    return '请输入正确姓名。';
  }


  if(
    text.includes(
      'ACCOUNT_NAME_REQUIRED'
    )
  ){
    return '请输入正确收款户名。';
  }


  if(
    text.includes(
      'ACCOUNT_NUMBER_REQUIRED'
    )
  ){
    return '请输入正确收款号码或账号。';
  }


  if(
    text.includes(
      'BANK_NAME_REQUIRED'
    )
  ){
    return '请输入银行名称。';
  }


  return text
  ||
  '操作失败，请稍后再试。';
}


/* =========================================================
   START
========================================================= */

(async function init(){

  if(!token){

    document
    .getElementById(
      'authCard'
    )
    .classList
    .remove(
      'hidden'
    );

    return;
  }


  await loadDashboard();

})();
