<style>

*{

html,
body{

}

body{

      circle at top,
      #271b07 0,

    "Microsoft YaHei",

  padding:

}

.wrap{
  width:min(720px,100%);
  margin:auto;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#d7bc72;
  text-decoration:none;
  font-size:14px;
}

.lang{
  border:1px solid rgba(214,168,63,.28);
  background:#11100d;
  color:#e7ce88;
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
}

.hero{
  text-align:center;
  padding:18px 10px 26px;
}

.heroMark{
  width:64px;
  height:64px;
  margin:0 auto 12px;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:1px solid rgba(218,174,62,.55);

  background:
    radial-gradient(
      circle,
      #392407,
      #0a0804 70%
    );

  color:#efc65c;
  font-size:27px;
  font-weight:900;

  box-shadow:
    0 0 30px rgba(221,170,45,.14);
}

.hero h1{
  margin:0;
  color:#efc85f;
  font-size:26px;
  letter-spacing:2px;
}

.hero p{
  margin:9px auto 0;
  max-width:560px;
  color:#9d8c62;
  font-size:13px;
  line-height:1.7;
}

.flow{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:18px;
}

.flowItem{
  text-align:center;
  padding:11px 5px;
  background:rgba(24,20,13,.9);
  border:1px solid rgba(214,168,63,.18);
  border-radius:12px;
  color:#c8ae69;
  font-size:11px;
  line-height:1.45;
}

.flowItem b{
  display:block;
  color:#e9c65e;
  font-size:17px;
  margin-bottom:4px;
}

.guide{
  margin-bottom:10px;
  border:1px solid rgba(214,168,63,.26);
  border-radius:16px;

  background:
    linear-gradient(
      180deg,
      rgba(27,22,13,.98),
      rgba(10,9,7,.98)
    );

  overflow:hidden;
}

.guide button{
  width:100%;
  border:0;
  background:transparent;
  color:#ead38e;
  padding:16px;

  display:flex;
  align-items:center;
  gap:12px;

  text-align:left;
}

.icon{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:rgba(205,151,37,.10);
  font-size:20px;
}

.title{
  flex:1;
}

.title strong{
  display:block;
  color:#edcf74;
  font-size:15px;
  margin-bottom:3px;
}

.title small{
  color:#85775a;
  font-size:11px;
}

.arrow{
  color:#8e7946;
  font-size:18px;
}

.content{
  display:none;
  padding:0 16px 17px 66px;
  color:#bcae86;
  font-size:13px;
  line-height:1.8;
}

.guide.open .content{
  display:block;
}

.guide.open .arrow{
  transform:rotate(90deg);
}

.step{
  margin-bottom:9px;
}

.step b{
  color:#e3c56d;
}

.notice{
  margin-top:17px;
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(214,168,63,.20);
  background:rgba(170,121,26,.07);
  color:#a9976d;
  font-size:12px;
  line-height:1.7;
}

.foot{
  text-align:center;
  margin-top:28px;
  color:#675b40;
  font-size:10px;
  letter-spacing:1.5px;
}

@media(max-width:520px){

  .flow{
    grid-template-columns:1fr 1fr;
  }

  .content{
    padding-left:16px;
  }

}

</style>

function getLang(){

  const saved =
  localStorage.getItem(
    LANG_KEY
  );

  if(
    TEXT[saved]
  ){
    return saved;
  }

  return 'zh';

}


function setLang(
  lang
){

  if(
    !TEXT[lang]
  ){
    lang = 'zh';
  }

  localStorage.setItem(
    LANG_KEY,
    lang
  );

  render(
    lang
  );

}


function render(
  lang
){

  const data =
  TEXT[lang]
  ||
  TEXT.zh;


  document.documentElement.lang =
  lang;


  document.getElementById(
    'languageSelect'
  ).value =
  lang;


  document.getElementById(
    'backText'
  ).textContent =
  data.back;


  document.getElementById(
    'pageTitle'
  ).textContent =
  data.title;


  document.getElementById(
    'pageDesc'
  ).textContent =
  data.desc;


  data.flow.forEach(
    (
      value,
      index
    )=>{

      const el =
      document.getElementById(
        'flow'+
        (
          index+1
        )
      );

      if(el){
        el.textContent =
        value;
      }

    }
  );


  const list =
  document.getElementById(
    'guideList'
  );


  list.innerHTML =
  '';


  data.sections.forEach(
    (
      section,
      index
    )=>{

      const item =
      document.createElement(
        'div'
      );


      item.className =
      'guide';


      const button =
      document.createElement(
        'button'
      );


      button.type =
      'button';


      button.innerHTML =

        '<div class="icon">'
        +
        section.icon
        +
        '</div>'

        +

        '<div class="title">'
        +
        '<strong>'
        +
        escapeHtml(
          section.title
        )
        +
        '</strong>'
        +
        '<small>'
        +
        escapeHtml(
          section.sub
        )
        +
        '</small>'
        +
        '</div>'

        +

        '<div class="arrow">›</div>';


      const content =
      document.createElement(
        'div'
      );


      content.className =
      'content';


      content.innerHTML =
      section.body
      .map(
        (
          text,
          i
        )=>
        '<div class="step">'
        +
        '<b>'
        +
        (
          i+1
        )
        +
        '.</b> '
        +
        escapeHtml(
          text
        )
        +
        '</div>'
      )
      .join(
        ''
      );


      button.addEventListener(
        'click',
        ()=>{

          item.classList
          .toggle(
            'open'
          );

        }
      );


      item.appendChild(
        button
      );


      item.appendChild(
        content
      );


      list.appendChild(
        item
      );


      if(
        index===
        0
      ){
        item.classList.add(
          'open'
        );
      }

    }
  );


  document.getElementById(
    'notice'
  ).textContent =
  data.notice;

}


function escapeHtml(
  value
){

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


document.getElementById(
  'languageSelect'
)
.addEventListener(
  'change',
  event=>{

    setLang(
      event.target.value
    );

  }
);


render(
  getLang()
);
