/* =============================
   TRANSLATION
============================= */

function tr(key){

  return (
    T[currentLang]?.[key]
    ||
    T.zh[key]
    ||
    key
  );

}


function changeLanguage(lang){

  currentLang =
  lang;


  localStorage.setItem(
    'jmt_agent_lang',
    lang
  );


  document.documentElement.lang =
  lang;


  document.querySelectorAll(
    '[data-i18n]'
  ).forEach(
    el=>{

      const key =
      el.getAttribute(
        'data-i18n'
      );


      el.textContent =
      tr(key);

    }
  );


  document.querySelectorAll(
    '[data-ph]'
  ).forEach(
    el=>{

      const key =
      el.getAttribute(
        'data-ph'
      );


      el.placeholder =
      tr(key);

    }
  );


  renderAgentStatus();

  renderRound();

  renderAgentFinance();

}


/* =============================
   RATE
============================= */

function normalizeRate(value){

  let rate =
  Number(
    value || 0
  );


  if(
    !Number.isFinite(
      rate
    )
  ){

    rate = 0;

  }


  /*
    同时兼容：

    20 = 20%
    0.20 = 20%
  */

  if(
    rate > 0
    &&
    rate <= 1
  ){

    rate =
    rate * 100;

  }


  return rate;

}


/* =============================
   BUILD 00-99
============================= */

function buildGrid(){

  const grid =
  document.getElementById(
    'numberGrid'
  );


  grid.innerHTML =
  '';


  for(
    let i=0;
    i<=99;
    i++
  ){

    const n =
    String(i)
    .padStart(
      2,
      '0'
    );


    const div =
    document.createElement(
      'div'
    );


    div.className =
    'num';


    div.innerHTML =

    '<div class="numLabel">'+
    n+
    '</div>'+

    '<input '+
    'id="n'+n+'" '+
    'type="number" '+
    'min="0" '+
    'step="1" '+
    'placeholder="0" '+
    'oninput="updateInputTotal()">'+
    '';


    grid.appendChild(
      div
    );

  }

}


/* =============================
   LOGIN
============================= */

async function signIn(){

  const email =
  document.getElementById(
    'email'
  ).value.trim();


  const password =
  document.getElementById(
    'password'
  ).value;


  const msg =
  document.getElementById(
    'loginMsg'
  );


  if(
    !email
    ||
    !password
  ){

    msg.textContent =
    tr('loginMissing');

    return;

  }


  msg.textContent =
  tr('logging');


  try{

    const r =
    await fetch(

      BASE+
      '/auth/v1/token?grant_type=password',

      {

        method:'POST',

        headers:{

          apikey:KEY,

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({
          email,
          password
        })

      }

    );


    const d =
    await r.json();


    if(
      !r.ok
      ||
      !d.access_token
    ){

      throw new Error();

    }


    token =
    d.access_token;


    localStorage.setItem(
      'jmt_agent_token',
      token
    );


    sessionStorage.setItem(
      'jmt_agent_token',
      token
    );


    await startAgent();


  }catch(e){

    msg.textContent =
    tr('loginFail');

  }

}


/* =============================
   START AGENT
============================= */

async function startAgent(){

  try{

    const r =
    await fetch(

      BASE+
      '/rest/v1/agents?select=id,display_name,commission_rate,status',

      {

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer '+token

        }

      }

    );


    if(!r.ok){

      throw new Error();

    }


    const rows =
    await r.json();


    if(!rows.length){

      throw new Error();

    }


    agent =
    rows[0];


    document.getElementById(
      'loginBox'
    ).classList.add(
      'hidden'
    );


    document.getElementById(
      'agentBox'
    ).classList.remove(
      'hidden'
    );


    document.getElementById(
      'agentName'
    ).textContent =
    agent.display_name || '—';


    document.getElementById(
      'commissionRate'
    ).textContent =

    formatRate(
      normalizeRate(
        agent.commission_rate
      )
    )

    +

    '%';


    renderAgentStatus();


    if(
      agent.status !==
      'active'
    ){

      disableInputs(
        true
      );

    }


    await loadRound();


  }catch(e){

    clearAgentSession();


    alert(
      tr('noAgent')
    );


    location.reload();

  }

}


/* =============================
   AGENT STATUS
============================= */

function renderAgentStatus(){

  if(!agent){
    return;
  }


  const el =
  document.getElementById(
    'agentStatus'
  );


  if(
    agent.status ===
    'active'
  ){

    el.textContent =
    tr('normal');


    el.className =
    'statusOpen';

  }

  else if(
    agent.status ===
    'suspended'
  ){

    el.textContent =
    tr('suspended');


    el.className =
    'statusClosed';

  }

  else{

    el.textContent =
    tr('blocked');


    el.className =
    'statusClosed';

  }

}


/* =============================
   LOAD ROUND
============================= */

async function loadRound(){

  const r =
  await fetch(

    BASE+
    '/rest/v1/rounds'+
    '?select=id,round_date,round_code,deadline_at,result_number,status,created_at'+
    '&order=created_at.desc'+
    '&limit=20',

    {

      headers:{

        apikey:KEY,

        Authorization:
        'Bearer '+token

      }

    }

  );


  if(!r.ok){

    return;

  }


  const rounds =
  await r.json();


  const now =
  Date.now();


  /*
    优先选择：

    1. 尚未截止的开放期
    2. 其他开放期
    3. 最新一期
  */

  currentRound =

  rounds.find(
    x=>
    x.status === 'open'
    &&
    new Date(
      x.deadline_at
    ).getTime() > now
  )

  ||

  rounds.find(
    x=>
    x.status === 'open'
  )

  ||

  rounds[0]

  ||

  null;


  renderRound();


  if(!currentRound){

    document.getElementById(
      'submitBtn'
    ).disabled =
    true;


    resetSubmittedData();

    renderAgentFinance();

    return;

  }


  /*
    重新从数据库读取真正已提交数据
  */

  await loadExisting();


  updateDeadlineUI();

}


/* =============================
   RENDER ROUND
============================= */

function renderRound(){

  if(!currentRound){

    document.getElementById(
      'roundName'
    ).textContent =
    '—';


    document.getElementById(
      'roundStatus'
    ).textContent =
    tr('noRound');


    document.getElementById(
      'deadlineText'
    ).textContent =
    '—';


    document.getElementById(
      'countdown'
    ).textContent =
    '—';


    document.getElementById(
      'resultNumber'
    ).textContent =
    tr('waitingResult');


    return;

  }


  let period =
  currentRound.round_code;


  if(
    currentRound.round_code ===
    '1030'
  ){

    period =
    tr('morning');

  }

  else if(
    currentRound.round_code ===
    '1530'
  ){

    period =
    tr('afternoon');

  }


  document.getElementById(
    'roundName'
  ).textContent =

  currentRound.round_date

  +

  ' · '

  +

  period;


  document.getElementById(
    'deadlineText'
  ).textContent =
  formatMMT(
    currentRound.deadline_at
  );


  document.getElementById(
    'resultNumber'
  ).textContent =

  currentRound.result_number

  ?

  String(
    currentRound.result_number
  ).padStart(
    2,
    '0'
  )

  :

  tr('waitingResult');

}


/* =============================
   RESET SUBMITTED DATA
============================= */

function resetSubmittedData(){

  submittedTotal =
  0;


  submittedNumbers =
  {};


  for(
    let i=0;
    i<=99;
    i++
  ){

    submittedNumbers[
      String(i)
      .padStart(
        2,
        '0'
      )
    ] = 0;

  }

}


/* =============================
   LOAD EXISTING SUBMISSIONS
============================= */

async function loadExisting(){

  if(
    !currentRound
    ||
    !agent
  ){

    return;

  }


  const r =
  await fetch(

    BASE+
    '/rest/v1/agent_submissions'+
    '?round_id=eq.'+
    encodeURIComponent(
      currentRound.id
    )+
    '&agent_id=eq.'+
    encodeURIComponent(
      agent.id
    )+
    '&select=number_code,points',

    {

      headers:{

        apikey:KEY,

        Authorization:
        'Bearer '+token

      }

    }

  );


  if(!r.ok){

    return;

  }


  const rows =
  await r.json();


  resetSubmittedData();


  /*
    先清空输入框
  */

  for(
    let i=0;
    i<=99;
    i++
  ){

    const n =
    String(i)
    .padStart(
      2,
      '0'
    );


    document.getElementById(
      'n'+n
    ).value =
    '';

  }


  /*
    数据库真实数据
  */

  rows.forEach(
    row=>{

      const code =
      String(
        row.number_code
      )
      .padStart(
        2,
        '0'
      );


      const points =
      Number(
        row.points || 0
      );


      if(
        Object.prototype
        .hasOwnProperty
        .call(
          submittedNumbers,
          code
        )
      ){

        submittedNumbers[
          code
        ] =
        points;


        submittedTotal +=
        points;

      }


      const el =
      document.getElementById(
        'n'+code
      );


      if(el){

        el.value =
        points > 0
        ?
        points
        :
        '';

      }

    }
  );


  updateInputTotal();

  renderAgentFinance();

}


/* =============================
   INPUT TOTAL
============================= */

function getInputTotal(){

  let total =
  0;


  for(
    let i=0;
    i<=99;
    i++
  ){

    const n =
    String(i)
    .padStart(
      2,
      '0'
    );


    const value =
    Number(
      document.getElementById(
        'n'+n
      ).value
      ||
      0
    );


    if(
      Number.isFinite(
        value
      )
      &&
      value > 0
    ){

      total +=
      value;

    }

  }


  return total;

}


function updateInputTotal(){

  document.getElementById(
    'totalPoints'
  ).textContent =
  formatNumber(
    getInputTotal()
  );

}


/* =============================
   AGENT FINANCE
============================= */

function renderAgentFinance(){

  const rate =

  agent

  ?

  normalizeRate(
    agent.commission_rate
  )

  :

  0;


  const commission =

  submittedTotal

  *

  rate

  /

  100;


  document.getElementById(
    'resultSubmittedTotal'
  ).textContent =
  formatNumber(
    submittedTotal
  );


  document.getElementById(
    'resultRate'
  ).textContent =

  formatRate(
    rate
  )

  +

  '%';


  document.getElementById(
    'resultCommission'
  ).textContent =
  formatNumber(
    commission
  );


  /*
    没开奖：
    中奖金额等待
  */

  if(
    !currentRound
    ||
    !currentRound.result_number
  ){

    document.getElementById(
      'winningAmount'
    ).textContent =
    tr('waitingResult');


    return;

  }


  /*
    已开奖：
    找该代理真正提交的中奖号码金额
  */

  const resultCode =
  String(
    currentRound.result_number
  )
  .padStart(
    2,
    '0'
  );


  const winningPoints =
  Number(
    submittedNumbers[
      resultCode
    ]
    ||
    0
  );


  const winningAmount =

  winningPoints

  *

  MULTIPLIER;


  document.getElementById(
    'winningAmount'
  ).textContent =
  formatNumber(
    winningAmount
  );

}


/* =============================
   SUBMIT
============================= */

async function submitRound(){

  const msg =
  document.getElementById(
    'submitMsg'
  );


  if(
    !agent
    ||
    !currentRound
  ){

    msg.textContent =
    tr('noSubmitRound');

    return;

  }


  if(
    agent.status !==
    'active'
  ){

    msg.textContent =
    tr('accountCannot');

    return;

  }


  /*
    浏览器再检查一次截止时间
  */

  if(
    Date.now()
    >=
    new Date(
      currentRound.deadline_at
    ).getTime()
  ){

    msg.textContent =
    tr('serverRejected');


    disableInputs(
      true
    );


    return;

  }


  msg.textContent =
  tr('submitting');


  document.getElementById(
    'submitBtn'
  ).disabled =
  true;


  try{

    const rows =
    [];


    for(
      let i=0;
      i<=99;
      i++
    ){

      const n =
      String(i)
      .padStart(
        2,
        '0'
      );


      const points =
      Number(
        document.getElementById(
          'n'+n
        ).value
        ||
        0
      );


      if(
        Number.isFinite(
          points
        )
        &&
        points >= 0
      ){

        rows.push({

          round_id:
          currentRound.id,

          agent_id:
          agent.id,

          number_code:
          n,

          points:
          points

        });

      }

    }


    const r =
    await fetch(

      BASE+
      '/rest/v1/agent_submissions'+
      '?on_conflict=round_id,agent_id,number_code',

      {

        method:'POST',

        headers:{

          apikey:KEY,

          Authorization:
          'Bearer '+token,

          'Content-Type':
          'application/json',

          Prefer:
          'resolution=merge-duplicates,return=minimal'

        },

        body:
        JSON.stringify(
          rows
        )

      }

    );


    if(
      r.status === 401
      ||
      r.status === 403
    ){

      msg.textContent =
      tr('serverRejected');


      disableInputs(
        true
      );


      return;

    }


    if(!r.ok){

      const text =
      await r.text();


      if(
        text.includes(
          'row-level security'
        )
        ||
        text.includes(
          'policy'
        )
      ){

        msg.textContent =
        tr('submitBlocked');

      }

      else{

        msg.textContent =
        tr('submitFail');

      }


      return;

    }


    /*
      成功以后，
      必须重新从数据库读取，
      再计算佣金。
    */

    await loadExisting();


    msg.textContent =

    tr('submitSuccess')

    +

    formatNumber(
      submittedTotal
    );


  }catch(e){

    msg.textContent =
    tr('networkError');

  }

  finally{

    updateDeadlineUI();

  }

}


/* =============================
   DEADLINE
============================= */

function updateDeadlineUI(){

  if(!currentRound){

    return;

  }


  const left =

  new Date(
    currentRound.deadline_at
  ).getTime()

  -

  Date.now();


  const statusEl =
  document.getElementById(
    'roundStatus'
  );


  const countdown =
  document.getElementById(
    'countdown'
  );


  if(
    left <= 0
    ||
    currentRound.status !==
    'open'
  ){

    statusEl.textContent =
    tr('closed');


    statusEl.className =
    'statusClosed';


    countdown.textContent =
    tr('closedShort');


    disableInputs(
      true
    );


    return;

  }


  statusEl.textContent =
  tr('canSubmit');


  statusEl.className =
  'statusOpen';


  let totalSeconds =
  Math.max(
    0,
    Math.floor(
      left / 1000
    )
  );


  const hours =
  Math.floor(
    totalSeconds / 3600
  );


  totalSeconds %=
  3600;


  const minutes =
  Math.floor(
    totalSeconds / 60
  );


  const seconds =
  totalSeconds % 60;


  /*
    超过一小时就用 HH:MM:SS
  */

  if(hours > 0){

    countdown.textContent =

    String(hours)
    .padStart(
      2,
      '0'
    )

    +

    ':'

    +

    String(minutes)
    .padStart(
      2,
      '0'
    )

    +

    ':'

    +

    String(seconds)
    .padStart(
      2,
      '0'
    );

  }

  else{

    countdown.textContent =

    minutes

    +

    ' '

    +

    tr('minutes')

    +

    ' '

    +

    seconds

    +

    ' '

    +

    tr('seconds');

  }


  if(
    agent
    &&
    agent.status ===
    'active'
  ){

    disableInputs(
      false
    );

  }

}


/* =============================
   INPUT DISABLE
============================= */

function disableInputs(disabled){

  for(
    let i=0;
    i<=99;
    i++
  ){

    const n =
    String(i)
    .padStart(
      2,
      '0'
    );


    document.getElementById(
      'n'+n
    ).disabled =
    disabled;

  }


  document.getElementById(
    'submitBtn'
  ).disabled =
  disabled;

}


/* =============================
   TIME
============================= */

function formatMMT(iso){

  if(!iso){

    return '—';

  }


  return new Intl
  .DateTimeFormat(
    'zh-CN',
    {

      timeZone:
      'Asia/Yangon',

      year:'numeric',

      month:'2-digit',

      day:'2-digit',

      hour:'2-digit',

      minute:'2-digit',

      second:'2-digit',

      hour12:false

    }
  )
  .format(
    new Date(
      iso
    )
  )

  +

  ' MMT';

}


function updateClock(){

  const el =
  document.getElementById(
    'mmtClock'
  );


  if(!el){

    return;

  }


  el.textContent =

  new Intl
  .DateTimeFormat(
    'zh-CN',
    {

      timeZone:
      'Asia/Yangon',

      hour:'2-digit',

      minute:'2-digit',

      second:'2-digit',

      hour12:false

    }
  )
  .format(
    new Date()
  );

}


/* =============================
   FORMAT
============================= */

function formatNumber(value){

  return Number(
    value || 0
  )
  .toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


function formatRate(value){

  return Number(
    value || 0
  )
  .toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}

    'jmt_agent_token'

  );


  token =

}

}
