<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">
<title>金满堂 · Agent Center</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#251907 0,#0d0c0a 40%,#070708 100%);
  color:#f7f0df;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.wrap{
  max-width:650px;
  margin:auto;
  min-height:100vh;
  padding:20px 14px 50px
}

.brand{
  text-align:center;
  margin-bottom:18px
}

.mark{
  width:64px;
  height:64px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 9px;
  font-weight:900;
  font-size:23px;
  color:#f3d681;
  border:1px solid #b98a2c;
  background:#191208
}

.cn{
  font-size:23px;
  font-weight:900;
  letter-spacing:3px;
  color:#f1d47b
}

.en{
  font-size:10px;
  color:#998b68;
  letter-spacing:3px;
  margin-top:4px
}

.card{
  background:linear-gradient(180deg,#151515,#0d0d0e);
  border:1px solid rgba(214,168,63,.30);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px
}

.title{
  font-size:15px;
  font-weight:900;
  color:#dec372;
  margin-bottom:14px
}

.hidden{display:none!important}

input,select{
  width:100%;
  padding:12px;
  border-radius:11px;
  border:1px solid rgba(214,168,63,.25);
  background:#101011;
  color:#fff;
  outline:none;
  font-size:15px
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  margin-top:10px;
  font-weight:900;
  font-size:14px;
  background:linear-gradient(180deg,#efd47c,#b87e1e);
  color:#171109;
  cursor:pointer
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.secondary{
  background:#171718;
  color:#dac477;
  border:1px solid rgba(214,168,63,.23)
}

.langWrap{
  margin-bottom:14px
}

.langWrap select{
  text-align:center;
  color:#ecd277;
  font-weight:800
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.box{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
  padding:13px;
  min-height:92px
}

.box small{
  display:block;
  color:#817b71;
  font-size:10px;
  margin-bottom:6px;
  line-height:1.45
}

.box strong{
  display:block;
  color:#e7cb74;
  font-size:16px;
  line-height:1.4;
  word-break:break-word
}

.box.highlight{
  background:#15130e;
  border-color:rgba(214,168,63,.30)
}

.box.commission strong{
  color:#70d39d;
  font-size:19px
}

.statusOpen{color:#6fd09a!important}
.statusClosed{color:#e58e8e!important}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.num{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:11px;
  padding:10px
}

.num.changed{
  border-color:rgba(214,168,63,.55);
  background:#18150f
}

.numLabel{
  font-size:18px;
  font-weight:900;
  color:#dec16a;
  margin-bottom:7px
}

.num input{
  padding:9px;
  font-size:14px
}

.total{
  text-align:center;
  background:#101011;
  border-radius:14px;
  padding:15px;
  border:1px solid rgba(214,168,63,.15);
  margin-top:13px
}

.total small{
  display:block;
  color:#817b71;
  font-size:10px
}

.total strong{
  display:block;
  color:#efcf70;
  font-size:28px;
  margin-top:5px
}

.msg{
  text-align:center;
  min-height:20px;
  margin-top:11px;
  font-size:12px;
  color:#a49c8b;
  line-height:1.6
}

.success{color:#70d39d!important}
.error{color:#e58e8e!important}

.note{
  font-size:11px;
  color:#777166;
  line-height:1.6;
  margin-top:10px
}

.resultNote{
  margin-top:12px;
  background:#101011;
  border-radius:12px;
  padding:12px;
  color:#817b71;
  font-size:10px;
  line-height:1.65;
  text-align:center
}

.foot{
  text-align:center;
  color:#6f6a61;
  font-size:10px;
  margin-top:22px
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="mark">金</div>
    <div class="cn">金满堂</div>
    <div class="en">AGENT CENTER</div>
  </div>

  <div class="langWrap">
    <select id="langSelect" onchange="changeLanguage(this.value)">
      <option value="zh">中文</option>
      <option value="my">မြန်မာ</option>
      <option value="en">English</option>
      <option value="th">ไทย</option>
      <option value="ms">Bahasa Melayu</option>
      <option value="vi">Tiếng Việt</option>
      <option value="id">Bahasa Indonesia</option>
    </select>
  </div>

  <div class="card" id="loginBox">
    <div class="title" data-i18n="loginTitle">代理登录</div>

    <input id="email" type="email" data-ph="email" placeholder="代理邮箱">
    <div style="height:9px"></div>
    <input id="password" type="password" data-ph="password" placeholder="密码">

    <button onclick="signIn()" data-i18n="loginBtn">
      登录代理中心
    </button>

    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="agentBox" class="hidden">

    <div class="card">
      <div class="title" data-i18n="agentInfo">我的代理资料</div>

      <div class="info">
        <div class="box">
          <small data-i18n="agentName">代理名称</small>
          <strong id="agentName">—</strong>
        </div>

        <div class="box">
          <small data-i18n="agentRate">代理比例</small>
          <strong id="commissionRate">—</strong>
        </div>

        <div class="box">
          <small data-i18n="accountStatus">账号状态</small>
          <strong id="agentStatus">—</strong>
        </div>

        <div class="box">
          <small>Myanmar Time</small>
          <strong id="mmtClock">—</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="title" data-i18n="currentRound">当前期数</div>

      <div class="info">
        <div class="box">
          <small data-i18n="round">期数</small>
          <strong id="roundName">—</strong>
        </div>

        <div class="box">
          <small data-i18n="submitStatus">提交状态</small>
          <strong id="roundStatus">—</strong>
        </div>

        <div class="box">
          <small data-i18n="deadline">截止时间</small>
          <strong id="deadlineText">—</strong>
        </div>

        <div class="box">
          <small data-i18n="timeLeft">距离截止</small>
          <strong id="countdown">—</strong>
        </div>
      </div>

      <div class="note" data-i18n="serverNote">
        是否接受提交最终由服务器时间决定，不以代理手机时间为准。
      </div>
    </div>

    <div class="card">
      <div class="title" data-i18n="submitTitle">
        00–99 本期积分提交
      </div>

      <div class="grid" id="numberGrid"></div>

      <div class="total">
        <small data-i18n="totalPoints">本期提交总积分</small>
        <strong id="totalPoints">0</strong>
      </div>

      <button id="submitBtn" onclick="submitRound()" data-i18n="submitBtn">
        提交本期数据
      </button>

      <button class="secondary" onclick="loadExisting()" data-i18n="reloadBtn">
        重新读取已提交数据
      </button>

      <div class="msg" id="submitMsg"></div>
    </div>

    <div class="card">
      <div class="title" data-i18n="resultTitle">本期数据</div>

      <div class="info">
        <div class="box">
          <small data-i18n="resultNumber">结果号码</small>
          <strong id="resultNumber">—</strong>
        </div>

        <div class="box highlight">
          <small data-i18n="savedTotal">已提交总积分</small>
          <strong id="savedTotal">0</strong>
        </div>

        <div class="box commission">
          <small data-i18n="commissionAmount">本期代理佣金</small>
          <strong id="commissionAmount">0</strong>
        </div>

        <div class="box">
          <small data-i18n="lastSaved">数据状态</small>
          <strong id="savedStatus">—</strong>
        </div>
      </div>

      <div class="resultNote" data-i18n="commissionNote">
        代理佣金按已成功保存到系统的本期总积分 × 代理比例自动计算。
      </div>
    </div>

    <div class="card">
      <button class="secondary" onclick="logout()" data-i18n="logout">
        退出登录
      </button>
    </div>

  </div>

  <div class="foot">
    © 2022 JIN MANTANG · AGENT SYSTEM
  </div>

</div>

<script>

const BASE='https://veserwfjxglxieehfggy.supabase.co';
const KEY='sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';

let token=
  localStorage.getItem('jmt_agent_token')
  ||
  sessionStorage.getItem('jmt_agent_token')
  ||
  '';

let agent=null;
let currentRound=null;
let savedValues={};
let isSubmitting=false;

let currentLang=
  localStorage.getItem('jmt_agent_lang')
  ||
  'zh';
