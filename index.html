function formatMMT(iso){

  const d =
  new Date(iso);


  const locale =
  currentLang === 'zh'
  ? 'zh-CN'

  : currentLang === 'th'
  ? 'th-TH'

  : currentLang === 'my'
  ? 'my-MM'

  : currentLang === 'ms'
  ? 'ms-MY'

  : currentLang === 'vi'
  ? 'vi-VN'

  : currentLang === 'id'
  ? 'id-ID'

  : 'en-GB';


  return new Intl.DateTimeFormat(
    locale,
    {
      timeZone:'Asia/Yangon',
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',
      hour12:false
    }
  ).format(d) + ' MMT';

}



/* 读取后台网站设置 */

async function loadSiteSettings(){

  try{

    const url =
    BASE +
    '/rest/v1/site_settings?id=eq.1&select=telegram_url,announcement_text,announcement_enabled,updated_at';


    const r =
    await fetch(
      url,
      {
        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + KEY
        }
      }
    );


    if(!r.ok){
      throw new Error();
    }


    const rows =
    await r.json();


    if(!rows.length){
      return;
    }


    siteSettings =
    rows[0];


    renderSiteSettings();


  }catch(e){

    console.log(
      'Unable to load site settings'
    );

  }

}



/* 显示公告和 Telegram */

function renderSiteSettings(){

  const noticeWrap =
  document.getElementById(
    'noticeWrap'
  );


  const noticeText =
  document.getElementById(
    'noticeText'
  );


  const telegramBox =
  document.getElementById(
    'telegramBox'
  );


  const telegramLink =
  document.getElementById(
    'telegramLink'
  );


  const announcement =
  (
    siteSettings.announcement_text
    || ''
  ).trim();


  if(
    siteSettings.announcement_enabled
    &&
    announcement
  ){

    noticeText.textContent =
    announcement;

    noticeWrap.style.display =
    'block';

  }else{

    noticeWrap.style.display =
    'none';

  }



  const telegram =
  (
    siteSettings.telegram_url
    || ''
  ).trim();


  if(telegram){

    try{

      const u =
      new URL(telegram);


      if(
        u.protocol === 'https:'
        ||
        u.protocol === 'http:'
      ){

        telegramLink.href =
        telegram;

        telegramBox.style.display =
        'block';

      }else{

        telegramBox.style.display =
        'none';

      }

    }catch(e){

      telegramBox.style.display =
      'none';

    }

  }else{

    telegramBox.style.display =
    'none';

  }

}

      14*24*60*60*1000

    const url =
    BASE +
    '/rest/v1/results?select=id,result_number,published_at&published_at=gte.'
    +
    encodeURIComponent(cutoff)
    +
    '&order=published_at.desc&limit=100';


    const r =
    await fetch(
      url,
      {
        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + KEY
        }
      }
    );


    if(!r.ok){

      throw new Error(
        'HTTP ' + r.status
      );

    }


    const rows =
    await r.json();


    const latest =
    rows[0];


    document.getElementById(
      'latest'
    ).textContent =
    latest
    ? latest.result_number
    : '--';


    document.getElementById(
      'time'
    ).textContent =
    latest
    ? formatMMT(
        latest.published_at
      )
    : '—';


    state.innerHTML =
    latest

    ? '<span class="dot"></span>'
      + t.connected

    : '<span class="dot"></span>'
      + t.waiting;



    const box =
    document.getElementById(
      'history'
    );


    box.innerHTML =
    '';


    if(!rows.length){

      const empty =
      document.createElement(
        'div'
      );

      empty.className =
      'empty';

      empty.textContent =
      t.empty;

      box.appendChild(
        empty
      );

      return;

    }



    rows.forEach(x => {

      const el =
      document.createElement(
        'div'
      );

      el.className =
      'item';


      const n =
      document.createElement(
        'div'
      );

      n.className =
      'n';

      n.textContent =
      x.result_number;


      const d =
      document.createElement(
        'div'
      );

      d.className =
      'd';

      d.textContent =
      formatMMT(
        x.published_at
      );


      el.appendChild(n);

      el.appendChild(d);

      box.appendChild(el);

    });



  }catch(e){

    state.innerHTML =
    '<span class="err">'
    +
    t.failed
    +
    '</span>';


    const box =
    document.getElementById(
      'history'
    );


    box.innerHTML =
    '';


    const empty =
    document.createElement(
      'div'
    );

    empty.className =
    'empty';

    empty.textContent =
    t.historyFailed;

    box.appendChild(
      empty
    );

  }

}



applyLanguage();

loadSiteSettings();

loadResults();


/* 每 30 秒自动同步 */

setInterval(
  loadResults,
  30000
);

setInterval(
  loadSiteSettings,
  30000
);

</script>

</body>
</html>
