}

  padding-top:16px;

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4bc58a;
  margin-right:6px
}

.err{
  color:#dba0a0
}

<body>

    </div>

    <div class="langbox">
      <select id="language" onchange="changeLanguage(this.value)">
        <option value="zh">🇨🇳 中文</option>

  <main class="card">

    </div>

    </div>

    <div class="meta">

      </div>

      <div class="row">
        <span id="timezoneLabel">时区</span>
        <span id="timezoneValue">Myanmar Time (MMT)</span>
      </div>

      <div class="row">
        <span id="rangeLabel">历史范围</span>
        <span id="rangeValue">最近 14 天</span>
      </div>

    </div>

    <section class="hist">

      <h3 id="historyTitle">
        历史公告 · HISTORY
      </h3>

      <div id="history">
        <div class="empty" id="loadingHistory">
          正在读取...
        </div>
      </div>

    </section>

    <div class="foot" id="footerText">
      © 2022 JIN MANTANG · 泰国 2D
    </div>

  </main>

</div>


<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';

const KEY =

const T = {

},

waiting:'ချိတ်ဆက်ပြီး · ထုတ်ပြန်ချက်ကို စောင့်နေသည်',

waiting:'Đã kết nối · Đang chờ kết quả',
publish:'Thời gian công bố',
timezone:'Múi giờ',
timezoneValue:'Giờ Myanmar (MMT)',

rangeValue:'14 ngày gần nhất',
history:'LỊCH SỬ KẾT QUẢ',
loading:'Đang tải...',
empty:'Không có kết quả trong 14 ngày gần nhất',
failed:'Kết nối thất bại. Vui lòng thử lại.',
historyFailed:'Không thể tải lịch sử',
footer:'© 2022 JIN MANTANG · THAILAND 2D'
},

id:{
latest:'HASIL TERBARU · LATEST RESULT',
connecting:'Sedang menghubungkan...',
connected:'Terhubung · Hasil terbaru telah disinkronkan',
waiting:'Terhubung · Menunggu hasil',
publish:'Waktu publikasi',
timezone:'Zona waktu',
timezoneValue:'Waktu Myanmar (MMT)',
range:'Rentang riwayat',
rangeValue:'14 hari terakhir',
history:'RIWAYAT HASIL',
loading:'Sedang memuat...',
empty:'Tidak ada hasil dalam 14 hari terakhir',
failed:'Koneksi gagal. Silakan coba lagi.',
historyFailed:'Tidak dapat memuat riwayat',
footer:'© 2022 JIN MANTANG · THAILAND 2D'
}

};


let currentLang =
localStorage.getItem('jmt_lang') || 'zh';


function changeLanguage(lang){

  currentLang = lang;

  localStorage.setItem(
    'jmt_lang',
    lang
  );

  applyLanguage();

  loadResults();
}


function applyLanguage(){

  const t = T[currentLang] || T.zh;

  document.documentElement.lang = currentLang;

  document.getElementById(
    'language'
  ).value = currentLang;

  document.getElementById(
    'latestLabel'
  ).textContent = t.latest;

  document.getElementById(
    'publishLabel'
  ).textContent = t.publish;

  document.getElementById(
    'timezoneLabel'
  ).textContent = t.timezone;

  document.getElementById(
    'timezoneValue'
  ).textContent = t.timezoneValue;

  document.getElementById(
    'rangeLabel'
  ).textContent = t.range;

  document.getElementById(
    'rangeValue'
  ).textContent = t.rangeValue;

  document.getElementById(
    'historyTitle'
  ).textContent = t.history;

  document.getElementById(
    'footerText'
  ).textContent = t.footer;

}


function formatMMT(iso){

  const d = new Date(iso);

  return new Intl.DateTimeFormat(
    currentLang === 'zh' ? 'zh-CN' :
    currentLang === 'th' ? 'th-TH' :
    currentLang === 'my' ? 'my-MM' :
    currentLang === 'ms' ? 'ms-MY' :
    currentLang === 'vi' ? 'vi-VN' :
    currentLang === 'id' ? 'id-ID' :
    'en-GB',
    {
      timeZone:'Asia/Yangon',
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',
      hour12:false
    }
  ).format(d) + ' MMT';

}


async function loadResults(){

  const t = T[currentLang] || T.zh;

  const state =
  document.getElementById('state');

  state.textContent = t.connecting;

  try{

    const cutoff =
    new Date(
      Date.now() -
      14*24*60*60*1000
    ).toISOString();

    const url =
    BASE +
    '/rest/v1/results?select=id,result_number,published_at&published_at=gte.' +
    encodeURIComponent(cutoff) +
    '&order=published_at.desc&limit=100';

    const r = await fetch(
      url,
      {
        headers:{
          apikey:KEY,
          Authorization:'Bearer ' + KEY
        }
      }
    );

    if(!r.ok){
      throw new Error(
        'HTTP ' + r.status
      );
    }

    const rows =
    await r.json();

    const latest =
    rows[0];

    document.getElementById(
      'latest'
    ).textContent =
    latest
    ? latest.result_number
    : '--';

    document.getElementById(
      'time'
    ).textContent =
    latest
    ? formatMMT(latest.published_at)
    : '—';

    state.innerHTML =
    latest
    ? '<span class="dot"></span>' + t.connected
    : '<span class="dot"></span>' + t.waiting;


    const box =
    document.getElementById('history');

    box.innerHTML = '';


    if(!rows.length){

      box.innerHTML =
      '<div class="empty">' +
      t.empty +
      '</div>';

      return;

    }


    rows.forEach(x => {

      const el =
      document.createElement('div');

      el.className =
      'item';

      el.innerHTML =
      '<div class="n">' +
      x.result_number +
      '</div>' +
      '<div class="d">' +
      formatMMT(x.published_at) +
      '</div>';

      box.appendChild(el);

    });


  }catch(e){

    state.innerHTML =
    '<span class="err">' +
    t.failed +
    '</span>';

    document.getElementById(
      'history'
    ).innerHTML =
    '<div class="empty">' +
    t.historyFailed +
    '</div>';

  }

}


applyLanguage();

loadResults();

setInterval(
  loadResults,
  30000
);

</script>
