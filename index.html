function hasResult(
  value
){

  return (
    value !==
    null
    &&
    value !==
    undefined
    &&
    value !==
    ''
  );

}


function normalizeResult(
  value
){

  if(
    !hasResult(
      value
    )
  ){

    return '--';

  }


  const text =
  String(
    value
  )
  .trim();


  if(
    /^\d{1,2}$/.test(
      text
    )
  ){

    return text.padStart(
      2,
      '0'
    );

  }


  return text;

}

function toggleZodiacGuide(
  force
){

  const backdrop =
  document.getElementById(
    'zodiacGuideBackdrop'
  );


  if(!backdrop){
    return;
  }


  const shouldOpen =
  typeof force ===
  'boolean'

  ?

  force

  :

  !backdrop.classList.contains(
    'open'
  );


  backdrop.classList.toggle(
    'open',
    shouldOpen
  );


  backdrop.setAttribute(
    'aria-hidden',
    shouldOpen
    ?
    'false'
    :
    'true'
  );


  document.body.style.overflow =
  shouldOpen
  ?
  'hidden'
  :
  '';

}

/* =====================================
   NOTICE SPEED
===================================== */

function updateNoticeSpeed(){

  const noticeText =
  document.getElementById(
    'noticeText'
  );


  const viewport =
  document.querySelector(
    '.noticeViewport'
  );


  if(
    !noticeText
    ||
    !viewport
  ){

    return;

  }


  if(
    !noticeText.textContent
    .trim()
  ){

    return;

  }


  /*
    noticeTrack 本身包含：
    - 左侧一整屏的起始空白
    - 公告文字

    所以直接使用 scrollWidth
    作为完整滚动距离。

    速度约为每秒 24 像素。
    公告越长，动画时间自然越长。
  */


  const distance =
  noticeText.scrollWidth;


  let seconds =
  distance /
  24;


  /*
    太短的公告也不要跑得太快。
  */

  seconds =
  Math.max(
    28,
    seconds
  );


  /*
    极长公告也限制在合理范围，
    避免一轮等待时间过久。
  */

  seconds =
  Math.min(
    85,
    seconds
  );


  noticeText.style
  .animationDuration =
  seconds.toFixed(
    1
  )
  +
  's';

}

/* =====================================
   TIME FORMAT
===================================== */

function formatMMT(
  iso
){

  if(!iso){

    return '—';

  }


  const d =
  new Date(
    iso
  );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return '—';

  }


  const locale =

  currentLang ===
  'zh'

  ?

  'zh-CN'

  :

  currentLang ===
  'th'

  ?

  'th-TH'

  :

  currentLang ===
  'my'

  ?

  'my-MM'

  :

  currentLang ===
  'ms'

  ?

  'ms-MY'

  :

  currentLang ===
  'vi'

  ?

  'vi-VN'

  :

  currentLang ===
  'id'

  ?

  'id-ID'

  :

  'en-GB';


  return new Intl.DateTimeFormat(
    locale,
    {
      timeZone:
      'Asia/Yangon',

      year:'numeric',
      month:'2-digit',
      day:'2-digit',

      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',

      hour12:false
    }
  )
  .format(
    d
  )
  +
  ' MMT';

}


/* =====================================
   SITE SETTINGS
===================================== */

async function loadSiteSettings(){

  try{

    const r =
    await fetch(
      BASE+
      '/rest/v1/site_settings'+
      '?id=eq.1'+
      '&select=telegram_url,announcement_text,announcement_enabled,logo_data_url,updated_at',
      {
        headers:{
          apikey:KEY,
          Authorization:
          'Bearer '+KEY
        }
      }
    );


    if(!r.ok){

      throw new Error(
        'SETTINGS_FAILED'
      );

    }


    const rows =
    await r.json();


    if(
      !Array.isArray(
        rows
      )
      ||
      !rows.length
    ){

      return;

    }


    siteSettings = {
      ...siteSettings,
      ...rows[0]
    };


    renderSiteSettings();


  }catch(e){

    console.log(
      'Unable to load site settings'
    );

  }

}


/* =====================================
   RENDER SETTINGS
===================================== */

function renderSiteSettings(){

  const logo =
  document.getElementById(
    'siteLogo'
  );


  const logoData =
  String(
    siteSettings.logo_data_url
    ||
    ''
  )
  .trim();


  if(
    logoData
  ){

    logo.innerHTML =
    '';


    const img =
    document.createElement(
      'img'
    );


    img.src =
    logoData;


    img.alt =
    'JIN MANTANG';


    logo.appendChild(
      img
    );

  }

  else{

    logo.textContent =
    '金';

  }


  const noticeWrap =
  document.getElementById(
    'noticeWrap'
  );


  const noticeText =
  document.getElementById(
    'noticeText'
  );


  const announcement =
  String(
    siteSettings.announcement_text
    ||
    ''
  )
  .trim();


  if(
    siteSettings.announcement_enabled
    &&
    announcement
  ){

    noticeText.textContent =
    announcement;


    noticeWrap.style.display =
    'block';


    /*
      公告真正显示之后，
      再读取它的实际宽度。

      双 requestAnimationFrame
      是为了确保手机 Safari
      已经完成排版。
    */

    requestAnimationFrame(
      ()=>{

        requestAnimationFrame(
          updateNoticeSpeed
        );

      }
    );

  }

  else{

    noticeWrap.style.display =
    'none';


    noticeText.textContent =
    '';

  }


  const telegramBox =
  document.getElementById(
    'telegramBox'
  );


  const telegramLink =
  document.getElementById(
    'telegramLink'
  );


  const telegram =
  String(
    siteSettings.telegram_url
    ||
    ''
  )
  .trim();


  if(
    !telegram
  ){

    telegramBox.style.display =
    'none';


    telegramLink.href =
    '#';


    return;

  }


  try{

    const u =
    new URL(
      telegram
    );


    if(
      u.protocol !==
      'https:'
      &&
      u.protocol !==
      'http:'
    ){

      throw new Error();

    }


    telegramLink.href =
    telegram;


    telegramBox.style.display =
    'block';


  }catch(e){

    telegramBox.style.display =
    'none';


    telegramLink.href =
    '#';

  }

}


/* =====================================
   LOAD RESULTS
===================================== */

async function loadResults(
  showConnecting=true
){

  const t =
  getT();


  const state =
  document.getElementById(
    'state'
  );


  if(
    showConnecting
  ){

    state.textContent =
    t.connecting;

  }


  try{

    /*
      最近14天。
    */

    const cutoff =
    new Date(
      Date.now()
      -
      14*
      24*
      60*
      60*
      1000
    )
    .toISOString();


    const url =
    BASE+
    '/rest/v1/results'+
    '?select=id,result_number,published_at,game_mode'+
    '&published_at=gte.'+
    encodeURIComponent(
      cutoff
    )+
    '&order=published_at.desc'+
    '&limit=100';


    const r =
    await fetch(
      url,
      {
        headers:{
          apikey:KEY,
          Authorization:
          'Bearer '+KEY
        }
      }
    );


    if(!r.ok){

      throw new Error(
        'HTTP '+
        r.status
      );

    }


    const rows =
    await r.json();


    if(
      !Array.isArray(
        rows
      )
    ){

      throw new Error(
        'INVALID_RESULTS'
      );

    }


    const latest =
    rows.length
    ?
    rows[0]
    :
    null;


    renderLatestResult(
  latest
);


    document.getElementById(
      'time'
    ).textContent =

    latest
    &&
    latest.published_at

    ?

    formatMMT(
      latest.published_at
    )

    :

    '—';


    state.innerHTML =

    latest

    ?

    '<span class="dot"></span>'+
    escapeHtml(
      t.connected
    )

    :

    '<span class="dot"></span>'+
    escapeHtml(
      t.waiting
    );


    renderHistory(
      rows
    );


    document.getElementById(
      'lastSync'
    ).textContent =
    t.lastSync+
    '：'+
    getMMTClock();


  }catch(e){

    console.error(
      e
    );


    state.innerHTML =
    '<span class="err">'+
    escapeHtml(
      t.failed
    )+
    '</span>';


    const box =
    document.getElementById(
      'history'
    );


    /*
      读取失败时，
      如果页面本来已经有历史，
      不清空之前成功的数据。
    */

    if(
      !box.children.length
      ||
      (
        box.children.length ===
        1
        &&
        box.firstElementChild
        ?.classList
        .contains(
          'empty'
        )
      )
    ){

      box.innerHTML =
      '';


      const empty =
      document.createElement(
        'div'
      );


      empty.className =
      'empty';


      empty.textContent =
      t.historyFailed;


      box.appendChild(
        empty
      );

    }

  }

}


/* =====================================
   HISTORY
===================================== */

function renderHistory(
  rows
){

  const t =
  getT();


  const box =
  document.getElementById(
    'history'
  );


  box.innerHTML =
  '';


  if(
    !rows.length
  ){

    const empty =
    document.createElement(
      'div'
    );


    empty.className =
    'empty';


    empty.textContent =
    t.empty;


    box.appendChild(
      empty
    );


    return;

  }


  rows.forEach(
    (
      item,
      index
    )=>{


      if(
        !hasResult(
          item.result_number
        )
      ){

        return;

      }


      const el =
      document.createElement(
        'div'
      );


      el.className =
      index === 0
      ?
      'item latestItem'
      :
      'item';


      const n =
      document.createElement(
        'div'
      );


      n.className =
      'n';


      if(
  item.game_mode ===
  'zodiac'
){

  const zodiacName =
  getZodiacName(
    item.result_number
  );

  const zodiacImage =
  getZodiacImage(
    item.result_number
  );

  n.className =
  'n zodiacHistoryResult';

  const img =
  document.createElement(
    'img'
  );

  img.src =
  zodiacImage;

  img.alt =
  zodiacName;

  const name =
  document.createElement(
    'span'
  );

  name.textContent =
  zodiacName;

  n.appendChild(
    img
  );

  n.appendChild(
    name
  );

}

else{

  n.textContent =
  normalizeResult(
    item.result_number
  );

}


      const d =
      document.createElement(
        'div'
      );


      d.className =
      'd';


      d.textContent =
      formatMMT(
        item.published_at
      );


      el.appendChild(
        n
      );


      el.appendChild(
        d
      );


      box.appendChild(
        el
      );

    }
  );


  /*
    如果数据存在，
    但全部没有有效 result_number，
    仍显示空状态。
  */

  if(
    !box.children.length
  ){

    const empty =
    document.createElement(
      'div'
    );


    empty.className =
    'empty';


    empty.textContent =
    t.empty;


    box.appendChild(
      empty
    );

  }

}


/* =====================================
   CURRENT MMT CLOCK
===================================== */

function getMMTClock(){

  return new Intl.DateTimeFormat(
    'zh-CN',
    {
      timeZone:
      'Asia/Yangon',

      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit',

      hour12:false
    }
  )
  .format(
    new Date()
  );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ''
  )

  .replaceAll(
    '&',
    '&amp;'
  )

  .replaceAll(
    '<',
    '&lt;'
  )

  .replaceAll(
    '>',
    '&gt;'
  )

  .replaceAll(
    '"',
    '&quot;'
  )

  .replaceAll(
    "'",
    '&#039;'
  );

}

   RESIZE
===================================== */

  手机横竖屏切换、
  浏览器尺寸变化时，

*/

window.addEventListener(
