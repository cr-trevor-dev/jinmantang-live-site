<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">
<title>金满堂 · Result Notice</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#1b1409 0,#0b0b0c 40%,#070708 100%);color:#f7f0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:20px 15px 44px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#f0d486;border:1px solid #aa7a23;background:linear-gradient(145deg,#2b1d08,#0e0d0a);box-shadow:0 0 20px rgba(214,168,63,.15)}
.cn{font-weight:900;font-size:20px;letter-spacing:3px;color:#f3d889}
.en{font-size:10px;letter-spacing:2px;color:#9b8d68;margin-top:2px}
.thai{font-size:10px;color:#bba974;margin-top:2px}
.flag{font-size:26px}
.card{background:linear-gradient(180deg,rgba(21,21,21,.98),rgba(12,12,13,.98));border:1px solid rgba(214,168,63,.3);border-radius:24px;padding:23px;box-shadow:0 24px 65px rgba(0,0,0,.4)}
.label{text-align:center;font-size:12px;color:#b7a879;letter-spacing:1.5px}
.number{font-size:94px;line-height:1;text-align:center;font-weight:950;letter-spacing:8px;margin:18px 0 8px;background:linear-gradient(180deg,#fff0b2,#e7bd55 55%,#a8731e);-webkit-background-clip:text;background-clip:text;color:transparent}
.state{text-align:center;color:#bcb3a0;font-size:13px;min-height:20px}
.meta{margin-top:23px;border-top:1px solid rgba(255,255,255,.07)}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.row span:first-child{color:#8f8a80}
.row span:last-child{font-weight:700;color:#efe0b2;text-align:right}
.hist{margin-top:22px}
.hist h3{font-size:14px;color:#d7bf7b;margin:0 0 10px}
.item{display:flex;justify-content:space-between;align-items:center;background:#111112;border:1px solid rgba(255,255,255,.06);padding:12px 13px;border-radius:13px;margin-bottom:8px}
.item .n{font-size:25px;font-weight:900;color:#e8c86e}
.item .d{font-size:11px;color:#8e897f;text-align:right}
.empty{color:#77736b;font-size:12px;padding:12px 0;text-align:center}
.foot{text-align:center;color:#77736b;font-size:11px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4bc58a;margin-right:6px}
.err{color:#dba0a0}
</style>
</head>

<body>
<div class="wrap">

  <div class="head">
    <div class="brand">
      <div class="mark">金</div>
      <div>
        <div class="cn">金满堂</div>
        <div class="en">JIN MANTANG</div>
        <div class="thai">ประเทศไทย 2D · RESULT NOTICE</div>
      </div>
    </div>

    <div class="flag">🇹🇭</div>
  </div>

  <main class="card">

    <div class="label">最新数字公告 · LATEST RESULT</div>

    <div class="number" id="latest">--</div>

    <div class="state" id="state">正在连接...</div>

    <div class="meta">

      <div class="row">
        <span>发布时间</span>
        <span id="time">—</span>
      </div>

      <div class="row">
        <span>时区</span>
        <span>Myanmar Time (MMT)</span>
      </div>

      <div class="row">
        <span>历史范围</span>
        <span>最近 14 天</span>
      </div>

    </div>

    <section class="hist">

      <h3>历史公告 · HISTORY</h3>

      <div id="history">
        <div class="empty">正在读取...</div>
      </div>

    </section>

    <div class="foot">
      © 2022 JIN MANTANG · 泰国 2D
    </div>

  </main>

</div>

<script>

const BASE = 'https://veserwfjxglxieehfggy.supabase.co';

const KEY = 'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';

function formatMMT(iso) {

  const d = new Date(iso);

  return new Intl.DateTimeFormat('zh-CN', {

    timeZone:'Asia/Yangon',

    year:'numeric',

    month:'2-digit',

    day:'2-digit',

    hour:'2-digit',

    minute:'2-digit',

    second:'2-digit',

    hour12:false

  }).format(d) + ' MMT';

}

async function loadResults() {

  const state = document.getElementById('state');

  try {

    const cutoff = new Date(
      Date.now() - 14*24*60*60*1000
    ).toISOString();

    const url =
      BASE +
      '/rest/v1/results?select=id,result_number,published_at&published_at=gte.' +
      encodeURIComponent(cutoff) +
      '&order=published_at.desc&limit=100';

    const r = await fetch(url, {

      headers: {

        apikey: KEY,

        Authorization: 'Bearer ' + KEY

      }

    });

    if (!r.ok)
      throw new Error('HTTP ' + r.status);

    const rows = await r.json();

    const latest = rows[0];

    document.getElementById('latest').textContent =
      latest ? latest.result_number : '--';

    document.getElementById('time').textContent =
      latest ? formatMMT(latest.published_at) : '—';

    state.innerHTML =
      latest
      ? '<span class="dot"></span>已连接 · 最新结果已同步'
      : '<span class="dot"></span>已连接 · 等待发布';

    const box =
      document.getElementById('history');

    box.innerHTML = '';

    if (!rows.length) {

      box.innerHTML =
        '<div class="empty">最近 14 天暂无公告</div>';

      return;

    }

    rows.forEach(x => {

      const el =
        document.createElement('div');

      el.className = 'item';

      el.innerHTML =
        '<div class="n">' +
        x.result_number +
        '</div><div class="d">' +
        formatMMT(x.published_at) +
        '</div>';

      box.appendChild(el);

    });

  } catch (e) {

    state.innerHTML =
      '<span class="err">连接失败，请稍后刷新</span>';

    document.getElementById('history').innerHTML =
      '<div class="empty">暂时无法读取记录</div>';

  }

}

loadResults();

setInterval(loadResults,30000);

</script>

</body>
</html>
