<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090a">
<title>金满堂 · 历史期数</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#251907 0,#0d0c0a 40%,#070708 100%);
  color:#f5edd9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

.wrap{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding:24px 16px 60px
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:26px
}

.headTitle{
  color:#efd477;
  font-size:28px;
  font-weight:900;
  line-height:1.3
}

.headSub{
  color:#8a8170;
  font-size:11px;
  letter-spacing:4px;
  margin-top:7px
}

.back{
  text-decoration:none;
  color:#efd477;
  background:#181819;
  border:1px solid rgba(214,168,63,.30);
  border-radius:18px;
  padding:14px 17px;
  font-weight:900;
  font-size:13px;
  flex:none
}

.card{
  background:linear-gradient(180deg,#151515,#0d0d0e);
  border:1px solid rgba(214,168,63,.30);
  border-radius:25px;
  padding:20px;
  margin-bottom:18px
}

.title{
  color:#dfc575;
  font-size:19px;
  font-weight:900;
  margin-bottom:17px
}

input{
  width:100%;
  border:1px solid rgba(214,168,63,.24);
  background:#101011;
  color:#fff;
  border-radius:13px;
  padding:14px;
  font-size:15px;
  outline:none
}

.roundCard{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:18px;
  padding:17px;
  margin-bottom:12px
}

.roundTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px
}

.roundName{
  color:#efd477;
  font-size:18px;
  font-weight:900;
  line-height:1.45
}

.status{
  border-radius:99px;
  padding:7px 12px;
  font-size:11px;
  font-weight:900;
  white-space:nowrap
}

.status.open{
  background:#103522;
  color:#73d7a0
}

.status.closed{
  background:#322715;
  color:#e4c56e
}

.status.other{
  background:#222;
  color:#aaa
}

.meta{
  color:#8d8577;
  font-size:11px;
  margin-top:8px;
  line-height:1.7
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:14px
}

.stat{
  background:#151516;
  border-radius:13px;
  padding:13px
}

.stat small{
  display:block;
  color:#777064;
  font-size:10px;
  margin-bottom:6px
}

.stat strong{
  color:#e9cc72;
  font-size:17px
}

.detailBtn{
  margin-top:13px;
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  border:1px solid rgba(214,168,63,.28);
  background:#181819;
  color:#efd477;
  border-radius:13px;
  padding:13px;
  font-weight:900;
  font-size:13px
}

.empty{
  text-align:center;
  color:#777166;
  padding:45px 10px
}

.grid100{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.numBox{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
  padding:13px
}

.numBox.active{
  border-color:rgba(214,168,63,.45)
}

.num{
  color:#e9cc72;
  font-weight:900
}

.points{
  color:#eee3c9;
  font-weight:800
}

.agentCard{
  background:#101011;
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:15px;
  margin-bottom:11px
}

.agentName{
  color:#efd477;
  font-size:16px;
  font-weight:900
}

.agentMeta{
  color:#8b8374;
  font-size:11px;
  line-height:1.6;
  margin-top:6px
}

.agentNumbers{
  margin-top:11px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.agentNum{
  display:flex;
  justify-content:space-between;
  background:#161617;
  border-radius:10px;
  padding:9px 11px;
  font-size:11px
}

.detailHeader{
  margin-bottom:14px
}

.detailTitle{
  color:#efd477;
  font-size:22px;
  font-weight:900
}

.closeDetail{
  margin-top:13px;
  width:100%;
  border:1px solid rgba(214,168,63,.28);
  background:#181819;
  color:#efd477;
  border-radius:13px;
  padding:13px;
  font-size:13px;
  font-weight:900
}

.hidden{display:none!important}

.msg{
  text-align:center;
  color:#8c8578;
  font-size:12px;
  padding:15px
}

.foot{
  text-align:center;
  color:#6f6a61;
  font-size:10px;
  margin-top:27px
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">

    <div>
      <div class="headTitle">
        金满堂 · 历史期数
      </div>

      <div class="headSub">
        ADMIN / ROUND HISTORY
      </div>
    </div>

    <a
      class="back"
      href="/admin/index.html">
      返回总后台
    </a>

  </div>


  <div class="card">

    <div class="title">
      搜索历史
    </div>

    <input
      id="searchDate"
      type="date"
      onchange="renderRounds()">

  </div>


  <div class="card" id="listCard">

    <div class="title">
      历史期数
    </div>

    <div id="roundList">
      <div class="msg">
        正在读取...
      </div>
    </div>

  </div>


  <div
    class="card hidden"
    id="detailCard">

    <div class="detailHeader">

      <div
        class="detailTitle"
        id="detailTitle">
        本期详情
      </div>

      <div
        class="meta"
        id="detailMeta">
      </div>

    </div>


    <div class="stats">

      <div class="stat">
        <small>提交总积分</small>
        <strong id="detailTotal">0</strong>
      </div>

      <div class="stat">
        <small>已提交代理</small>
        <strong id="detailAgents">0</strong>
      </div>

      <div class="stat">
        <small>开奖结果</small>
        <strong id="detailResult">—</strong>
      </div>

      <div class="stat">
        <small>状态</small>
        <strong id="detailStatus">—</strong>
      </div>

    </div>

  </div>


  <div
    class="card hidden"
    id="numbersCard">

    <div class="title">
      00–99 本期汇总
    </div>

    <div
      class="grid100"
      id="numbersGrid">
    </div>

  </div>


  <div
    class="card hidden"
    id="agentsCard">

    <div class="title">
      本期代理提交
    </div>

    <div id="agentsList"></div>

    <button
      class="closeDetail"
      onclick="closeDetail()">
      ← 返回历史期数
    </button>

  </div>


  <div class="foot">
    © 2022 JIN MANTANG · ROUND HISTORY
  </div>

</div>


<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';

const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =
localStorage.getItem(
  'jmt_access_token'
)
||
sessionStorage.getItem(
  'jmt_access_token'
)
||
'';


let rounds = [];
let agentsMap = {};


async function api(
  path,
  options={}
){

  return fetch(
    BASE + path,
    {
      ...options,

      headers:{
        apikey:KEY,
        Authorization:'Bearer '+token,
        ...(options.headers || {})
      }
    }
  );

}


async function verifyAdmin(){

  if(!token){

    location.href =
    '/admin/index.html';

    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){

      throw new Error();

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(
      '/rest/v1/admin_users'+
      '?auth_user_id=eq.'+
      encodeURIComponent(
        user.id
      )+
      '&select=auth_user_id'+
      '&limit=1'
    );


    if(!adminRes.ok){

      throw new Error();

    }


    const admins =
    await adminRes.json();


    if(!admins.length){

      throw new Error();

    }


    return true;


  }catch(e){

    location.href =
    '/admin/index.html';

    return false;

  }

}


async function loadAll(){

  try{

    const rr =
    await api(
      '/rest/v1/rounds'+
      '?select=id,round_date,round_code,deadline_at,result_number,status,created_at,settled_at'+
      '&order=round_date.desc,created_at.desc'
    );


    if(!rr.ok){

      throw new Error(
        await rr.text()
      );

    }


    rounds =
    await rr.json();


    const ar =
    await api(
      '/rest/v1/agents'+
      '?select=id,display_name,commission_rate,status'
    );


    if(ar.ok){

      const agents =
      await ar.json();


      agents.forEach(
        a=>{

          agentsMap[a.id] =
          a;

        }
      );

    }


    renderRounds();


    const params =
    new URLSearchParams(
      location.search
    );


    const roundId =
    params.get(
      'round'
    );


    if(roundId){

      openDetail(
        roundId
      );

    }


  }catch(e){

    document.getElementById(
      'roundList'
    ).innerHTML =
    '<div class="empty">读取失败</div>';

  }

}


function renderRounds(){

  const holder =
  document.getElementById(
    'roundList'
  );


  const date =
  document.getElementById(
    'searchDate'
  ).value;


  const filtered =
  rounds.filter(
    r =>
    !date
    ||
    r.round_date === date
  );


  if(!filtered.length){

    holder.innerHTML =
    '<div class="empty">没有找到历史期数</div>';

    return;

  }


  holder.innerHTML =
  '';


  filtered.forEach(
    round=>{

      const el =
      document.createElement(
        'div'
      );


      el.className =
      'roundCard';


      el.innerHTML = `

        <div class="roundTop">

          <div class="roundName">
            ${escapeHtml(round.round_date)}
            ·
            ${escapeHtml(periodName(round.round_code))}
          </div>

          <div class="status ${statusClass(round.status)}">
            ${escapeHtml(statusName(round.status))}
          </div>

        </div>


        <div class="meta">
          截止：
          ${escapeHtml(formatMMT(round.deadline_at))}
          <br>

          结果：
          ${
            round.result_number
            ? escapeHtml(round.result_number)
            : '—'
          }
        </div>


        <div class="stats">

          <div class="stat">
            <small>提交总积分</small>
            <strong id="total-${round.id}">
              读取中
            </strong>
          </div>

          <div class="stat">
            <small>已提交代理</small>
            <strong id="agents-${round.id}">
              读取中
            </strong>
          </div>

        </div>


        <a
          class="detailBtn"
          href="?round=${encodeURIComponent(round.id)}">
          查看本期详情
        </a>

      `;


      holder.appendChild(
        el
      );


      loadRoundStats(
        round.id
      );

    }
  );

}


async function loadRoundStats(
  roundId
){

  try{

    const r =
    await api(
      '/rest/v1/agent_submissions'+
      '?round_id=eq.'+
      encodeURIComponent(
        roundId
      )+
      '&select=agent_id,points'
    );


    if(!r.ok){

      throw new Error();

    }


    const rows =
    await r.json();


    let total =
    0;


    const set =
    new Set();


    rows.forEach(
      row=>{

        const p =
        Number(
          row.points || 0
        );


        total += p;


        if(p>0){

          set.add(
            row.agent_id
          );

        }

      }
    );


    const totalEl =
    document.getElementById(
      'total-'+roundId
    );


    const agentEl =
    document.getElementById(
      'agents-'+roundId
    );


    if(totalEl){

      totalEl.textContent =
      formatNumber(
        total
      );

    }


    if(agentEl){

      agentEl.textContent =
      set.size;

    }


  }catch(e){}

}


async function openDetail(
  roundId
){

  const round =
  rounds.find(
    r =>
    r.id === roundId
  );


  if(!round){

    return;

  }


  document.getElementById(
    'listCard'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'detailCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'numbersCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'agentsCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'detailTitle'
  ).textContent =
  round.round_date+
  ' · '+
  periodName(
    round.round_code
  );


  document.getElementById(
    'detailMeta'
  ).textContent =
  '截止：'+
  formatMMT(
    round.deadline_at
  );


  document.getElementById(
    'detailResult'
  ).textContent =
  round.result_number || '—';


  document.getElementById(
    'detailStatus'
  ).textContent =
  statusName(
    round.status
  );


  await loadDetailData(
    round
  );

}


async function loadDetailData(
  round
){

  const r =
  await api(
    '/rest/v1/agent_submissions'+
    '?round_id=eq.'+
    encodeURIComponent(
      round.id
    )+
    '&select=agent_id,number_code,points,submitted_at,updated_at'+
    '&order=agent_id.asc,number_code.asc'
  );


  if(!r.ok){

    document.getElementById(
      'agentsList'
    ).innerHTML =
    '<div class="empty">读取代理数据失败</div>';

    return;

  }


  const rows =
  await r.json();


  let total =
  0;


  const numbers =
  {};


  for(
    let i=0;
    i<100;
    i++
  ){

    numbers[
      String(i).padStart(
        2,
        '0'
      )
    ] = 0;

  }


  const grouped =
  {};


  rows.forEach(
    row=>{

      const p =
      Number(
        row.points || 0
      );


      total += p;


      const code =
      String(
        row.number_code || ''
      ).padStart(
        2,
        '0'
      );


      if(
        numbers[code] !==
        undefined
      ){

        numbers[code] += p;

      }


      if(!grouped[row.agent_id]){

        grouped[row.agent_id] =
        [];

      }


      grouped[
        row.agent_id
      ].push(
        row
      );

    }
  );


  document.getElementById(
    'detailTotal'
  ).textContent =
  formatNumber(
    total
  );


  document.getElementById(
    'detailAgents'
  ).textContent =
  Object.keys(
    grouped
  ).length;


  renderNumbers(
    numbers
  );


  renderAgents(
    grouped
  );

}


function renderNumbers(
  numbers
){

  const holder =
  document.getElementById(
    'numbersGrid'
  );


  holder.innerHTML =
  '';


  Object.keys(
    numbers
  ).forEach(
    code=>{

      const points =
      numbers[code];


      const div =
      document.createElement(
        'div'
      );


      div.className =
      'numBox'+
      (
        points>0
        ? ' active'
        : ''
      );


      div.innerHTML = `

        <span class="num">
          ${code}
        </span>

        <span class="points">
          ${formatNumber(points)}
        </span>

      `;


      holder.appendChild(
        div
      );

    }
  );

}


function renderAgents(
  grouped
){

  const holder =
  document.getElementById(
    'agentsList'
  );


  holder.innerHTML =
  '';


  const ids =
  Object.keys(
    grouped
  );


  if(!ids.length){

    holder.innerHTML =
    '<div class="empty">本期没有代理提交</div>';

    return;

  }


  ids.forEach(
    id=>{

      const agent =
      agentsMap[id];


      const rows =
      grouped[id];


      let total =
      0;


      rows.forEach(
        r=>{

          total +=
          Number(
            r.points || 0
          );

        }
      );


      const card =
      document.createElement(
        'div'
      );


      card.className =
      'agentCard';


      const rate =
      agent
      ? agent.commission_rate
      : null;


      let html = `

        <div class="agentName">
          ${
            escapeHtml(
              agent
              ? agent.display_name
              : '未知代理'
            )
          }
        </div>

        <div class="agentMeta">
          提交总积分：
          ${formatNumber(total)}
          ${
            rate !== null
            &&
            rate !== undefined

            ? '<br>代理比例：'+
              escapeHtml(
                String(rate)
              )+
              '%'

            : ''
          }
        </div>

        <div class="agentNumbers">

      `;


      rows
      .filter(
        row =>
        Number(
          row.points || 0
        ) > 0
      )
      .forEach(
        row=>{

          html += `

            <div class="agentNum">

              <span>
                ${
                  escapeHtml(
                    String(
                      row.number_code
                    ).padStart(
                      2,
                      '0'
                    )
                  )
                }
              </span>

              <strong>
                ${
                  formatNumber(
                    row.points
                  )
                }
              </strong>

            </div>

          `;

        }
      );


      html +=
      '</div>';


      card.innerHTML =
      html;


      holder.appendChild(
        card
      );

    }
  );

}


function closeDetail(){

  history.replaceState(
    {},
    '',
    '/history/index.html'
  );


  document.getElementById(
    'listCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'detailCard'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'numbersCard'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'agentsCard'
  ).classList.add(
    'hidden'
  );

}


function periodName(
  code
){

  if(code==='1030'){

    return '上午 10:30';

  }


  if(code==='1530'){

    return '下午 15:30';

  }


  return code || '—';

}


function statusName(
  status
){

  if(status==='open'){

    return '开放中';

  }


  if(status==='closed'){

    return '已结束';

  }


  if(status==='settled'){

    return '已结算';

  }


  return status || '—';

}


function statusClass(
  status
){

  if(status==='open'){

    return 'open';

  }


  if(
    status==='closed'
    ||
    status==='settled'
  ){

    return 'closed';

  }


  return 'other';

}


function formatMMT(
  value
){

  if(!value){

    return '—';

  }


  return new Intl.DateTimeFormat(
    'zh-CN',
    {
      timeZone:
      'Asia/Yangon',

      year:'numeric',
      month:'2-digit',
      day:'2-digit',

      hour:'2-digit',
      minute:'2-digit',

      hour12:false
    }
  )
  .format(
    new Date(
      value
    )
  )
  +' MMT';

}


function formatNumber(
  value
){

  return Number(
    value || 0
  ).toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


function escapeHtml(
  value
){

  return String(
    value ?? ''
  )
  .replaceAll(
    '&',
    '&amp;'
  )
  .replaceAll(
    '<',
    '&lt;'
  )
  .replaceAll(
    '>',
    '&gt;'
  )
  .replaceAll(
    '"',
    '&quot;'
  )
  .replaceAll(
    "'",
    '&#039;'
  );

}


async function start(){

  const ok =
  await verifyAdmin();


  if(!ok){

    return;

  }


  await loadAll();

}


start();

</script>

</body>
</html>
