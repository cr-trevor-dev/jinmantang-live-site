<script>

const BASE =
'https://veserwfjxglxieehfggy.supabase.co';


const KEY =
'sb_publishable_mZe5EwSSrSubPL5K5yvJcw_J8LjdiXN';


let token =

localStorage.getItem(
  'jmt_access_token'
)

||

sessionStorage.getItem(
  'jmt_access_token'
)

||

'';


let rounds =
[];


let agentsMap =
{};


/* =====================================
   API
===================================== */

async function api(
  path,
  options={}
){

  return fetch(
    BASE+path,
    {
      ...options,

      headers:{
        apikey:KEY,
        Authorization:
        'Bearer '+token,
        ...(options.headers || {})
      }
    }
  );

}


/* =====================================
   ADMIN VERIFY
===================================== */

async function verifyAdmin(){

  const state =
  document.getElementById(
    'adminState'
  );


  if(!token){

    state.textContent =
    '没有登录';


    return false;

  }


  try{

    const userRes =
    await api(
      '/auth/v1/user'
    );


    if(!userRes.ok){

      throw new Error(
        'LOGIN_EXPIRED'
      );

    }


    const user =
    await userRes.json();


    const adminRes =
    await api(
      '/rest/v1/admin_users'+
      '?auth_user_id=eq.'+
      encodeURIComponent(
        user.id
      )+
      '&select=auth_user_id'+
      '&limit=1'
    );


    if(!adminRes.ok){

      throw new Error(
        'ADMIN_CHECK_FAILED'
      );

    }


    const admins =
    await adminRes.json();


    if(!admins.length){

      throw new Error(
        'NOT_ADMIN'
      );

    }


    localStorage.setItem(
      'jmt_access_token',
      token
    );


    sessionStorage.setItem(
      'jmt_access_token',
      token
    );


    state.textContent =
    '已登录';


    return true;


  }catch(e){

    state.textContent =
    '登录已失效';


    return false;

  }

}


/* =====================================
   LOAD ALL
===================================== */

async function loadAll(){

  try{

    const rr =
    await api(
      '/rest/v1/rounds'+
      '?select=id,round_date,round_code,deadline_at,result_number,status,created_at,settled_at'+
      '&order=round_date.desc,created_at.desc'
    );


    if(!rr.ok){

      throw new Error(
        await rr.text()
        ||
        '无法读取历史期数'
      );

    }


    rounds =
    await rr.json();


    const ar =
    await api(
      '/rest/v1/agents'+
      '?select=id,display_name,commission_rate,status'
    );


    agentsMap =
    {};


    if(ar.ok){

      const agents =
      await ar.json();


      agents.forEach(
        a=>{

          agentsMap[
            a.id
          ] =
          a;

        }
      );

    }


    renderRounds();


    const params =
    new URLSearchParams(
      location.search
    );


    const roundId =
    params.get(
      'round'
    );


    if(roundId){

      await openDetail(
        roundId
      );

    }


  }catch(e){

    document.getElementById(
      'roundList'
    ).innerHTML =
    '<div class="empty">'+
    '读取失败：'+
    escapeHtml(
      e.message
      ||
      '未知错误'
    )+
    '</div>';

  }

}


/* =====================================
   SEARCH
===================================== */

function clearSearch(){

  document.getElementById(
    'searchDate'
  ).value =
  '';


  renderRounds();

}


/* =====================================
   RENDER ROUND LIST
===================================== */

function renderRounds(){

  const holder =
  document.getElementById(
    'roundList'
  );


  const date =
  document.getElementById(
    'searchDate'
  ).value;


  const filtered =
  rounds.filter(
    r =>
    !date
    ||
    r.round_date ===
    date
  );


  if(!filtered.length){

    holder.innerHTML =
    '<div class="empty">'+
    '没有找到历史期数'+
    '</div>';


    return;

  }


  holder.innerHTML =
  '';


  filtered.forEach(
    round=>{


      const el =
      document.createElement(
        'div'
      );


      el.className =
      'roundCard';


      const result =
      hasResult(
        round.result_number
      )

      ?

      String(
        round.result_number
      )
      .padStart(
        2,
        '0'
      )

      :

      '—';


      el.innerHTML = `

        <div class="roundTop">


          <div class="roundName">

            ${escapeHtml(
              round.round_date
            )}

            ·

            ${escapeHtml(
              periodName(
                round.round_code
              )
            )}

          </div>


          <div
            class="status ${statusClass(round.status)}">

            ${escapeHtml(
              statusName(
                round.status
              )
            )}

          </div>


        </div>


        <div class="meta">

          截止：
          ${escapeHtml(
            formatMMT(
              round.deadline_at
            )
          )}

          <br>

          结果：
          ${escapeHtml(
            result
          )}

        </div>


        <div class="stats">


          <div class="stat">

            <small>
              提交总积分
            </small>

            <strong id="total-${round.id}">
              读取中
            </strong>

          </div>


          <div class="stat">

            <small>
              已提交代理
            </small>

            <strong id="agents-${round.id}">
              读取中
            </strong>

          </div>


        </div>


        <a
          class="detailBtn"
          href="?round=${encodeURIComponent(round.id)}">

          查看本期详情

        </a>

      `;


      holder.appendChild(
        el
      );


      loadRoundStats(
        round.id
      );

    }
  );

}


/* =====================================
   ROUND SUMMARY STATS
===================================== */

async function loadRoundStats(
  roundId
){

  try{

    const r =
    await api(
      '/rest/v1/agent_submissions'+
      '?round_id=eq.'+
      encodeURIComponent(
        roundId
      )+
      '&select=agent_id,points'
    );


    if(!r.ok){

      throw new Error();

    }


    const rows =
    await r.json();


    let total =
    0;


    const agentTotals =
    {};


    rows.forEach(
      row=>{


        const points =
        normalizePoints(
          row.points
        );


        total +=
        points;


        if(
          !agentTotals[
            row.agent_id
          ]
        ){

          agentTotals[
            row.agent_id
          ] =
          0;

        }


        agentTotals[
          row.agent_id
        ] +=
        points;

      }
    );


    const submittedAgents =
    Object.values(
      agentTotals
    )
    .filter(
      value =>
      Number(value) > 0
    )
    .length;


    const totalEl =
    document.getElementById(
      'total-'+roundId
    );


    const agentEl =
    document.getElementById(
      'agents-'+roundId
    );


    if(totalEl){

      totalEl.textContent =
      formatNumber(
        total
      );

    }


    if(agentEl){

      agentEl.textContent =
      submittedAgents;

    }


  }catch(e){}

}


/* =====================================
   OPEN DETAIL
===================================== */

async function openDetail(
  roundId
){

  const round =
  rounds.find(
    r =>
    r.id ===
    roundId
  );


  if(!round){

    return;

  }


  document.getElementById(
    'listCard'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'detailCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'numbersCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'agentsCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'detailTitle'
  ).textContent =
  round.round_date+
  ' · '+
  periodName(
    round.round_code
  );


  let detailText =
  '截止：'+
  formatMMT(
    round.deadline_at
  );


  if(
    round.settled_at
  ){

    detailText +=
    '\n结算：'+
    formatMMT(
      round.settled_at
    );

  }


  document.getElementById(
    'detailMeta'
  ).style.whiteSpace =
  'pre-line';


  document.getElementById(
    'detailMeta'
  ).textContent =
  detailText;


  document.getElementById(
    'detailResult'
  ).textContent =
  hasResult(
    round.result_number
  )

  ?

  String(
    round.result_number
  )
  .padStart(
    2,
    '0'
  )

  :

  '—';


  document.getElementById(
    'detailStatus'
  ).textContent =
  statusName(
    round.status
  );


  await loadDetailData(
    round
  );

}


/* =====================================
   LOAD ROUND DETAIL
===================================== */

async function loadDetailData(
  round
){

  const holder =
  document.getElementById(
    'agentsList'
  );


  holder.innerHTML =
  '<div class="msg">'+
  '正在读取详情...'+
  '</div>';


  try{

    const r =
    await api(
      '/rest/v1/agent_submissions'+
      '?round_id=eq.'+
      encodeURIComponent(
        round.id
      )+
      '&select=agent_id,number_code,points,submitted_at,updated_at'+
      '&order=agent_id.asc,number_code.asc'
    );


    if(!r.ok){

      throw new Error(
        await r.text()
        ||
        '读取代理数据失败'
      );

    }


    const rows =
    await r.json();


    let total =
    0;


    const numbers =
    {};


    for(
      let i=0;
      i<100;
      i++
    ){

      numbers[
        String(i)
        .padStart(
          2,
          '0'
        )
      ] =
      0;

    }


    const grouped =
    {};


    rows.forEach(
      row=>{


        const p =
        normalizePoints(
          row.points
        );


        total +=
        p;


        const code =
        String(
          row.number_code ?? ''
        )
        .padStart(
          2,
          '0'
        );


        if(
          Object.prototype
          .hasOwnProperty
          .call(
            numbers,
            code
          )
        ){

          numbers[
            code
          ] +=
          p;

        }


        if(
          !grouped[
            row.agent_id
          ]
        ){

          grouped[
            row.agent_id
          ] =
          [];

        }


        grouped[
          row.agent_id
        ].push(
          row
        );

      }
    );


    const submittedAgentIds =
    Object.keys(
      grouped
    )
    .filter(
      id =>{

        return grouped[id]
        .reduce(
          (
            sum,
            row
          ) =>
          sum+
          normalizePoints(
            row.points
          ),
          0
        ) > 0;

      }
    );


    document.getElementById(
      'detailTotal'
    ).textContent =
    formatNumber(
      total
    );


    document.getElementById(
      'detailAgents'
    ).textContent =
    submittedAgentIds.length;


    renderNumbers(
      numbers
    );


    renderAgents(
      grouped
    );


  }catch(e){

    holder.innerHTML =
    '<div class="empty">'+
    '读取代理数据失败'+
    '</div>';

  }

}


/* =====================================
   NUMBERS
===================================== */

function renderNumbers(
  numbers
){

  const holder =
  document.getElementById(
    'numbersGrid'
  );


  holder.innerHTML =
  '';


  Object.keys(
    numbers
  )
  .forEach(
    code=>{


      const points =
      numbers[
        code
      ];


      const div =
      document.createElement(
        'div'
      );


      div.className =
      'numBox'+
      (
        points > 0
        ?
        ' active'
        :
        ''
      );


      div.innerHTML = `

        <span class="num">
          ${escapeHtml(code)}
        </span>

        <span class="points">
          ${formatNumber(points)}
        </span>

      `;


      holder.appendChild(
        div
      );

    }
  );

}


/* =====================================
   AGENTS
===================================== */

function renderAgents(
  grouped
){

  const holder =
  document.getElementById(
    'agentsList'
  );


  holder.innerHTML =
  '';


  const ids =
  Object.keys(
    grouped
  )
  .filter(
    id =>{

      return grouped[id]
      .reduce(
        (
          sum,
          row
        ) =>
        sum+
        normalizePoints(
          row.points
        ),
        0
      ) > 0;

    }
  );


  if(!ids.length){

    holder.innerHTML =
    '<div class="empty">'+
    '本期没有代理提交'+
    '</div>';


    return;

  }


  ids.forEach(
    id=>{


      const agent =
      agentsMap[
        id
      ];


      const rows =
      grouped[
        id
      ];


      let total =
      0;


      let latestTime =
      null;


      rows.forEach(
        row=>{


          total +=
          normalizePoints(
            row.points
          );


          const rowTime =
          row.updated_at
          ||
          row.submitted_at;


          if(
            rowTime
            &&
            (
              !latestTime
              ||
              new Date(
                rowTime
              )
              >
              new Date(
                latestTime
              )
            )
          ){

            latestTime =
            rowTime;

          }

        }
      );


      const card =
      document.createElement(
        'div'
      );


      card.className =
      'agentCard';


      const rate =
      agent
      ?
      normalizeRate(
        agent.commission_rate
      )
      :
      null;


      let html = `

        <div class="agentName">

          ${
            escapeHtml(
              agent
              ?
              agent.display_name
              :
              '未知代理'
            )
          }

        </div>


        <div class="agentMeta">

          提交总积分：
          ${formatNumber(total)}

          ${
            rate !==
            null

            ?

            '<br>代理比例：'+
            escapeHtml(
              formatRate(
                rate
              )
            )+
            '%'

            :

            ''
          }

          ${
            latestTime

            ?

            '<br>最后提交：'+
            escapeHtml(
              formatMMT(
                latestTime
              )
            )

            :

            ''
          }

        </div>


        <div class="agentNumbers">

      `;


      rows
      .filter(
        row =>
        normalizePoints(
          row.points
        ) > 0
      )
      .sort(
        (
          a,
          b
        ) =>
        String(
          a.number_code
        )
        .localeCompare(
          String(
            b.number_code
          )
        )
      )
      .forEach(
        row=>{


          html += `

            <div class="agentNum">

              <span>

                ${
                  escapeHtml(
                    String(
                      row.number_code
                    )
                    .padStart(
                      2,
                      '0'
                    )
                  )
                }

              </span>

              <strong>

                ${
                  formatNumber(
                    row.points
                  )
                }

              </strong>

            </div>

          `;

        }
      );


      html +=
      '</div>';


      card.innerHTML =
      html;


      holder.appendChild(
        card
      );

    }
  );

}


/* =====================================
   CLOSE DETAIL
===================================== */

function closeDetail(){

  history.replaceState(
    {},
    '',
    '/history/'
  );


  document.getElementById(
    'listCard'
  ).classList.remove(
    'hidden'
  );


  document.getElementById(
    'detailCard'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'numbersCard'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'agentsCard'
  ).classList.add(
    'hidden'
  );

}


/* =====================================
   RESULT CHECK
===================================== */

function hasResult(
  value
){

  return (
    value !==
    null
    &&
    value !==
    undefined
    &&
    value !==
    ''
  );

}


/* =====================================
   RATE
===================================== */

function normalizeRate(
  value
){

  let rate =
  Number(
    value || 0
  );


  if(
    !Number.isFinite(
      rate
    )
  ){

    rate =
    0;

  }


  if(
    rate > 0
    &&
    rate <= 1
  ){

    rate *=
    100;

  }


  return rate;

}


function formatRate(
  value
){

  return Number(
    value || 0
  )
  .toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


/* =====================================
   POINTS
===================================== */

function normalizePoints(
  value
){

  const n =
  Number(
    value || 0
  );


  if(
    !Number.isFinite(n)
    ||
    n < 0
  ){

    return 0;

  }


  return n;

}


/* =====================================
   PERIOD
===================================== */

function periodName(
  code
){

  if(
    code ===
    '1030'
  ){

    return '上午 10:30';

  }


  if(
    code ===
    '1530'
  ){

    return '下午 15:30';

  }


  return code || '—';

}


/* =====================================
   STATUS
===================================== */

function statusName(
  status
){

  if(
    status ===
    'open'
  ){

    return '开放中';

  }


  if(
    status ===
    'closed'
  ){

    return '已关闭';

  }


  if(
    status ===
    'settled'
  ){

    return '已结算';

  }


  return status || '—';

}


function statusClass(
  status
){

  if(
    status ===
    'open'
  ){

    return 'open';

  }


  if(
    status ===
    'closed'
  ){

    return 'closed';

  }


  if(
    status ===
    'settled'
  ){

    return 'settled';

  }


  return 'other';

}


/* =====================================
   TIME
===================================== */

function formatMMT(
  value
){

  if(!value){

    return '—';

  }


  return new Intl.DateTimeFormat(
    'zh-CN',
    {
      timeZone:
      'Asia/Yangon',

      year:'numeric',
      month:'2-digit',
      day:'2-digit',

      hour:'2-digit',
      minute:'2-digit',

      hour12:false
    }
  )
  .format(
    new Date(
      value
    )
  )
  +
  ' MMT';

}


/* =====================================
   NUMBER
===================================== */

function formatNumber(
  value
){

  return Number(
    value || 0
  )
  .toLocaleString(
    'en-US',
    {
      maximumFractionDigits:2
    }
  );

}


/* =====================================
   ESCAPE
===================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ''
  )

  .replaceAll(
    '&',
    '&amp;'
  )

  .replaceAll(
    '<',
    '&lt;'
  )

  .replaceAll(
    '>',
    '&gt;'
  )

  .replaceAll(
    '"',
    '&quot;'
  )

  .replaceAll(
    "'",
    '&#039;'
  );

}


/* =====================================
   CLEAR SESSION
===================================== */

function clearAdminSession(){

  localStorage.removeItem(
    'jmt_access_token'
  );


  sessionStorage.removeItem(
    'jmt_access_token'
  );


  token =
  '';

}


/* =====================================
   START
===================================== */

async function start(){

  const ok =
  await verifyAdmin();


  if(!ok){

    clearAdminSession();


    location.href =
    '/admin/';


    return;

  }


  await loadAll();

}


start();
